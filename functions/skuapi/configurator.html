<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Product Configurator</title>
  <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    input[type=number] { -moz-appearance: textfield; appearance: textfield; }
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13.5px; color: #0f172a; background: #e9ecf1; -webkit-font-smoothing: antialiased; }
    .center { display: grid; place-items: center; min-height: 100vh; text-align: center; padding: 24px; }
    .center > div { background: #fff; border-radius: 14px; padding: 32px 40px; box-shadow: 0 1px 2px rgba(15,23,42,.06), 0 12px 40px rgba(15,23,42,.10); }
    .muted { color: #64748b; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
    button { font: inherit; cursor: pointer; border-radius: 7px; border: 1px solid #d9dfe8; background: #fff; padding: 6px 12px; color: #0f172a; }
    button.primary { background: #0f172a; border-color: #0f172a; color: #fff; }
    button.primary:hover:not(:disabled) { background: #1e293b; }
    button:disabled { opacity: .5; cursor: default; }
    input, select { font: inherit; padding: 6px 8px; border: 1px solid #d9dfe8; border-radius: 7px; color: #0f172a; background: #fff; }
    input:focus { outline: none; border-color: #0f766e; }
    .error { color: #c0392b; }
    .hidden { display: none !important; }

    #v-picker { min-height: 100vh; }
    #card { height: 100vh; background: #fff; overflow: hidden; display: flex; flex-direction: column; }

    #panes { display: flex; flex: 1; min-height: 0; }
    #left { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid #e5e7eb; }
    #right { flex: 0 1 440px; min-width: 380px; background: #f8fafc; display: flex; flex-direction: column; min-height: 0; }
    #head { flex: none; display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid #e5e7eb; }
    #head .ttl { font-size: 15px; font-weight: 600; letter-spacing: -.01em; flex: 1; }
    /* step pills (CR-246): 1 Valve → 2 Configuration */
    #steps { display: flex; gap: 6px; }
    .step { display: flex; align-items: center; gap: 7px; border: 1px solid #d9dfe8; border-radius: 999px; padding: 4px 12px 4px 5px; font-size: 12.5px; font-weight: 500; color: #64748b; background: #fff; }
    .step .n { width: 20px; height: 20px; border-radius: 50%; background: #eef2f7; color: #64748b; display: grid; place-items: center; font-size: 11px; font-weight: 600; }
    .step.on { border-color: #0f766e; color: #0f766e; background: #f0fdfa; }
    .step.on .n { background: #0f766e; color: #fff; }
    .step:disabled { opacity: .5; }
    #step-foot { display: flex; justify-content: flex-end; margin-top: 14px; }
    #next-btn { padding: 9px 16px; font-weight: 600; border-radius: 9px; }
    #back-link { border: 0; background: none; color: #0f766e; font-size: 12.5px; font-weight: 500; padding: 0; margin-top: 12px; }
    #back-link:hover { text-decoration: underline; }
    /* vertical question rows (CR-246) — MSUN Quote Maker's parameter list, expanding inline */
    #qs { display: flex; flex-direction: column; gap: 2px; }
    #qs .sec { margin: 12px 0 4px; }
    .q { border-radius: 8px; background: #fff; border: 1px solid transparent; }
    .q.open { border-color: #99d5cf; }
    .q-row { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; text-align: left; padding: 7px 8px; border-radius: 8px; cursor: pointer; font-size: 13px; color: #334155; min-width: 0; }
    .q-row:hover { background: #eef2f7; }
    .q-row .num { width: 18px; height: 18px; border-radius: 50%; background: #eef2f7; color: #64748b; display: grid; place-items: center; font-size: 10px; flex: none; }
    .q-row .cap { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
    .q-row .cap .req { color: #dc2626; }
    .q-row .val { flex: none; max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: #94a3b8; }
    .q.set .q-row { background: #f0fdfa; }
    .q.set .q-row .val { color: #0f766e; font-weight: 600; }
    .q-row .x { display: none; flex: none; color: #94a3b8; font-size: 13px; line-height: 1; padding: 0 2px; }
    .q.set .q-row .x { display: block; }
    .q-row .x:hover { color: #dc2626; }
    .q-body { padding: 2px 8px 8px 34px; }
    .q-opt { padding: 6px 8px; border-radius: 6px; font-size: 12.5px; color: #0f172a; cursor: pointer; }
    .q-opt:hover { background: #eef2f7; }
    .q-opt.on { background: #f0fdfa; color: #0f766e; font-weight: 600; }
    .q-body .rng { display: flex; gap: 8px; align-items: center; }
    .q-body .rng input { width: 140px; font-size: 13px; }
    .q-body .q-find { width: 100%; font-size: 12.5px; padding: 5px 8px; border-radius: 6px; margin-bottom: 4px; }
    #form { flex: 1; overflow: auto; padding: 4px 20px 16px; }
    .sec { font: 600 11px 'IBM Plex Sans', sans-serif; letter-spacing: .06em; text-transform: uppercase; color: #64748b; margin: 16px 0 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px 12px; }
    .fld { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; color: #64748b; font-weight: 500; min-width: 0; }
    .fld .req { color: #dc2626; }
    .fld select, .fld input { width: 100%; font-size: 13px; }
    .fld.set select, .fld.set input { border-color: #99d5cf; background: #f0fdfa; }
    /* Valve Selection Section card (CR-218) */
    .hl { margin-top: 16px; padding: 2px 14px 14px; background: #f0fdfa; border: 1px solid #99d5cf; border-radius: 10px; }
    .hl .sec { margin-top: 10px; }
    .hl .fld input[readonly] { background: #fff; }
    /* RAV type · Find · Motor/Bare Shaft radio in one row above the sizing table (CR-224) */
    /* same columns as the duty grid: RAV type under Capacity, radio across the middle, Find under Volume */
    #find-row { margin-top: 10px; align-items: end; }
    #op-row { grid-column: 2 / -2; }
    #find-btn { grid-column: -2; justify-self: start; }
    #find-msg { font-size: 12.5px; margin-top: 6px; }
    #find-msg:empty { display: none; }
    #op-row { display: flex; gap: 18px; align-items: center; height: 31px; font-size: 13px; color: #0f172a; }
    #op-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    #op-row input { accent-color: #0f766e; margin: 0; }
    #sizing { border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; background: #fff; }
    #sizing .cap { display: flex; align-items: baseline; gap: 10px; padding: 10px 14px; background: #f8fafc; border-bottom: 1px solid #e5e7eb; font-size: 12.5px; color: #64748b; }
    #sizing .cap b { font-size: 16px; color: #0f172a; font-variant-numeric: tabular-nums; }
    .opt { display: grid; grid-template-columns: 18px 190px minmax(90px, 1fr) 100px 120px; white-space: nowrap; gap: 10px; align-items: center; padding: 8px 14px; border-bottom: 1px solid #eef1f5; cursor: pointer; font-size: 13px; font-variant-numeric: tabular-nums; }
    .opt:last-child { border-bottom: 0; }
    .opt:hover { background: #f8fafc; }
    .opt.on { background: #f0fdfa; }
    .opt .dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid #94a3b8; }
    .opt.on .dot { border: 4.5px solid #0f766e; }
    .opt .m { font-weight: 600; }
    .opt .s, .opt .r { color: #64748b; font-size: 12.5px; }
    .big { padding: 8px 14px; font-size: 12.5px; color: #b45309; background: #fffbeb; border-bottom: 1px solid #eef1f5; }
    #result { flex: none; border-top: 1px solid #e5e7eb; background: #fff; padding: 12px 20px; display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
    #res-main { flex: 1; min-width: 220px; }
    #res-sku { font: 500 14px 'IBM Plex Mono', monospace; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    #res-name { font-size: 12.5px; color: #64748b; margin-top: 2px; }
    #res-msg { font-size: 12.5px; margin-top: 2px; }
    #res-comps { font-size: 12px; margin-top: 6px; max-height: 180px; overflow-y: auto; }
    #res-comps div { display: flex; gap: 8px; padding: 2px 0; border-top: 1px solid #eef2f6; }
    #res-comps .c-name { flex: 0 0 120px; color: #64748b; }
    #res-comps .c-item { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #res-comps .c-qty { font-family: 'IBM Plex Mono', monospace; }
    .badge.exists { color: #15803d; background: #dcfce7; }
    .badge.fresh { color: #b45309; background: #fef3c7; }
    #result label { display: flex; flex-direction: column; gap: 3px; font-size: 10.5px; color: #64748b; font-weight: 500; }
    #result label input { width: 120px; text-align: right; font-variant-numeric: tabular-nums; }
    #res-add { padding: 8px 16px; font-weight: 600; }

    /* quote lines */
    #lines-head { padding: 14px 16px 8px; display: flex; align-items: baseline; justify-content: space-between; font-size: 14.5px; font-weight: 600; }
    #lines-clear { border: 0; background: none; color: #64748b; font-size: 12px; padding: 0; font-weight: 400; }
    #lines-clear:hover { color: #0f172a; }
    #lines { flex: 1; overflow: auto; padding: 0 12px; display: flex; flex-direction: column; gap: 8px; position: relative; }
    .l-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px 10px 10px 4px; display: grid; grid-template-columns: 18px minmax(0,1fr); gap: 4px; }
    .l-move { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
    .l-move button { border: 0; background: none; color: #94a3b8; font-size: 9px; line-height: 1; padding: 2px; }
    .l-move button:hover:not(:disabled) { color: #0f172a; }
    .l-move button:disabled { opacity: .3; }
    .l-top { display: flex; align-items: flex-start; gap: 8px; }
    .l-name { flex: 1; min-width: 0; font-size: 13px; font-weight: 500; line-height: 1.3; }
    .l-sku { font: 12px 'IBM Plex Mono', monospace; color: #64748b; margin-top: 2px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .badge { font: 500 9.5px 'IBM Plex Sans', sans-serif; letter-spacing: .04em; border-radius: 4px; padding: 1px 5px; }
    .badge.books { color: #b45309; background: #fef3c7; }
    .badge.pending { color: #b91c1c; background: #fee2e2; }
    .badge.type { color: #475569; background: #e2e8f0; }
    .l-x { border: 0; background: none; color: #94a3b8; font-size: 15px; line-height: 1; padding: 0 2px; }
    .l-x:hover { color: #dc2626; }
    /* Qty · UOM · Base price · Disc % — no total in the row (CR-248); Price detail carries the amount */
    .l-grid { display: grid; grid-template-columns: minmax(56px,1fr) minmax(76px,1.2fr) minmax(120px,2fr) minmax(60px,1fr); gap: 6px; align-items: end; margin-top: 8px; }
    .l-grid label { display: flex; flex-direction: column; gap: 3px; font-size: 10.5px; color: #64748b; font-weight: 500; }
    .l-grid input, .l-grid select { width: 100%; padding: 5px 7px; text-align: right; border-radius: 6px; font-size: 13px; font-variant-numeric: tabular-nums; }
    .l-empty { margin: 8px 4px; padding: 26px 14px; border: 1.5px dashed #d9dfe8; border-radius: 10px; text-align: center; color: #64748b; line-height: 1.5; }
    #lines-foot { flex: none; padding: 12px 16px; border-bottom: 1px solid #e5e7eb; background: #fff; display: flex; flex-direction: column; gap: 10px; }
    /* line class (CR-220): Mfg cream / BO blue tint + 3px stripe, chip */
    .l-card.mfg { background: #FCE8D8; box-shadow: inset 3px 0 0 #E07A2F; }
    .l-card.bo { background: #D9ECF3; box-shadow: inset 3px 0 0 #3B8FB5; }
    .badge.cls { font-weight: 600; text-transform: uppercase; font-size: 10.5px; padding: 2px 6px; }
    .badge.cls.mfg { background: #FCE8D8; color: #7A3E10; border: 1px solid #f0c9ad; }
    .badge.cls.bo { background: #D9ECF3; color: #0F4C66; border: 1px solid #b9d9e6; }
    .l-card.mfg .badge.cls, .l-card.bo .badge.cls { background: #fff; }
    /* card actions (CR-246): Edit · BOM · Price detail — no unit caption, the total already shows it */
    .l-unit { grid-column: 1 / -1; display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
    .l-unit button { height: 24px; padding: 0 10px; font-size: 12px; font-weight: 500; border-radius: 9px; }
    #pop .bom { max-height: 260px; overflow-y: auto; font-size: 12px; }
    #pop .bom div { display: flex; gap: 8px; padding: 3px 0; border-top: 1px solid #eef2f6; }
    #pop .bom .c-name { flex: 0 0 110px; color: #64748b; }
    #pop .bom .c-item { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #pop .bom .c-qty { font-family: 'IBM Plex Mono', monospace; white-space: nowrap; }
    #pop .bom .error { color: #b91c1c; }
    #save-btn { padding: 8px 14px; font-size: 13px; font-weight: 500; border-radius: 9px; }
    #res-cancel { border: 0; background: none; color: #64748b; font-size: 12px; padding: 0 4px; }
    #res-cancel:hover { color: #0f172a; text-decoration: underline; }
    /* price detail popover (CR-220, mockup frame 1e) */
    #pop-scrim { position: absolute; inset: 0; z-index: 4; }
    #pop { position: absolute; right: 14px; width: 340px; max-width: calc(100% - 28px); background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; box-shadow: 0 12px 32px rgba(15,23,42,.14); z-index: 5; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; font-size: 13px; }
    #pop .p-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    #pop .p-head b { font-weight: 500; }
    #pop .p-head span { font: 12px 'IBM Plex Mono', monospace; color: #64748b; }
    #pop .p-in { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; }
    #pop .p-in label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: #64748b; }
    #pop .p-in input { height: 30px; text-align: right; font-variant-numeric: tabular-nums; border-radius: 9px; }
    #pop .seg { display: grid; grid-template-columns: 1fr 1fr; height: 30px; border: 1px solid #e5e7eb; border-radius: 9px; padding: 2px; gap: 2px; background: #f8fafc; }
    #pop .seg button { border: 0; border-radius: 7px; background: transparent; color: #64748b; font-weight: 500; padding: 0; }
    #pop .seg button.on { background: #fff; color: #0f172a; box-shadow: 0 1px 2px rgba(15,23,42,.10); }
    #pop table { width: 100%; border: 1px solid #e5e7eb; border-radius: 9px; border-spacing: 0; overflow: hidden; font-variant-numeric: tabular-nums; }
    #pop th { height: 26px; font-size: 11px; font-weight: 400; color: #64748b; background: #f8fafc; border-bottom: 1px solid #e5e7eb; text-align: right; padding: 0 10px; }
    #pop th:first-child, #pop td:first-child { text-align: left; }
    #pop td { height: 28px; padding: 0 10px; border-bottom: 1px solid #f1f5f9; text-align: right; transition: background .6s; }
    #pop td.pct { color: #64748b; }
    #pop tr.flash td { background: #FEF9C3; }
    #pop tr.tot td { height: 32px; font-weight: 500; border-bottom: 0; }
    #pop .p-foot { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #64748b; }
    #pop .p-foot .note { color: #B45309; }
    #add-btn { padding: 11px 14px; font-size: 13.5px; font-weight: 600; border-radius: 9px; }
    #quote-btn { padding: 10px 14px; font-size: 13px; font-weight: 600; border-radius: 9px; }
    #status { font-size: 12px; color: #0f766e; }
  </style>
</head>
<body>

  <div id="v-loading" class="center"><p class="muted">Loading…</p></div>

  <div id="v-message" class="center hidden"><div>
    <p id="message-text"></p>
    <button id="signin-btn" class="primary hidden">Sign in</button>
  </div></div>

  <div id="v-org" class="center hidden"><div>
    <p>Choose the organization to work in:</p>
    <select id="org-select"></select>
    <button id="org-btn" class="primary">Continue</button>
  </div></div>

  <div id="v-picker" class="hidden"><div id="card">
    <div id="panes">
      <div id="left">
        <div id="head">
          <span class="ttl">Product Configurator</span>
          <!-- ponytail: product picker hidden, RAV is the only live product; unhide when a second one ships -->
          <label class="muted hidden" for="product">Product</label>
          <select id="product" class="hidden"></select>
          <div id="steps" class="hidden">
            <button type="button" class="step on" data-step="1"><span class="n">1</span>Valve</button>
            <button type="button" class="step" data-step="2" disabled><span class="n">2</span>Configuration</button>
          </div>
        </div>
        <div id="form"><p class="muted">Loading questions…</p></div>
        <div id="result">
          <div id="res-main">
            <div id="res-sku"><span class="muted">Answer the questions to generate the SKU.</span></div>
            <div id="res-name"></div>
            <div id="res-msg"></div>
            <div id="res-comps"></div>
          </div>
          <label>Base price<input id="res-rate" type="number" min="0" /></label>
          <button id="res-add" class="primary" disabled>Add to lines</button>
          <button id="res-cancel" type="button" class="hidden">Cancel edit</button>
        </div>
      </div>
      <div id="right">
        <div id="lines-head"><span>Quote lines <span id="line-count" class="muted">0</span></span><button id="lines-clear" class="hidden">Clear</button></div>
        <div id="lines-foot">
          <button id="add-btn" class="primary" disabled>Add item to Quote</button>
          <button id="quote-btn" class="primary hidden" disabled>Create Quote</button>
          <button id="save-btn" type="button" disabled title="Keep these lines and their configuration on this record — reopen the Configurator later to edit them">Save</button>
          <span id="status"></span>
        </div>
        <div id="lines"><div class="l-empty">No lines yet.<br>Configure a product and add it.</div></div>
      </div>
    </div>
  </div></div>

<script>
// Searchable dropdowns (CR-265): every native <select> opens a type-to-filter
// panel instead of the OS popup. The select stays the source of truth — a pick
// sets it and fires a native change, so no call site knows the difference and
// any new <select> is covered without being asked.
// ES5, no imports: everything above the export line is pasted verbatim at the
// top of each widget's <script> (self-contained by packaging; first, so a
// failed widget init can't skip it); searchableSelect.test.js fails on drift.
var SS_MAX_H = 240;   // list height cap
var SS_HEAD = 48;     // search box + panel padding above the list
var SS_PANEL_CSS = 'position:fixed;z-index:2000;box-sizing:border-box;padding:4px;text-align:left;' +
  'background:var(--bg-card,#fff);border:1px solid var(--border,#d9dfe8);border-radius:var(--radius-md,8px);' +
  'box-shadow:0 8px 24px rgba(0,0,0,.14);font-size:13px;font-weight:400;color:var(--text-primary,#0f172a);';
var SS_INPUT_CSS = 'display:block;width:100%;box-sizing:border-box;margin:0 0 4px;padding:6px 8px;' +
  'font:inherit;font-size:13px;text-align:left;outline:none;color:inherit;background:var(--bg-card,#fff);' +
  'border:1px solid var(--border,#d9dfe8);border-radius:6px;';
var SS_ROW_CSS = 'padding:7px 10px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;';

function optionRows(select) {
  var rows = [];
  for (var i = 0; i < select.options.length; i++) {
    var o = select.options[i];
    rows.push({ i: i, label: o.text, disabled: Boolean(o.disabled), selected: i === select.selectedIndex });
  }
  return rows;
}

function filterRows(rows, q) {
  var s = String(q || '').trim().toLowerCase();
  if (!s) return rows;
  return rows.filter(function (r) { return r.label.toLowerCase().indexOf(s) !== -1; });
}

// Next pickable index from `from` in direction `delta`; stays put at the ends,
// -1 when nothing is pickable.
function stepActive(rows, from, delta) {
  for (var i = from + delta; i >= 0 && i < rows.length; i += delta) {
    if (!rows[i].disabled) return i;
  }
  return rows[from] && !rows[from].disabled ? from : -1;
}

// Panel box from the select's rect: below by default, above when that side has
// more room; never narrower than 180 (page-size, table cells) nor off-screen.
function placePanel(rect, vw, vh) {
  var below = vh - rect.bottom;
  var up = below < SS_MAX_H + SS_HEAD && rect.top > below;
  var minWidth = Math.min(Math.max(rect.width, 180), vw - 16);
  var pos = {
    left: Math.max(8, Math.min(rect.left, vw - minWidth - 8)),
    minWidth: minWidth,
    maxWidth: Math.max(minWidth, Math.min(420, vw - 16)),
    maxHeight: Math.max(80, Math.min(SS_MAX_H, (up ? rect.top : below) - SS_HEAD - 12)),
  };
  if (up) pos.bottom = vh - rect.top + 4; else pos.top = rect.bottom + 4;
  return pos;
}

// Keys that open the panel from a focused select. Enter is left alone: it
// submits modal forms and walks grid columns.
function isOpenKey(e) {
  if (e.ctrlKey || e.metaKey) return false;
  var k = e.key || '';
  if (k === 'ArrowDown' || k === 'ArrowUp' || k === 'F4') return true;
  return !e.altKey && k.length === 1;
}

function installSearchableSelects(doc) {
  if (doc.__searchableSelects) return;
  doc.__searchableSelects = true;
  var win = doc.defaultView;
  // ponytail: touch devices keep the OS picker (no search there) — build a
  // touch panel if phones/tablets become a target.
  if (win.matchMedia && win.matchMedia('(hover: none)').matches) return;

  var cur = null; // the open panel: { select, panel, input, list, rows, shown, active, observer }

  function close(refocus) {
    if (!cur) return;
    var c = cur;
    cur = null;
    c.observer.disconnect();
    if (c.panel.parentNode) c.panel.parentNode.removeChild(c.panel);
    if (refocus && c.select.isConnected) c.select.focus();
  }

  // Close first: a change handler may rebuild the row this select lives in.
  function pick(row) {
    if (row.disabled) return;
    var select = cur.select;
    close(false);
    if (select.selectedIndex !== row.i) {
      select.selectedIndex = row.i;
      select.dispatchEvent(new Event('input', { bubbles: true }));
      select.dispatchEvent(new Event('change', { bubbles: true }));
    }
    if (select.isConnected) select.focus();
  }

  function paint(scroll) {
    var kids = cur.list.children;
    for (var n = 0; n < cur.shown.length; n++) {
      kids[n].style.background = n === cur.active ? 'var(--bg-secondary,#eef2f7)' : 'none';
      if (scroll && n === cur.active && kids[n].scrollIntoView) kids[n].scrollIntoView({ block: 'nearest' });
    }
    cur.input.setAttribute('aria-activedescendant', cur.active >= 0 ? 'ss-opt-' + cur.active : '');
  }

  function build() {
    cur.shown = filterRows(cur.rows, cur.input.value);
    cur.list.textContent = '';
    cur.shown.forEach(function (r, n) {
      var d = doc.createElement('div');
      d.id = 'ss-opt-' + n;
      d.setAttribute('role', 'option');
      d.setAttribute('aria-selected', r.selected ? 'true' : 'false');
      if (r.disabled) d.setAttribute('aria-disabled', 'true');
      d.textContent = r.label || ' ';
      d.title = r.label;
      d.style.cssText = SS_ROW_CSS + (r.disabled ? 'opacity:.5;cursor:default;' : 'cursor:pointer;') +
        (r.selected ? 'font-weight:600;' : '');
      d.addEventListener('mouseenter', function () { if (!r.disabled) { cur.active = n; paint(false); } });
      d.addEventListener('click', function () { pick(r); });
      cur.list.appendChild(d);
    });
    if (!cur.shown.length) {
      var none = doc.createElement('div');
      none.textContent = 'No matches';
      none.style.cssText = SS_ROW_CSS + 'color:var(--text-muted,#94a3b8);';
      cur.list.appendChild(none);
    }
  }

  function show(select, typed) {
    var pos = placePanel(select.getBoundingClientRect(), win.innerWidth, win.innerHeight);
    var panel = doc.createElement('div');
    panel.setAttribute('data-searchable-select', '');
    panel.style.cssText = SS_PANEL_CSS + 'left:' + pos.left + 'px;min-width:' + pos.minWidth + 'px;max-width:' + pos.maxWidth + 'px;' +
      (pos.top === undefined ? 'bottom:' + pos.bottom + 'px;' : 'top:' + pos.top + 'px;');
    var input = doc.createElement('input');
    input.type = 'text';
    input.placeholder = 'Search…';
    input.autocomplete = 'off';
    input.value = typed;
    input.setAttribute('role', 'combobox');
    input.setAttribute('aria-expanded', 'true');
    input.setAttribute('aria-controls', 'ss-list');
    input.setAttribute('aria-label', 'Search options');
    input.style.cssText = SS_INPUT_CSS;
    var list = doc.createElement('div');
    list.id = 'ss-list';
    list.setAttribute('role', 'listbox');
    list.style.cssText = 'overflow-y:auto;max-height:' + pos.maxHeight + 'px;';
    panel.appendChild(input);
    panel.appendChild(list);

    // Rebuild when the app re-renders the options; vanish with the select.
    var observer = new win.MutationObserver(function (muts) {
      if (!cur) return;
      if (!cur.select.isConnected) return close(false);
      for (var m = 0; m < muts.length; m++) {
        if (cur.select.contains(muts[m].target)) {
          cur.rows = optionRows(cur.select);
          build();
          cur.active = stepActive(cur.shown, -1, 1);
          paint(true);
          return;
        }
      }
    });
    cur = { select: select, panel: panel, input: input, list: list, rows: optionRows(select), shown: [], active: -1, observer: observer };
    build();
    cur.active = -1;
    if (!typed) cur.shown.forEach(function (r, n) { if (r.selected && !r.disabled) cur.active = n; });
    if (cur.active < 0) cur.active = stepActive(cur.shown, -1, 1);

    input.addEventListener('input', function () {
      build();
      cur.active = stepActive(cur.shown, -1, 1);
      paint(true); // back to the top match
    });
    input.addEventListener('keydown', function (e) {
      // Nothing typed here may reach page shortcuts or an open modal's Escape.
      e.stopPropagation();
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        cur.active = stepActive(cur.shown, cur.active, e.key === 'ArrowDown' ? 1 : -1);
        paint(true);
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (cur.shown[cur.active]) pick(cur.shown[cur.active]);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        close(true);
      } else if (e.key === 'Tab') {
        close(true); // Tab then moves on from the select
      }
    });
    // Other popovers (calendar, row menu) close on a document mousedown outside
    // themselves — ours must not count. Rows keep the search box focused.
    panel.addEventListener('mousedown', function (e) {
      e.stopPropagation();
      if (e.target !== input) e.preventDefault();
    });

    doc.body.appendChild(panel);
    // Content can be wider than the select: pull back inside the viewport.
    var over = pos.left + panel.offsetWidth + 8 - win.innerWidth;
    if (over > 0) panel.style.left = Math.max(8, pos.left - over) + 'px';
    observer.observe(doc.body, { childList: true, subtree: true });
    paint(true);
    input.focus();
  }

  function usable(el) {
    return el && el.tagName === 'SELECT' && !el.disabled && !el.multiple && !(el.size > 1);
  }

  doc.addEventListener('mousedown', function (e) {
    if (cur && cur.panel.contains(e.target)) return;
    var was = cur && cur.select;
    close(false);
    // Firefox reports the <option> as the target.
    var select = e.target.closest ? e.target.closest('select') : null;
    if (e.button !== 0 || !usable(select)) return;
    e.preventDefault(); // no native popup
    if (was === select) return select.focus(); // second click closes
    show(select, '');
  }, true);

  doc.addEventListener('keydown', function (e) {
    if (cur || !usable(e.target) || !isOpenKey(e)) return;
    e.preventDefault();
    show(e.target, e.key.length === 1 && e.key !== ' ' ? e.key : '');
  }, true);

  // The anchor moved → close. Scrolling our own list must neither close us nor
  // reach the capture-phase scroll closers of the popover we may be opened from.
  win.addEventListener('scroll', function (e) {
    if (!cur) return;
    if (cur.panel.contains(e.target)) return e.stopImmediatePropagation();
    close(false);
  }, true);
  win.addEventListener('resize', function () { close(false); });
}
installSearchableSelects(document);

// Product Configurator CRM widget (CR-181) — guided questions → sizing → SKU →
// existing-or-new item → Quote lines.
// ponytail: boot/auth, cart and quote write-back are copied verbatim from
// widget.html so MSUN's live Quote Maker stays isolated from this page;
// extract a shared script when a third widget needs them.
'use strict';
// Served from the same Catalyst origin as the API — nothing env-specific here.
var API = '/server/skuapi';
var APP_ORIGIN = location.origin;
// Every CRM write must carry this — an empty Trigger list suppresses workflows/blueprint/approval.
var CRM_TRIGGER = ['workflow', 'blueprint', 'approval'];

var recordId = null;
var moduleName = 'Quotes';
var lines = []; // [{ id, sku, name, type, values, qty, rate, disc, rateTouched, badge, parent, config, bom }] — array so ▲▼ reorder works
// Saved cart (CR-246): keyed by the CRM record; ownedRowIds = the subform rows
// the widget wrote and still owns — replaced on the next push, never the rows
// typed by hand in CRM.
var docKey = null;
var ownedRowIds = [];
var hadSaved = false; // a saved cart was restored → Save stays enabled even when emptied
var editingId = null; // cart line being re-configured (Edit on its card)
// Org display labels for the stored item types (SKU Settings, CR-180); the

function typeLabel(t) { return typeLabels[t] || t; }

/* ---------- price ladder (CR-220) ---------- */
// Base → OH → Margin → P&F → Other → Disc, each step = previous ÷ (1 − pct);
// the % set depends on the line class: Mfg (Manufacturing) or BO (Trading).
// ponytail: mirrors recipe/ladder.js — keep the two in step.
var LADDER_STEPS = [['oh', 'OH'], ['margin', 'Margin'], ['pf', 'P&F'], ['other', 'Other'], ['disc', 'Disc']];
var priceLadder = { mfg: {}, bo: {} };
function applyLadder(base, pcts) {
  var p = pcts || {}, v = Number(base) || 0, out = { base: v };
  LADDER_STEPS.forEach(function (s) {
    var pct = Math.min(99.99, Math.max(0, Number(p[s[0]]) || 0));
    v = v / (1 - pct / 100);
    out[s[0]] = v;
  });
  out.unit = v;
  return out;
}
function classOf(type) { return type === 'Manufacturing' ? 'mfg' : 'bo'; }
function ladderOf(l) { return applyLadder(l.rate, priceLadder[l.cls]); }
function unitPrice(l) { return ladderOf(l).unit; }
function fmtMoney(v) { return Math.round(Number(v) || 0).toLocaleString('en-IN'); }
// Units for Qty (CR-206). Default list inlined (CR-214: /api/recipe/uoms sits
// behind the Recipe Engine add-on); the org's own list (SKU Settings → Units
// of measure, CR-216) arrives with /api/sku-items/settings and replaces it.
// normUom() keeps unknown text, so a drift between the two is harmless.
var uomList = ['Nos', 'Pcs', 'Kgs', 'Gms', 'Mtr', 'CM', 'MM', 'Ltr', 'Set', 'Box'];
// Qty / UOM are set on the card (CR-248) — the footer only carries Base price.
function fillUoms(list) { uomList = list; }
var authDone = false;

function findLine(id) { return lines.find(function (l) { return l.id === id; }); }

// Cookie-free auth: the sign-in popup hands over a session token via
// postMessage (third-party cookies never reach this iframe). Held in memory —
// localStorage is only best-effort persistence, since browsers partition or
// block storage inside third-party iframes.
var sessionToken = null;
try { sessionToken = localStorage.getItem('sku_token'); } catch (e) { /* storage blocked */ }

function api(path, opts) {
  opts = opts || {};
  opts.headers = {};
  if (opts.body) opts.headers['Content-Type'] = 'application/json';
  // Token rides the ?t= query param, NOT an Authorization header: Catalyst's
  // gateway hijacks Authorization and rejects anything that isn't a Zoho OAuth
  // token (INVALID_TOKEN 401) before the function ever sees the request.
  if (sessionToken) path += (path.indexOf('?') > -1 ? '&' : '?') + 't=' + encodeURIComponent(sessionToken);
  return fetch(API + path, opts);
}

function show(id) {
  ['v-loading', 'v-message', 'v-org', 'v-picker'].forEach(function (v) {
    document.getElementById(v).classList.toggle('hidden', v !== id);
  });
}
function message(text, withSignin) {
  document.getElementById('message-text').textContent = text;
  document.getElementById('signin-btn').classList.toggle('hidden', !withSignin);
  show('v-message');
}
var $ = function (id) { return document.getElementById(id); };

/* ---------- boot ---------- */
ZOHO.embeddedApp.on('PageLoad', function (data) {
  if (data.Entity !== 'Quotes' && data.Entity !== 'Deals') {
    return message('This widget works on Quotes and Deals only (got: ' + (data.Entity || 'unknown') + ').');
  }
  moduleName = data.Entity;
  // EntityId arrives as a string, an array, or a JSON-stringified array
  // depending on how the widget is launched — normalize all three.
  var eid = data.EntityId;
  if (typeof eid === 'string' && eid.charAt(0) === '[') {
    try { eid = JSON.parse(eid); } catch (e) { /* keep as-is */ }
  }
  recordId = Array.isArray(eid) ? eid[0] : eid;
  docKey = moduleName.toLowerCase() + ':' + recordId;
  if (!recordId) {
    // CreateOrCloneView = unsaved record → no record id to write lines into.
    return message(data.ButtonPosition === 'CreateOrCloneView'
      ? 'This record is not saved yet. Save it first, then open it and use the Configurator button from its detail page.'
      : 'Could not read the record id from CRM. PageLoad data: ' + JSON.stringify(data));
  }
  probe();
});
ZOHO.embeddedApp.init();

/* ---------- auth ---------- */
function probe() {
  api('/auth/me').then(function (r) {
    if (r.status === 401) {
      var hadToken = Boolean(sessionToken);
      sessionToken = null;
      try { localStorage.removeItem('sku_token'); } catch (e) { /* storage blocked */ }
      // Distinct messages per failure leg so a report pinpoints where it broke.
      if (authDone) {
        return message(hadToken
          ? 'Sign-in worked but the server rejected the session token. Please try again.'
          : 'Sign-in finished without a session token. Please try again.', true);
      }
      return silentAuth();
    }
    if (!r.ok) return r.json().then(function (d) { message(d.error || ('Error ' + r.status)); });
    return r.json().then(function (me) {
      if (!me.orgId) return orgStep();
      var missing = ['sku-generator', 'recipe-engine'].filter(function (a) { return !(me.addons || []).includes(a); });
      if (missing.length) {
        return message('The Product Configurator needs the ' + missing.map(function (a) { return a === 'sku-generator' ? 'SKU Generator' : 'Product Configurator'; }).join(' + ') + ' add-on enabled for ' + (me.orgName || 'this organization') + '.');
      }
      startConfigurator();
    });
  }).catch(function () { message('Cannot reach the Product Configurator API.'); });
}

// Token handoff handshake with the OAuth popup/iframe (an /app/ page on our
// origin): it announces 'sku-auth-ready', we reply hello, it sends the token.
window.addEventListener('message', function (e) {
  if (e.origin !== APP_ORIGIN || !e.data) return;
  if (e.data.type === 'sku-auth-ready') {
    e.source.postMessage({ type: 'sku-auth-hello' }, APP_ORIGIN);
  } else if (e.data.type === 'sku-auth-token') {
    var f = $('silent-frame');
    if (f) f.remove();
    if (!e.data.token) {
      // The popup finished but could not mint a session — show its reason.
      return message('Sign-in failed: ' + (e.data.error || 'no session token issued') + '.', true);
    }
    sessionToken = e.data.token;
    try { localStorage.setItem('sku_token', e.data.token); } catch (err) { /* storage blocked */ }
    authDone = true;
    show('v-loading');
    probe();
  }
});

function silentAuth() {
  // Warm Zoho session + prior consent → the OAuth chain completes invisibly in
  // the iframe and posts 'sku-auth-done'. Any rendered Zoho page (login,
  // consent) is frame-blocked, so the timeout falls back to the popup button.
  var f = document.createElement('iframe');
  f.id = 'silent-frame';
  f.name = 'sku-auth';
  f.src = API + '/auth/zoho';
  f.style.display = 'none';
  document.body.appendChild(f);
  setTimeout(function () {
    if (authDone) return;
    f.remove();
    message('Sign in to the Product Configurator to continue.', true);
  }, 6000);
}

$('signin-btn').addEventListener('click', function () {
  var w = window.open(API + '/auth/zoho', 'sku-auth', 'width=620,height=720');
  if (!w) return message('Popup blocked — allow popups for this page, then try again.', true);
  message('Waiting for sign-in to finish…');
});

    if (orgs.length === 1) return selectOrg(orgs[0]);

/* ---------- configurator (CR-181) ---------- */
// Everything here is org data: the Product is an Industry, the questions are
// its Properties, and the sizing block appears only when the industry has
// properties carrying a sizingRole (capacity / density / speed / group feed
// the calculation; series / model receive the picked answer).
var DUTY_ROLES = ['capacity', 'density', 'speed', 'group'];
var industryId = '';
var props = [];          // questions of the chosen product, in skuPosition order
var valuesByProp = {};   // propertyId -> [{ id, displayValue, isDefault }]
var sel = {};            // propertyId -> valueId (List) | number text (Range)
var sizing = null;       // last /sizing/select response
var picked = null;       // chosen option: { modelCode, series, capacity, requiredRpm, valueId }
var gen = null;          // last /api/sku/generate response
var existing = null;     // catalog item already carrying gen.sku
var genKey = null;       // guards against stale generate responses
var lineSeq = 0;

function roleProp(role) { return props.find(function (p) { return p.sizingRole === role; }); }
// Motor/gear questions follow the Motor Operated / Bare Shaft radio (CR-223).
// ponytail: caption match; a Property flag if a second product needs it.
var MOTOR_RE = /^(motor|gear|drive)\b/i;
function isMotor(p) { return MOTOR_RE.test(String(p.caption || '')); }
var motorOp = true; // widget-only, not a SKU question
// ponytail: MOC by caption — the question whose answer names the Books item category child.
function mocProp() { return props.find(function (p) { return String(p.caption || '').trim().toUpperCase() === 'MOC'; }); }
function displayOf(p) {
  var v = sel[p.id];
  if (v === undefined || v === null || v === '') return '';
  if (p.valueType === 'Range') return String(v) + (p.unit ? ' ' + p.unit : '');
  var hit = (valuesByProp[p.id] || []).find(function (x) { return String(x.id) === String(v); });
  return hit ? hit.displayValue : '';

function startConfigurator() {
  show('v-picker');
  // On Deals the only action is a new Quote linked to the Deal.
  if (moduleName === 'Deals') {
    $('quote-btn').classList.remove('hidden');
    $('add-btn').classList.add('hidden');
  }
  try {
    if (window.ZOHO && ZOHO.CRM.UI && typeof ZOHO.CRM.UI.Resize === 'function') {
      ZOHO.CRM.UI.Resize({ height: '780', width: '1320' }).catch(function () { /* CRM caps it */ });
    }
  } catch (e) { /* older SDK */ }
  discoverSubforms(); // warm the metadata cache; failures surface at add time
  // Saved cart for this record (CR-246): lines + the CRM rows the widget owns.
  api('/api/recipe/config-quote?docKey=' + encodeURIComponent(docKey))
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      if (!d || !d.lines) return;
      hadSaved = true;
      ownedRowIds = (d.crmRowIds || []).map(String);
      lines = d.lines.map(function (l) { l.bom = l.bom || []; return l; });
      lineSeq = lines.reduce(function (m, l) { return Math.max(m, Number(String(l.id).replace(/^c/, '')) || 0); }, lineSeq);
      renderCart();
      setStatus('Restored ' + lines.length + ' saved line' + (lines.length === 1 ? '' : 's') + '.');
    })
    .catch(function () { /* nothing saved / no access — start empty */ });
  Array.prototype.forEach.call(document.querySelectorAll('#steps .step'), function (b) {
    b.addEventListener('click', function () { goStep(Number(b.dataset.step)); });
  });
  api('/api/sku-items/settings').then(function (r) { return r.ok ? r.json() : {}; })
    .then(function (s) {
      typeLabels = s.typeLabels || {};
      designRate = s.designRate === true;
      if (s.priceLadder) priceLadder = s.priceLadder;
      if (Array.isArray(s.uoms) && s.uoms.length) fillUoms(s.uoms);
      renderCart();
    })
    .catch(function () { /* raw type names */ });
  api('/api/industries').then(function (r) { return r.json(); }).then(function (inds) {
    inds = Array.isArray(inds) ? inds : [];
    if (!inds.length) { $('form').innerHTML = '<p class="muted">No product is set up yet — add one under Product Configurator in the app.</p>'; return; }
    inds.forEach(function (ind) {
      var opt = document.createElement('option');
      opt.value = ind.id;
      opt.textContent = ind.name;
      $('product').appendChild(opt);
    });
    // ponytail: default by name (CR-218); an Industry.isDefault flag if a second org needs a different one.
    var rav = inds.find(function (ind) { return String(ind.name).trim().toUpperCase() === 'RAV'; });
