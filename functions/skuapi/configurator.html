}
$('product').addEventListener('change', loadProduct);

// `after` (edit mode, CR-246) runs instead of the plain render once the
// questions are in; the same product's questions are reused, not re-fetched.
function loadProduct(after) {
  var id = String($('product').value);
  var same = id === industryId && props.length > 0;
  industryId = id;
  sel = {}; sizing = null; picked = null; gen = null; existing = null; genKey = null;
  step = 1;
  var ready = function () {
    props.forEach(function (p) {
      var dflt = (valuesByProp[p.id] || []).find(function (v) { return v.isDefault; });
      if (dflt) sel[p.id] = String(dflt.id);
      if (p.sizingRole === 'speed') sel[p.id] = '20'; // sheet default, editable
    });
    if (after) return after();
    renderForm();
    refreshResult();
  };
  if (same) return ready();
  props = [];
  $('form').innerHTML = '<p class="muted">Loading questions…</p>';
  renderResult();
  // Two calls total (properties + batched values) — never one per property,
  // the Dev concurrency cap can't take it.
  Promise.all([
    api('/api/industries/' + industryId + '/properties').then(function (r) { return r.ok ? r.json() : []; }),
    api('/api/industries/' + industryId + '/property-values').then(function (r) { return r.ok ? r.json() : {}; }),
  ]).then(function (res) {
    props = (Array.isArray(res[0]) ? res[0] : []).filter(function (p) { return p.showInWidget || p.sizingRole; });
    valuesByProp = res[1] || {};
    ready();
  }).catch(function () { $('form').innerHTML = '<p class="error">Failed to load questions.</p>'; });
}

function field(p) {
  var wrap = document.createElement('label');
  wrap.className = 'fld' + (sel[p.id] ? ' set' : '');
  var cap = document.createElement('span');
  cap.textContent = p.caption + (p.unit ? ' (' + p.unit + ')' : '');
  if (p.required) { var rq = document.createElement('span'); rq.className = 'req'; rq.textContent = ' *'; cap.appendChild(rq); }
  wrap.appendChild(cap);
  var inp;
  if (p.valueType === 'Range') {
    inp = document.createElement('input');
    inp.type = 'number';
    inp.min = 0;
    inp.step = 'any';
  } else {
    inp = document.createElement('select');
    var none = document.createElement('option');
    none.value = '';
    none.textContent = '—';
    inp.appendChild(none);
    (valuesByProp[p.id] || []).forEach(function (v) {
      var o = document.createElement('option');
      o.value = v.id;
      o.textContent = v.displayValue;
      inp.appendChild(o);
    });
  }
  inp.value = sel[p.id] || '';
  inp.dataset.prop = p.id;
  // 'change' (commit), not 'input' — one SKU preview per answer, no timers.
  inp.addEventListener('change', function () {
    sel[p.id] = inp.value;
    wrap.classList.toggle('set', Boolean(inp.value));
    if (DUTY_ROLES.indexOf(p.sizingRole) > -1) { sizing = null; picked = null; renderSizing(); updateVolume(); }
    if (p.sizingRole === 'capacity') autoPick(Number(inp.value));
    refreshResult();
  });
  wrap.appendChild(inp);
  return wrap;
}

// Capacity-banded values (CR-228): a List value carrying capMin/capMax is
// pre-selected when the capacity input (TPH) falls in its band — e.g. Motor HP
// from the geared-motor sheet. Overlapping edges go to the higher band; no band
// hit leaves the answer alone. The select stays editable; the next TPH edit
// re-picks.
function autoPick(tph) {
  if (!(tph > 0)) return;
  props.forEach(function (p) {
    if (p.valueType === 'Range') return;
    var hit = null;
    (valuesByProp[p.id] || []).slice().sort(function (a, b) { return (Number(a.capMin) || 0) - (Number(b.capMin) || 0); }).forEach(function (v) {
      if (v.capMin === null || v.capMin === undefined || v.capMax === null || v.capMax === undefined) return;
      if (Number(v.capMin) <= tph && tph <= Number(v.capMax)) hit = v;
    });
    if (!hit) return;
    sel[p.id] = String(hit.id);
    var inp = $('form').querySelector('[data-prop="' + p.id + '"]');
    if (inp) { inp.value = sel[p.id]; inp.parentNode.classList.add('set'); }
  });
}

function section(title, list) {
  if (!list.length) return null;
  var box = document.createElement('div');
  var h = document.createElement('div');
  h.className = 'sec';
  h.textContent = title;
  var g = document.createElement('div');
  g.className = 'grid';
  list.forEach(function (p) { g.appendChild(field(p)); });
  box.appendChild(h);
  box.appendChild(g);
  return box;
}

/* ---------- two steps (CR-246): 1 Valve → 2 Configuration ---------- */
var step = 1;
var sized = false; // the product has sizing roles → step 1 exists
function goStep(n) {
  step = n;
  var s1 = $('step1'), s2 = $('step2');
  if (s1) s1.classList.toggle('hidden', n !== 1);
  if (s2) s2.classList.toggle('hidden', n !== 2);
  $('result').classList.toggle('hidden', n !== 2);
  Array.prototype.forEach.call(document.querySelectorAll('#steps .step'), function (b) { b.classList.toggle('on', Number(b.dataset.step) === n); });
  $('form').scrollTop = 0;
  if (n === 2) {
    // Rows were built with step 1; answers may have moved since (autoPick).
    Array.prototype.forEach.call(document.querySelectorAll('#qs .q'), function (q) { if (q._paint) q._paint(); });
    openNextQ(null);
  }
}
// Step 2 reachable once a model is picked (non-sized products have no step 1).
function syncNext() {
  var ok = !sized || Boolean(picked);
  var b = $('next-btn'); if (b) b.disabled = !ok;
  var p = document.querySelector('#steps [data-step="2"]'); if (p) p.disabled = !ok;
}
// One question row: num · caption · answer · ✕; click → options expand under it.
function qRow(p, n) {
  var q = document.createElement('div');
  q.className = 'q';
  var row = document.createElement('button');
  row.type = 'button';
  row.className = 'q-row';
  var num = document.createElement('span'); num.className = 'num'; num.textContent = n;
  var cap = document.createElement('span'); cap.className = 'cap';
  cap.textContent = p.caption + (p.unit ? ' (' + p.unit + ')' : '');
  if (p.required) { var rq = document.createElement('span'); rq.className = 'req'; rq.textContent = ' *'; cap.appendChild(rq); }
  var val = document.createElement('span'); val.className = 'val';
  var x = document.createElement('span'); x.className = 'x'; x.textContent = '✕'; x.title = 'Clear';
  row.appendChild(num); row.appendChild(cap); row.appendChild(val); row.appendChild(x);
  var body = document.createElement('div');
  body.className = 'q-body hidden';
  var inp = null;
  var paint = function () {
    var d = displayOf(p);
    val.textContent = d || '—';
    q.classList.toggle('set', Boolean(d));
    if (inp) inp.value = sel[p.id] || '';
    Array.prototype.forEach.call(body.querySelectorAll('.q-opt'), function (o) { o.classList.toggle('on', o.dataset.v === String(sel[p.id] || '')); });
  };
  q._paint = paint;
  var commit = function (v) {
    if (v === '' || v === undefined) delete sel[p.id]; else sel[p.id] = v;
    paint();
    refreshResult();
  };
  if (p.valueType === 'Range') {
    body.innerHTML = '<div class="rng"><input type="number" min="0" step="any"><button type="button">Done</button></div>';
    inp = body.querySelector('input');
    var done = function () { commit(inp.value); openNextQ(q); };
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') done(); });
    body.querySelector('button').addEventListener('click', done);
  } else {
    // Every pick list is searchable (CR-265); toggleQ focuses it on open.
    var find = document.createElement('input');
    find.type = 'search';
    find.placeholder = 'Filter…';
    find.className = 'q-find';
    find.addEventListener('input', function () {
      var s = find.value.trim().toLowerCase();
      Array.prototype.forEach.call(body.querySelectorAll('.q-opt'), function (o) {
        o.style.display = !s || o.textContent.toLowerCase().indexOf(s) !== -1 ? '' : 'none';
      });
    });
    body.appendChild(find);
    (valuesByProp[p.id] || []).forEach(function (v) {
      var o = document.createElement('div');
      o.className = 'q-opt';
      o.dataset.v = String(v.id);
      o.textContent = v.displayValue;
      o.addEventListener('click', function () { commit(String(v.id)); openNextQ(q); });
      body.appendChild(o);
    });
  }
  x.addEventListener('click', function (e) { e.stopPropagation(); commit(''); });
  row.addEventListener('click', function () { toggleQ(q.classList.contains('open') ? null : q); });
  paint();
  q.appendChild(row);
  q.appendChild(body);
  return q;
}
// Only one row open at a time; null closes all.
function toggleQ(open) {
  Array.prototype.forEach.call(document.querySelectorAll('#qs .q'), function (e) {
    var on = e === open;
    e.classList.toggle('open', on);
    e.querySelector('.q-body').classList.toggle('hidden', !on);
  });
  if (open) { var i = open.querySelector('input'); if (i) i.focus(); }
}
// After an answer: expand the next unanswered row (from the top when `after` is null).
function openNextQ(after) {
  var all = Array.prototype.slice.call(document.querySelectorAll('#qs .q'));
  var next = all.slice(after ? all.indexOf(after) + 1 : 0).find(function (e) { return !e.classList.contains('set'); });
  toggleQ(next || null);
}
// The Configuration card: MOC + other questions, then Motor Selection rows.
function step2Box(rest, motor) {
  var box = document.createElement('div');
  box.className = 'hl';
  box.innerHTML = '<div class="sec">Configuration</div><div id="qs"></div>';
  var qs = box.querySelector('#qs');
  var n = 0;
  rest.forEach(function (p) { qs.appendChild(qRow(p, ++n)); });
  if (motor.length) {
    qs.insertAdjacentHTML('beforeend', '<div class="sec">Motor Selection</div>');
    motor.forEach(function (p) { qs.appendChild(qRow(p, ++n)); });
  }
  if (!n) qs.innerHTML = '<p class="muted">This product has no questions yet.</p>';
  return box;
}

function renderForm() {
  var form = $('form');
  form.innerHTML = '';
  var model = roleProp('model');
  sized = Boolean(model && roleProp('capacity') && roleProp('density'));
  $('steps').classList.toggle('hidden', !sized);
  if (!sized) {
    // Generic path: a product without sizing roles is the vertical question list alone.
    var s2only = document.createElement('div');
    s2only.id = 'step2';
    s2only.appendChild(step2Box(props, []));
    form.appendChild(s2only);
    syncNext();
    goStep(2);
    return;
  }
  // Series / Model have no dropdowns (CR-223): the picked sizing option fills
  // them, and the SKU name carries them.
  var isPick = function (p) { return p.sizingRole === 'model' || p.sizingRole === 'series'; };
  var group = roleProp('group');
  var feed = props.filter(function (p) { return !isPick(p) && !isMotor(p) && p !== group && (DUTY_ROLES.indexOf(p.sizingRole) > -1 || p.skuPosition < model.skuPosition); });
  var motor = props.filter(isMotor);
  var rest = props.filter(function (p) { return !isPick(p) && !isMotor(p) && p !== group && feed.indexOf(p) === -1; });
  // Bare Shaft: Configuration is MOC only.
  var bareHidden = motorOp ? [] : rest.filter(function (p) { return p !== mocProp(); });
  if (!motorOp) rest = rest.filter(function (p) { return bareHidden.indexOf(p) === -1; });
  var s1 = document.createElement('div');
  s1.id = 'step1';
  var feedBox = section('Valve Selection Section', feed);
  feedBox.classList.add('hl');
  // Volume (Ltr/Min) = TPH×1000 ÷ BD ÷ (RPM×60), shown right after Speed (CR-218).
  var vol = document.createElement('label');
  vol.className = 'fld';
  vol.innerHTML = '<span>Volume (Ltr/Min)</span><input id="volume" readonly placeholder="Calculated volume" />';
  var speedAt = feed.indexOf(roleProp('speed'));
  var grid = feedBox.querySelector('.grid');
  if (speedAt > -1 && grid.children[speedAt]) grid.children[speedAt].after(vol); else grid.appendChild(vol);
  // Last row of the card: RAV type · Motor/Bare Shaft radio · Find button.
  var findRow = document.createElement('div');
  findRow.id = 'find-row';
  findRow.className = 'grid';
  if (group) findRow.appendChild(field(group));
  // Motor Operated / Bare Shaft (CR-224): bare shaft = the valve alone — the
  // motor/gear questions are hidden and cleared so the SKU drops them.
  var op = document.createElement('div');
  op.id = 'op-row';
  op.innerHTML = '<label><input type="radio" name="op" value="motor"> Motor Operated</label>' +
    '<label><input type="radio" name="op" value="bare"> Bare Shaft Operated</label>';
  op.querySelector('[value=' + (motorOp ? 'motor' : 'bare') + ']').checked = true;
  op.addEventListener('change', function (e) {
    motorOp = e.target.value === 'motor';
    // Bare shaft = the valve alone: motor/gear answers and every non-MOC configuration answer go.
    if (!motorOp) motor.concat(rest.filter(function (p) { return p !== mocProp(); })).forEach(function (p) { delete sel[p.id]; });
    var top = form.scrollTop;
    renderForm();
    form.scrollTop = top;
    refreshResult();
  });
  findRow.appendChild(op);
  findRow.insertAdjacentHTML('beforeend', '<button id="find-btn" class="primary" type="button">Find suitable models</button>');
  feedBox.appendChild(findRow);
  feedBox.insertAdjacentHTML('beforeend', '<div id="find-msg" class="error"></div>');
  s1.appendChild(feedBox);
  // Model Selection: the sizing options, its own card (shown once Find has run).
  s1.insertAdjacentHTML('beforeend', '<div id="sizing-box" class="hl hidden"><div class="sec">Model Selection</div><div id="sizing"></div></div>');
  s1.insertAdjacentHTML('beforeend', '<div id="step-foot"><button id="next-btn" class="primary" type="button" disabled>Configuration →</button></div>');
  form.appendChild(s1);
  // Step 2: Configuration rows (MOC first); Motor Selection rows only when Motor Operated.
  var s2 = document.createElement('div');
  s2.id = 'step2';
  s2.innerHTML = '<button id="back-link" type="button">← Valve</button>';
  s2.appendChild(step2Box(rest, motorOp ? motor : []));
  form.appendChild(s2);
  $('find-btn').addEventListener('click', function () { findModels(); });
  $('next-btn').addEventListener('click', function () { goStep(2); });
  $('back-link').addEventListener('click', function () { goStep(1); });
  renderSizing();
  updateVolume();
  syncNext();
  goStep(step);
}

function updateVolume() {
  var inp = $('volume');
  if (!inp) return;
  var num = function (role) { var p = roleProp(role); return p ? Number(sel[p.id]) : 0; };
  var tph = num('capacity'), bd = num('density'), rpm = num('speed') || 20;
  var ok = tph > 0 && bd > 0 && rpm > 0;
  inp.value = ok ? ((tph * 1000) / bd / (rpm * 60)).toFixed(2) : '';
  inp.parentNode.classList.toggle('set', ok);
}

// `preset` = a saved line's sizing input (edit mode); returns the request promise.
function findModels(preset) {
  var num = function (role) { var p = roleProp(role); return p ? Number(sel[p.id]) : 0; };
  var group = roleProp('group');
  var body = preset || {
    industryId: industryId, tph: num('capacity'), bd: num('density'), rpm: num('speed') || 20,
    group: group ? displayOf(group) : '',
  };
  $('find-msg').textContent = '';
  if (!(body.tph > 0) || !(body.bd > 0)) { $('find-msg').textContent = 'Enter ' + roleProp('capacity').caption + ' and ' + roleProp('density').caption + ' first.'; return Promise.resolve(); }
  if (group && !body.group) { $('find-msg').textContent = 'Choose ' + group.caption + ' first.'; return Promise.resolve(); }
  var btn = $('find-btn');
  btn.disabled = true;
  return api('/api/recipe/sizing/select', { method: 'POST', body: JSON.stringify(body) })
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (res) {
      btn.disabled = false;
      if (!res.ok) { $('find-msg').textContent = res.d.error || res.d.message || 'Sizing failed.'; return; }
      sizing = res.d;
      sizing.input = body;
      picked = null;
      syncNext();
      renderSizing();
    })
    .catch(function () { btn.disabled = false; $('find-msg').textContent = 'Sizing failed — network error.'; });
}

function optRow(o, series) {
  var row = document.createElement('div');
  var on = picked && picked.modelCode === o.modelCode && picked.series === series;
  row.className = 'opt' + (on ? ' on' : '');
  // Linked Books valve item (CR-226) leads the row; the sheet code stays as a hint.
  var cells = [
    ['dot', ''], ['m', o.item ? o.item.name : o.modelCode], ['s', series + (o.item ? ' · ' + o.modelCode : '')],
    ['c', o.capacity.toFixed(2) + ' ltr/rev'], ['r', 'runs at ' + o.requiredRpm + ' RPM'],
  ];
  cells.forEach(function (c) {
    var s = document.createElement('span');
    s.className = c[0];
    s.textContent = c[1];
    row.appendChild(s);
  });
  row.addEventListener('click', function () { pick(o, series); });
  return row;
}

function renderSizing() {
  var box = $('sizing');
  if (!box) return;
  box.innerHTML = '';
  $('sizing-box').classList.toggle('hidden', !sizing);
  if (!sizing) return;
  var cap = document.createElement('div');
  cap.className = 'cap';
  var i = sizing.input;
  cap.innerHTML = 'Req. Cap <b></b><span></span>';
  cap.querySelector('b').textContent = sizing.reqCap.toFixed(2) + ' ltr/rev';
  cap.querySelector('span').textContent = i.tph + ' TPH · ' + i.bd + ' kg/ltr · ' + i.rpm + ' RPM' + (i.group ? ' · ' + i.group : '');
  box.appendChild(cap);
  // Options arrive capacity-sorted; show them grouped by series.
  var seriesSeen = [];
  sizing.options.forEach(function (o) { if (seriesSeen.indexOf(o.series) === -1) seriesSeen.push(o.series); });
  seriesSeen.forEach(function (series) {
    sizing.options.filter(function (o) { return o.series === series; })
      .forEach(function (o) { box.appendChild(optRow(o, series)); });
  });
  sizing.tooBig.forEach(function (t) {
    var d = document.createElement('div');
    d.className = 'big';
    d.textContent = 'Above the largest ' + t.series + ' model (' + t.largest.modelCode + ' · ' + t.largest.capacity.toFixed(2) + ' ltr/rev).';
    box.appendChild(d);
  });
  if (!sizing.options.length && !sizing.tooBig.length) {
    var e = document.createElement('div');
    e.className = 'big';
    e.textContent = 'No sizing models are set up for ' + (i.group || 'this product') + '.';
    box.appendChild(e);
  }
}

function pick(o, series) {
  var model = roleProp('model'), ser = roleProp('series');
  var seriesValueId = (sizing.options.find(function (x) { return x.series === series; }) || {}).seriesValueId;
  if (!o.valueId) { $('find-msg').textContent = o.modelCode + ' is missing from the "' + model.caption + '" question values — add it in the app.'; return; }
  $('find-msg').textContent = '';
  picked = { modelCode: o.modelCode, series: series, capacity: o.capacity, requiredRpm: o.requiredRpm, recipeCode: o.recipeCode || '', item: o.item || null };
  sel[model.id] = String(o.valueId);
  if (ser && seriesValueId) sel[ser.id] = String(seriesValueId);
  renderSizing(); // the highlighted option row is the model selection
  syncNext();
  refreshResult();
}

/* ---------- SKU + existing-or-new ---------- */
// Only SKU-active answers go to the generator; duty data rides the quote line.
function skuValues() {
  var sv = {};
  props.forEach(function (p) {
    if (p.activeInSku === false) return;
    if (sel[p.id] !== undefined && sel[p.id] !== '') sv[p.id] = sel[p.id];
  });
  return sv;
}
// "Caption: Value" for every answer, plus the sizing figures of the picked model.
function lineValues() {
  var v = {};
  props.forEach(function (p) { var d = displayOf(p); if (d) v[p.caption] = d; });
  if (picked && sizing) {
    v['Req. Cap'] = sizing.reqCap.toFixed(2) + ' ltr/rev';
    v['Required Speed'] = picked.requiredRpm + ' RPM';
  }
  return v;
}

function renderResult(msg, isError) {
  var sku = $('res-sku');
  sku.innerHTML = '';
  $('res-name').textContent = '';
  $('res-msg').textContent = msg || '';
  $('res-msg').className = isError ? 'error' : 'muted';
  // A linked Books item (CR-226) is ready as soon as it is picked — no SKU generation.
  var linked = Boolean(existing && !gen);
  var ready = linked || Boolean(gen && gen.sku && !(gen.missingRequired || []).length);
  $('res-add').disabled = !ready;
  refreshComponents();
  refreshPrice(ready);
  if (!linked && (!gen || !gen.sku)) {
    var hint = document.createElement('span');
    hint.className = 'muted';
    hint.textContent = 'Answer the questions to generate the SKU.';
    sku.appendChild(hint);
    return;
  }
  sku.appendChild(document.createTextNode(linked ? existing.sku : gen.sku));
  if (ready) {
    var b = document.createElement('span');
    b.className = 'badge ' + (existing ? 'exists' : 'fresh');
    b.id = 'res-badge';
    sku.appendChild(b);
  }
  syncBadge();
  $('res-name').textContent = (existing && existing.name) || (gen && gen.name) || '';
}

/* ---------- BOM items (Product Design + Books category + Component Map) ---------- */
// First the picked model's Product Design components (CR-227, on pick; the
// material cell fills once the MOC names one), then — once the MOC is chosen
// (CR-223) — every Books item under the item category <MOC caption> → <MOC
// answer> (Casing CI, Side Cover CI…), then the Component Map lines. Display
// only — the quote still gets the one valve line, and the Component Map alone
// builds the Books BOM when the item is pushed.
var compKey = null;
var compLines = [];      // last resolved component lines — asQuoteLine ones become their own quote lines (CR-195)
var compView = [];       // what the list shows, [{c, item, qty, cls}] — frozen on the line as its BOM (CR-246)
function compRow(cells, cls, title) {
  var row = document.createElement('div');
  cells.forEach(function (c) {
    var sp = document.createElement('span');
    sp.className = c[0];
    sp.textContent = c[1];
    row.appendChild(sp);
  });
  if (cls) row.className = cls;
  if (title) row.title = title;
  return row;
}
function refreshComponents() {
  var box = $('res-comps');
  var moc = mocProp();
  var mocDone = Boolean(moc && sel[moc.id]);
  var design = picked && (picked.recipeCode || picked.item) ? { recipeCode: picked.recipeCode, skuItemId: picked.item ? picked.item.id : null } : null;
  if (!mocDone && !design) { compKey = null; compLines = []; compView = []; box.innerHTML = ''; return; }
  var key = industryId + '|' + JSON.stringify(sel) + '|' + JSON.stringify(design);
  if (key === compKey) return;
  compKey = key;
  compLines = [];
  compView = [];
  box.innerHTML = '';
  // Every row shown is also remembered for the line's BOM snapshot.
  var addRow = function (cells, cls, title) {
    box.appendChild(compRow(cells, cls, title));
    compView.push({ c: cells[0][1], item: cells[1][1], qty: cells[2][1], cls: cls || '' });
  };
  var child = mocDone ? displayOf(moc) : '';
  var none = function () { return Promise.resolve(null); };
  var lv = lineValues();
  Promise.all([
    !design ? none() : api('/api/recipe/sizing/bom', { method: 'POST', body: JSON.stringify({ recipeCode: design.recipeCode, skuItemId: design.skuItemId, answers: Object.keys(lv).map(function (k) { return lv[k]; }) }) })
      .then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
    !mocDone ? none() : api('/api/recipe/category-items?parent=' + encodeURIComponent(moc.caption) + '&child=' + encodeURIComponent(child))
      .then(function (r) { return r.ok ? r.json() : []; }).catch(function () { return []; }),
    !mocDone ? none() : api('/api/recipe/component-map/resolve', { method: 'POST', body: JSON.stringify({ industryId: industryId, selectedValues: sel }) })
      .then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
  ]).then(function (res) {
    if (key !== compKey) return; // stale
    // Product Design lines: component · item (or material) · qty. Red only when
    // something is linked but not in Books yet.
    var covered = {};
    ((res[0] && res[0].lines) || []).forEach(function (l) {
      covered[String(l.component).trim().toLowerCase()] = true;
      var linked = Boolean(l.sku || l.name || l.material);
      var item = l.sku ? l.sku + ' · ' + (l.name || '') : (l.name || l.material || 'no item linked');
      addRow(
        [['c-name', l.component], ['c-item', item], ['c-qty', '× ' + l.qty + ' ' + (l.uom || 'Nos')]],
        linked && !l.inBooks ? 'error' : '', linked && !l.inBooks ? 'Not in Zoho Books yet.' : '');
    });
    (Array.isArray(res[1]) ? res[1] : []).forEach(function (it) {
      addRow([['c-name', child], ['c-item', (it.sku ? it.sku + ' · ' : '') + (it.name || '')], ['c-qty', '']]);
    });
    var d = res[2];
    if (!d) return; // no access / MOC not chosen — the map list is optional
    compLines = d.lines || [];
    compLines.forEach(function (l) {
      var bad = !l.sku || !l.inBooks;
      addRow(
        [['c-name', l.component], ['c-item', l.sku ? l.sku + ' · ' + (l.name || '') : 'item deleted'], ['c-qty', '× ' + l.qty + ' ' + (l.uom || 'Nos') + (l.asQuoteLine ? ' · separate line' : '')]],
        bad ? 'error' : '', bad && l.sku ? 'Not in Zoho Books yet — the Books push will fail until it is.' : '');
    });
    // A component the design already lists is not "unmapped".
    (d.missing || []).filter(function (c) { return !covered[String(c).trim().toLowerCase()]; }).forEach(function (c) {
      addRow([['c-name', c], ['c-item', 'no item mapped for these answers'], ['c-qty', '']], 'error', '');
    });
  });
}

/* ---------- design cost (CR-211) ---------- */
// Rate from the picked model's Product Design (SizingModel.recipeCode →
// POST /sizing/price) when the org's SKU setting is on and the Rate box has
// not been typed in. Every answer goes along as text so the server can pick
// the material option the MOC names. Prefills the Base price box only — no
// cost line is shown (CR-238); a failed lookup leaves the box alone.
var designRate = false;
var priceKey = null;
var rateTyped = false;
$('res-rate').addEventListener('input', function () { rateTyped = true; });
function refreshPrice(ready) {
  var code = picked && picked.recipeCode;
  if (!ready || !designRate || !code) { priceKey = null; return; }
  var lv = lineValues();
  var answers = Object.keys(lv).map(function (k) { return lv[k]; });
  var key = code + '|' + JSON.stringify(answers);
  if (key === priceKey) return;
  priceKey = key;
  api('/api/recipe/sizing/price', { method: 'POST', body: JSON.stringify({ recipeCode: code, answers: answers }) })
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (res) {
      if (key !== priceKey || !res.ok) return;
      if (!rateTyped) $('res-rate').value = res.d.unitCost;
    })
    .catch(function () { /* no prefill */ });
}

function syncBadge() {
  var b = $('res-badge');
  if (!b) return;
  b.textContent = existing ? (existing.zohoItemId ? (picked && picked.item === existing ? 'BOOKS ITEM' : 'EXISTING ITEM · IN BOOKS') : 'EXISTING ITEM · NOT IN BOOKS')
    : 'NEW ITEM — WILL BE CREATED';
}

function refreshResult() {
  // Picked model carries a Books valve item (CR-226): quote it as-is, no generate.
  if (picked && picked.item) { genKey = null; gen = null; existing = picked.item; return renderResult(); }
  var sv = skuValues();
  var key = industryId + '|' + JSON.stringify(sv);
  if (key === genKey) return;
  genKey = key;
  gen = null; existing = null;
  if (!Object.keys(sv).length) return renderResult();
  renderResult('Generating SKU…');
  api('/api/sku/generate', { method: 'POST', body: JSON.stringify({ industryId: industryId, selectedValues: sv }) })
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (res) {
      if (key !== genKey) return; // stale response
      if (!res.ok) return renderResult(res.d.error || 'SKU preview failed.', true);
      gen = res.d;
      if ((gen.missingRequired || []).length) return renderResult('Still needed: ' + gen.missingRequired.join(', ') + '.');
      if (!gen.duplicate) return renderResult();
      // SKU already in the catalog → show that item instead of creating a twin.
      return api('/api/sku-items/search', { method: 'POST', body: JSON.stringify({ sku: gen.sku }) })
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (items) {
          if (key !== genKey) return;
          existing = (Array.isArray(items) ? items : []).find(function (it) { return it.sku === gen.sku; }) || null;
          renderResult(existing ? '' : 'SKU exists but the item could not be loaded.', !existing);
          if (!existing) $('res-add').disabled = true;
        });
    })
    .catch(function () { if (key === genKey) renderResult('SKU preview failed — network error.', true); });
}

$('res-add').addEventListener('click', async function () {
  var btn = $('res-add');
  btn.disabled = true;
  try {
    var item = existing;
    if (!item) {
      var r = await api('/api/sku/create-item', { method: 'POST', body: JSON.stringify({
        name: gen.name || gen.sku, sku: gen.sku, description: gen.description || '', type: 'Manufacturing',
        industryId: industryId, selectedValues: skuValues(), uom: uomList[0],
      }) });
      item = await r.json();
      if (!r.ok) throw new Error(item.error || 'Create failed.');
    }
    // Items are never pushed to Books from this widget (CR-238): new ones sit
    // in the SKU master and are pushed later from the SKU Items page. The
    // pending chip marks lines whose item is not in Books yet.
    var badge = item.zohoItemId ? null : 'pending';
    var qty = 1;
    // What the line needs to be re-opened for editing (CR-246) + its BOM snapshot.
    var config = {
      industryId: industryId, sel: JSON.parse(JSON.stringify(sel)), motorOp: motorOp,
      sizingInput: sizing ? sizing.input : null, pick: picked ? { modelCode: picked.modelCode, series: picked.series } : null,
    };
    var it = { sku: item.sku, name: item.name, type: item.type || 'Manufacturing', values: lineValues(), config: config, bom: compView.slice() };
    var line = editingId && findLine(editingId);
    if (line) {
      // Update in place: answers, item and BOM change; qty / UOM / disc stay.
      Object.assign(line, it, { cls: classOf(it.type), badge: badge });
      if (rateTyped) { line.rate = Number($('res-rate').value) || 0; line.rateTouched = true; }
      // Loose components follow the valve: drop the old ones, add the current set after it.
      lines = lines.filter(function (l) { return l.parent !== line.id; });
      var kids = looseLines(line.id, line.qty);
      lines.splice.apply(lines, [lines.indexOf(line) + 1, 0].concat(kids));
      renderCart();
      if (!line.rateTouched) prefillRate(line);
      kids.forEach(prefillRate);
      stopEdit();
      setStatus('Line updated — Add item to ' + moduleName.replace(/s$/, '').toLowerCase() + ' to send it to CRM.');
    } else {
      line = addToCart(Object.assign({ id: 'c' + (++lineSeq) }, it),
        { badge: badge, rate: Number($('res-rate').value) || 0, qty: qty, uom: item.uom || uomList[0] });
      looseLines(line.id, qty).forEach(function (l) { lines.push(l); renderCart(); prefillRate(l); });
      setStatus('');
    }
    rateTyped = false; priceKey = null; // next pick fills the Rate box again
    genKey = null; // same answers now resolve to the existing item
    refreshResult();
  } catch (err) {
    renderResult(err.message || String(err), true);
    btn.disabled = false;
  }
});
// Components sold separately (map rows flagged "separate quote line") get their
// own line, qty × valves; they are not in the composite BOM (push.js).
function looseLines(parentId, qty) {
  return compLines.filter(function (l) { return l.asQuoteLine && l.sku; }).map(function (l) {
    return newLine({ id: 'c' + (++lineSeq), sku: l.sku, name: l.name || l.sku, type: 'Trading', values: { Component: l.component }, parent: parentId },
      { qty: l.qty * qty, uom: l.uom });
  });
}

/* ---------- edit a cart line (CR-246) ---------- */
// Re-opens the line's saved answers: same product, its sizing input re-run
// (one /sizing/select) and the saved model re-picked, then step 2. "Add to
// lines" becomes "Update line" until done or cancelled.
function editLine(line) {
  var cfg = line.config;
  if (!cfg) return;
  closePop();
  editingId = line.id;
  $('res-add').textContent = 'Update line';
  $('res-cancel').classList.remove('hidden');
  setStatus('Editing ' + line.sku + ' — change the answers, then Update line.');
  if ($('product').querySelector('[value="' + cfg.industryId + '"]')) $('product').value = cfg.industryId;
  loadProduct(function () {
    Object.keys(cfg.sel || {}).forEach(function (k) { sel[k] = cfg.sel[k]; });
    motorOp = cfg.motorOp !== false;
    renderForm();
    var done = function () { goStep(2); refreshResult(); };
    if (!cfg.sizingInput || !cfg.pick) return done();
    findModels(cfg.sizingInput).then(function () {
      var o = sizing && sizing.options.find(function (x) { return x.modelCode === cfg.pick.modelCode && x.series === cfg.pick.series; });
      if (o) { pick(o, o.series); return done(); }
      $('find-msg').textContent = 'Saved model ' + cfg.pick.modelCode + ' (' + cfg.pick.series + ') is not offered any more — pick again.';
      goStep(1);
    });
  });
}
function stopEdit() {
  editingId = null;
  $('res-add').textContent = 'Add to lines';
  $('res-cancel').classList.add('hidden');
}
$('res-cancel').addEventListener('click', function () { stopEdit(); setStatus(''); });

/* ---------- cart (quote lines) ---------- */
// `rate` is the BASE price; the CRM line gets unitPrice() — the ladder result
// for the line's class (CR-220). `disc` stays the CRM line discount.
function newLine(it, opts) {
  opts = opts || {};
  return {
    id: it.id, sku: it.sku, name: it.name, type: it.type || '', values: it.values || {},
    qty: opts.qty || 1, uom: opts.uom || 'Nos', rate: opts.rate || 0, disc: 0, cls: classOf(it.type),
    rateTouched: Boolean(opts.rate), badge: opts.badge || null,
    parent: it.parent || null, config: it.config || null, bom: it.bom || [],
  };
}
// Prefill the rate from the CRM Product's Unit_Price (async, keeps manual edits).
function prefillRate(line) {
  if (line.rateTouched) return;
  ZOHO.CRM.API.searchRecord({
    Entity: 'Products', Type: 'criteria',
    Query: '(Product_Code:equals:' + line.sku + ')',
  }).then(function (res) {
    var hit = res && res.data && res.data[0];
    if (hit && findLine(line.id) && !line.rateTouched) {
      line.rate = Number(hit.Unit_Price) || 0;
      renderCart();
    }
  }).catch(function () { /* no prefill */ });
}
function addToCart(it, opts) {
  var line = newLine(it, opts);
  lines.push(line);
  renderCart();
  prefillRate(line);
  return line;
}
function removeFromCart(id) {
  // A valve takes its loose components with it.
  lines = lines.filter(function (l) { return l.id !== id && l.parent !== id; });
  if (editingId === id || (editingId && !findLine(editingId))) { stopEdit(); setStatus(''); }
  renderCart();
}
function lineTotal(l) { return l.qty * unitPrice(l) * (1 - l.disc / 100); }
function updateTotals() {
  $('line-count').textContent = lines.length;
  $('add-btn').disabled = !lines.length;
  $('quote-btn').disabled = !lines.length;
  $('save-btn').disabled = !lines.length && !hadSaved;
  $('lines-clear').classList.toggle('hidden', !lines.length);
}
$('lines-clear').addEventListener('click', function () {
  lines = [];
  if (editingId) { stopEdit(); setStatus(''); }
  renderCart();
});
// Save the cart + configuration on this record (CR-246). `key`/`ids` override
// the record key and owned rows (Deal → Quote re-keys the same cart).
// A quote's cart also carries the quote number: the work order raised from the
// converted sales order finds this configuration by it.
var quoteNos = {};
function quoteNoOf(key) {
  var m = /^quotes:(\d+)$/.exec(key);
  if (!m) return Promise.resolve('');
  if (quoteNos[key] !== undefined) return Promise.resolve(quoteNos[key]);
  return ZOHO.CRM.API.getRecord({ Entity: 'Quotes', RecordID: m[1] }).then(function (res) {
    var rec = res && res.data && res.data[0];
    // Quote_No = an org's own numbering field (when it has one), else CRM's Quote_Number.
    return (quoteNos[key] = String((rec && (rec.Quote_No || rec.Quote_Number)) || ''));
  }).catch(function () { return ''; }); // the number is a convenience — never blocks the save
}
function saveConfig(key, ids) {
  key = key || docKey;
  return quoteNoOf(key).then(function (quoteNo) {
    return api('/api/recipe/config-quote/' + encodeURIComponent(key), {
      method: 'POST', body: JSON.stringify({ crmRowIds: ids || ownedRowIds, lines: lines, quoteNo: quoteNo }),
    });
  }).then(function (r) {
    if (r.ok) { hadSaved = true; return r.json(); }
    return r.json().catch(function () { return {}; }).then(function (d) { throw new Error(d.error || ('Save failed (' + r.status + ')')); });
  });
}
$('save-btn').addEventListener('click', function () {
  $('save-btn').disabled = true;
  saveConfig()
    .then(function () { setStatus('Saved.'); }, function (e) { setStatus('Save failed: ' + errText(e), true); })
    .then(updateTotals);
});
function moveLine(i, d) {
  var j = i + d;
  if (j < 0 || j >= lines.length) return;
  var t = lines[i]; lines[i] = lines[j]; lines[j] = t;
  renderCart();
}
function renderCart() {
  var box = $('lines');
  box.innerHTML = '';
  if (!lines.length) box.innerHTML = '<div class="l-empty">No lines yet.<br>Configure a product and add it.</div>';
  lines.forEach(function (it, idx) {
    var card = document.createElement('div');
    card.className = 'l-card ' + it.cls;
    card.dataset.id = it.id;
    var mv = document.createElement('div');
    mv.className = 'l-move';
    [['▲', -1, idx === 0], ['▼', 1, idx === lines.length - 1]].forEach(function (m) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = m[0];
      b.disabled = m[2];
      b.addEventListener('click', function () { moveLine(idx, m[1]); });
      mv.appendChild(b);
    });
    card.appendChild(mv);
    var main = document.createElement('div');
    var top = document.createElement('div');
    top.className = 'l-top';
    var nm = document.createElement('div');
    nm.className = 'l-name';
    nm.textContent = it.name;
    var sk = document.createElement('div');
    sk.className = 'l-sku';
    sk.textContent = it.sku;
    var cb = document.createElement('span');
    cb.className = 'badge cls ' + it.cls;
    cb.textContent = it.cls === 'mfg' ? 'Mfg' : 'BO';
    sk.appendChild(cb);
    if (it.type) {
      var tb = document.createElement('span');
      tb.className = 'badge type';
      tb.textContent = typeLabel(it.type);
      sk.appendChild(tb);
    }
    if (it.badge) {
      var bd = document.createElement('span');
      bd.className = 'badge ' + (it.badge === 'pending' ? 'pending' : 'books');
      bd.textContent = it.badge === 'pending' ? 'NEW — NOT PUSHED' : 'NEW IN BOOKS';
      sk.appendChild(bd);
    }
    nm.appendChild(sk);
    var x = document.createElement('button');
    x.type = 'button';
    x.className = 'l-x';
    x.textContent = '×';
    x.addEventListener('click', function () { removeFromCart(it.id); });
    top.appendChild(nm); top.appendChild(x);
    main.appendChild(top);
    var grid = document.createElement('div');
    grid.className = 'l-grid';
    [['Qty', 'qty', 1], ['UOM', 'uom'], ['Base price', 'rate', 0], ['Disc %', 'disc', 0]].forEach(function (f) {
      var lab = document.createElement('label');
      lab.textContent = f[0];
      if (f[1] === 'uom') {
        var sel = document.createElement('select');
        uomList.concat(uomList.indexOf(it.uom) < 0 ? [it.uom] : []).forEach(function (u) {
          var o = document.createElement('option');
          o.value = o.textContent = u;
          sel.appendChild(o);
        });
        sel.value = it.uom;
        sel.addEventListener('change', function () { it.uom = sel.value; });
        lab.appendChild(sel);
        grid.appendChild(lab);
        return;
      }
      var inp = document.createElement('input');
      inp.type = 'number';
      inp.min = f[2];
      if (f[1] === 'disc') inp.max = 100;
      inp.value = it[f[1]];
      inp.addEventListener('input', function () {
        var v = Number(inp.value) || f[2];
        it[f[1]] = f[1] === 'disc' ? Math.min(100, Math.max(0, v)) : v;
        if (f[1] === 'rate') it.rateTouched = true;
        updateTotals(); // in place — a full re-render would drop the input focus
      });
      lab.appendChild(inp);
      grid.appendChild(lab);
    });
    // Card actions: Edit (configured lines), BOM (snapshot), Price detail (CR-220 ladder popover).
    var unitRow = document.createElement('div');
    unitRow.className = 'l-unit';
    var actions = [];
    if (it.config) actions.push(['Edit', function () { editLine(it); }]);
    if (it.bom && it.bom.length) actions.push(['BOM', function () { openBom(it, card); }]);
    actions.push(['Price detail', function () { openPop(it, card); }]);
    actions.forEach(function (a) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = a[0];
      b.addEventListener('click', a[1]);
      unitRow.appendChild(b);
    });
    grid.appendChild(unitRow);
    main.appendChild(grid);
    card.appendChild(main);
    box.appendChild(card);
  });
  updateTotals();
}

/* ---------- price detail popover (CR-220, mockup 1e) ---------- */
// Base input, Mfg/BO toggle, the ladder steps with their % and value, unit
// total. Edits apply to the line in place; the card re-renders on close.
var popLine = null, popFlash = null;
function closePop() {
  var p = $('pop'), s = $('pop-scrim');
  if (p) p.remove();
  if (s) s.remove();
  if (popLine) { popLine = null; renderCart(); }
}
// Scrim + empty popover box anchored at the card (shared by Price detail and BOM).
function showPop(line, card) {
  closePop();
  popLine = line;
  var host = $('lines');
  var scrim = document.createElement('div');
  scrim.id = 'pop-scrim';
  scrim.addEventListener('click', closePop);
  var pop = document.createElement('div');
  pop.id = 'pop';
  // Below the card when it fits, else above the footer.
  pop.style.top = Math.max(4, Math.min(card.offsetTop + 8, host.scrollHeight - 320)) + 'px';
  host.appendChild(scrim); host.appendChild(pop);
  return pop;
}
function openPop(line, card) { drawPop(line, showPop(line, card), false); }
// BOM snapshot (CR-246): the component list as it read when the line was added.
function openBom(line, card) {
  var pop = showPop(line, card);
  pop.innerHTML = '<div class="p-head"><b></b><span></span></div><div class="bom"></div><div class="p-foot"><span>As resolved when the line was added</span></div>';
  pop.querySelector('b').textContent = line.name || line.sku;
  pop.querySelector('.p-head span').textContent = line.sku;
  var box = pop.querySelector('.bom');
  (line.bom || []).forEach(function (r) {
    box.appendChild(compRow([['c-name', r.c], ['c-item', r.item], ['c-qty', r.qty]], r.cls || '', ''));
  });
}
function drawPop(line, pop, flash) {
  var clsName = line.cls === 'mfg' ? 'Mfg' : 'BO';
  pop.innerHTML = '';
  var head = document.createElement('div');
  head.className = 'p-head';
  head.innerHTML = '<b></b><span></span>';
  head.querySelector('b').textContent = line.name || line.sku;
  head.querySelector('span').textContent = line.sku;
  pop.appendChild(head);

  var inRow = document.createElement('div');
  inRow.className = 'p-in';
  var bl = document.createElement('label');
  bl.textContent = 'Base price';
  var bi = document.createElement('input');
  bi.type = 'number'; bi.min = 0; bi.value = line.rate;
  bi.addEventListener('input', function () {
    line.rate = Number(bi.value) || 0; line.rateTouched = true;
    fillPopTable(line, tbl); updateTotals();
  });
  bl.appendChild(bi);
  var cl = document.createElement('label');
  cl.textContent = 'Class';
  var seg = document.createElement('div');
  seg.className = 'seg';
  [['mfg', 'Mfg'], ['bo', 'BO']].forEach(function (c) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = c[1];
    b.className = line.cls === c[0] ? 'on' : '';
    b.addEventListener('click', function () {
      if (line.cls === c[0]) return;
      line.cls = c[0];
      updateTotals();
      drawPop(line, pop, true);
    });
    seg.appendChild(b);
  });
  cl.appendChild(seg);
  inRow.appendChild(bl); inRow.appendChild(cl);
  pop.appendChild(inRow);

  var tbl = document.createElement('table');
  pop.appendChild(tbl);
  fillPopTable(line, tbl, flash);

  var foot = document.createElement('div');
  foot.className = 'p-foot';
  var l = document.createElement('span');
  l.textContent = clsName + ' % set from org settings';
  var n = document.createElement('span');
  n.className = 'note';
  n.textContent = flash ? '% set switched to ' + clsName : '';
  foot.appendChild(l); foot.appendChild(n);
  pop.appendChild(foot);
  clearTimeout(popFlash);
  if (flash) popFlash = setTimeout(function () {
    tbl.querySelectorAll('tr.flash').forEach(function (r) { r.classList.remove('flash'); });
    n.textContent = '';
  }, 1400);
}
function fillPopTable(line, tbl, flash) {
  var lad = ladderOf(line), pcts = priceLadder[line.cls] || {};
  var rows = '<tr><th>Step</th><th>%</th><th>Value</th></tr>' +
    '<tr><td>Base</td><td></td><td>' + fmtMoney(lad.base) + '</td></tr>';
  LADDER_STEPS.forEach(function (s) {
    rows += '<tr' + (flash ? ' class="flash"' : '') + '><td>' + s[1] + '</td><td class="pct">' + (Number(pcts[s[0]]) || 0) + '%</td><td>' + fmtMoney(lad[s[0]]) + '</td></tr>';
  });
  rows += '<tr class="tot"><td>Total / unit</td><td></td><td>' + fmtMoney(lad.unit) + '</td></tr>';
  tbl.innerHTML = rows;
}

/* ---------- write-back to the Quote ---------- */
function setStatus(text, isError) {
  var s = $('status');
  s.textContent = text;
  s.className = isError ? 'error' : '';
}

// CRM derives the quote line's Size (and the other parameter columns) from the
// Product record — a Size sent on the line itself is ignored. So the Product
// carries the item's parameter values (Size, Design Type, …) and its newline
// description, and an existing product gets them refreshed (catalog wins).
var productCols = null;
function getProductCols() {
  if (productCols) return Promise.resolve(productCols);
  return ZOHO.CRM.META.getFields({ Entity: 'Products' }).then(function (r) {
    productCols = (r && r.fields) || [];
    return productCols;
  }, function () { productCols = []; return productCols; });
}
// Non-fatal problems from a push (a Product whose parameter fields CRM
// rejected, e.g. a value missing from a picklist) — shown after the push
// instead of auto-closing, so the CRM field can be fixed.
var warnings = [];
// CRM's SDK resolves with a per-row code on failure (not a rejection).
function rowError(out) {
  var row = out && out.data && out.data[0];
  if (row && row.code === 'SUCCESS') return null;
  return row ? row.code + ' ' + JSON.stringify(row.details || row.message) : 'no response';
}
function insertProduct(data) {
  return ZOHO.CRM.API.insertRecord({ Entity: 'Products', APIData: data, Trigger: CRM_TRIGGER }).then(function (ins) {
    var e = rowError(ins);
    if (e) throw new Error(e);
    return ins.data[0].details.id;
  });
}
// Fixed picklists on a new Product, matched by field label so the org's API
// name / value casing doesn't matter; a field the module lacks is skipped.
var FIXED_PRODUCT_PICKS = { 'Product Type': 'goods', 'Item Classification': 'Finished Good' };
function fixedProductPicks() {
  var out = {};
  productCols.forEach(function (f) {
    var want = FIXED_PRODUCT_PICKS[f.field_label];
    if (!want) return;
    var pv = (f.pick_list_values || []).filter(function (p) {
      return String(p.actual_value || p.display_value).toLowerCase() === want.toLowerCase();
    })[0];
    out[f.api_name] = pv ? (pv.actual_value || pv.display_value) : want;
  });
  return out;
}
function findOrCreateProduct(it) {
  return getProductCols().then(function () {
    return ZOHO.CRM.API.searchRecord({
      Entity: 'Products', Type: 'criteria',
      Query: '(Product_Code:equals:' + it.sku + ')',
    });
  }).then(function (res) {
    var hit = res && res.data && res.data[0];
    var params = { Description: lineDesc(it) };
    applyParamCols(productCols, it, params);
    // Item Source picklist (Direct Purchase / In-House Manufacturing) from the
    // item's type — only when the org's Products module has the field.
    if (it.type && productCols.some(function (f) { return f.api_name === 'Item_Source'; })) {
      params.Item_Source = typeLabel(it.type);
    }
    if (hit) {
      params.id = hit.id;
      // A failed refresh never blocks the quote line — it is reported instead.
      return ZOHO.CRM.API.updateRecord({ Entity: 'Products', APIData: params, Trigger: CRM_TRIGGER })
        .then(function (out) { var e = rowError(out); if (e) warnings.push(it.sku + ': product fields not updated — ' + e); return hit.id; },
              function (err) { warnings.push(it.sku + ': product fields not updated — ' + errText(err)); return hit.id; });
    }
    var base = Object.assign({ Product_Name: it.name, Product_Code: it.sku, Unit_Price: unitPrice(it) || 0 }, fixedProductPicks());
    // Parameter fields rejected → still create the bare product so the line lands.
    return insertProduct(Object.assign({}, base, params)).catch(function (err) {
      warnings.push(it.sku + ': product created without parameter fields — ' + errText(err));
      return insertProduct(base);
    }).catch(function (err) { throw new Error('Product create failed for ' + it.sku + ': ' + errText(err)); });
  });
}
// After a successful push: close-and-reload when clean, otherwise stay open
// with the warnings so they can be read.
function finish(msg) {
  if (!warnings.length) { setStatus(msg); ZOHO.CRM.UI.Popup.closeReload(); return; }
  setStatus(msg + ' Close this window to refresh. ' + warnings.join(' | '), true);
}

// Metadata-driven subform discovery: which key holds the standard line items
// (Quotes only — Deals has none), and is there a custom subform to mirror
// item details into (Deals: "Product Information")?
// Cached; a META failure degrades to { stdKey: null, custom: null } and the
// add flow falls back to record-read detection (standard subform only).
var subformInfo = null;
function discoverSubforms() {
  if (subformInfo) return Promise.resolve(subformInfo);
  if (!window.ZOHO || !ZOHO.CRM.META || typeof ZOHO.CRM.META.getFields !== 'function') {
    return Promise.resolve({ stdKey: null, custom: null });
  }
  return ZOHO.CRM.META.getFields({ Entity: moduleName }).then(function (res) {
    var fields = (res && res.fields) || [];
    var subs = fields.filter(function (f) { return f.data_type === 'subform'; });
    var std = null, custom = null, info;
    if (moduleName === 'Quotes') {
      std = subs.find(function (f) { return f.api_name === 'Quoted_Items'; });
      custom = subs.find(function (f) { return f.api_name !== 'Quoted_Items'; });
      // Old-style orgs list no subform field for line items → classic Product_Details.
      info = { stdKey: std ? 'Quoted_Items' : 'Product_Details', custom: null };
    } else {
      // Deals: no standard line-items subform — write only the custom one
      // ("Product Information"; fall back to whatever subform exists).
      custom = subs.find(function (f) {
        return normLabel(f.field_label) === 'productinformation';
      }) || subs[0];
      info = { stdKey: null, custom: null };
    }
    if (!custom) { subformInfo = info; return info; }
    var mod = (custom.subform && custom.subform.module) || custom.api_name;
    return ZOHO.CRM.META.getFields({ Entity: mod }).then(function (r2) {
      var cols = (r2 && r2.fields) || [];
      // A lookup-to-Products column (if any) gets the found/created product id.
      var prodCol = cols.find(function (f) {
        var m = f.lookup && (f.lookup.module && f.lookup.module.api_name || f.lookup.module);
        return f.data_type === 'lookup' && m === 'Products';
      });
      info.custom = { key: custom.api_name, columns: cols, productCol: prodCol ? prodCol.api_name : null };
      subformInfo = info;
      return info;
    }, function () { subformInfo = info; return info; }); // columns unreadable → std only
  }, function () { return { stdKey: null, custom: null }; });
}

// Map a cart line onto the custom subform's columns by display label:
// fixed aliases for sku/name/qty/rate/disc, everything else matched against
// the item's property captions (column "Size" ↔ property "Size", etc.).
function normLabel(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
// Property value for a column: by display label, else by API name
// (Products "Surface_Treatment_G" ↔ property "Surface Treatment (G)").
function colVal(vals, f) {
  var v = vals[normLabel(f.field_label)];
  return v === undefined ? vals[normLabel(f.api_name)] : v;
}
var FIXED_COLS = {
  sku: 'sku', skucode: 'sku', productcode: 'sku', itemcode: 'sku',
  item: 'name', itemname: 'name', name: 'name', productname: 'name', product: 'name',
  qty: 'qty', quantity: 'qty',
  rate: 'rate', price: 'rate', listprice: 'rate', unitprice: 'rate',
  disc: 'disc', discount: 'disc', discountpercent: 'disc',
};
function customRow(custom, line, pid) {
  var columns = custom.columns;
  var vals = paramVals(line);
  var row = {};
  if (custom.productCol && pid) row[custom.productCol] = { id: pid };
  columns.forEach(function (f) {
    if (f.read_only || f.data_type === 'lookup' || f.data_type === 'subform' || f.api_name === 'id') return;
    var l = normLabel(f.field_label);
    var fixed = FIXED_COLS[l];
    var v = fixed ? line[fixed] : colVal(vals, f);
    if (v === undefined || v === null || v === '') return;
    var numeric = f.data_type === 'double' || f.data_type === 'integer' || f.data_type === 'currency';
    row[f.api_name] = numeric ? Number(v) || 0 : String(v);
  });
  return row;
}

// Re-send an existing subform row as { id } only — the row is retained
// unchanged, without echoing back read-only fields (subform update replaces
// all rows; omitted rows are deleted). Rows the widget wrote earlier
// (ownedRowIds, CR-246) are left out — the cart replaces them.
function keepRows(rows) {
  return (rows || []).filter(function (r) { return ownedRowIds.indexOf(String(r.id)) < 0; })
    .map(function (r) { return r.id ? { id: r.id } : r; });
}
// The rows just written are the last N of each subform (appended after the
// kept rows) — read them back so the next push can replace them.
function readOwnedRows(entity, id, keys) {
  return ZOHO.CRM.API.getRecord({ Entity: entity, RecordID: id }).then(function (res) {
    var rec = res && res.data && res.data[0];
    var ids = [];
    keys.forEach(function (k) {
      if (!k[0] || !k[1]) return;
      ((rec && rec[k[0]]) || []).slice(-k[1]).forEach(function (r) { if (r.id) ids.push(String(r.id)); });
    });
    return ids;
  });
}

// Zoho SDK rejects with plain objects, not Errors — stringify those.
function errText(err) {
  return err && err.message ? err.message
    : (typeof err === 'object' ? JSON.stringify(err) : String(err));
}

// Writes the cart lines into the current record's subforms.
async function pushLines() {
  setStatus('Reading record…');
  var info = await discoverSubforms();
  var res = await ZOHO.CRM.API.getRecord({ Entity: moduleName, RecordID: recordId });
  var rec = res && res.data && res.data[0];
  if (!rec) throw new Error('Could not read the record.');
  // Metadata names the standard subform; the record-read guess (which fails
  // on empty quotes) is only the META-less fallback, defaulting to v2.
  // Deals has no standard line-items subform — custom rows only.
  var stdKey = moduleName === 'Quotes'
    ? (info.stdKey || (rec.Quoted_Items ? 'Quoted_Items' : 'Product_Details'))
    : null;
  var v3 = stdKey === 'Quoted_Items';
  // A Products record is only needed for the std subform / a Products lookup column.
  var needsProduct = Boolean(stdKey || (info.custom && info.custom.productCol));
  if (!stdKey && !info.custom) throw new Error('No line-item subform found on this ' + moduleName.replace(/s$/, '') + '.');
  // Parameter values (Size etc.) go into the line description column and any
  // matching custom subform columns.
  var stdDescCol = null, stdCols = null;
  if (stdKey) {
    var qMeta = await getQuotesLineMeta();
    if (qMeta.key === stdKey) { stdDescCol = qMeta.descCol; stdCols = qMeta.columns; }
    else if (stdKey === 'Product_Details') stdDescCol = 'product_description';
  }

  var stdRows = [], custRows = [];
  for (var i = 0; i < lines.length; i++) {
    setStatus('Item ' + (i + 1) + ' of ' + lines.length + ': ' + lines[i].sku + '…');
    var pid = needsProduct ? await findOrCreateProduct(lines[i]) : null;
    // CRM's subform Discount is an amount, not a percent.
    var unit = unitPrice(lines[i]);
    var discAmt = lines[i].qty * unit * lines[i].disc / 100;
    if (stdKey) {
      var srow = v3
        ? { Product_Name: { id: pid }, Quantity: lines[i].qty, List_Price: unit, Discount: discAmt }
        : { product: { id: pid }, quantity: lines[i].qty, list_price: unit, Discount: discAmt };
      var d = lineDesc(lines[i]);
      if (d && stdDescCol) srow[stdDescCol] = d;
      applyParamCols(stdCols, lines[i], srow);
      stdRows.push(srow);
    }
    if (info.custom) custRows.push(customRow(info.custom, lines[i], pid));
  }

  setStatus('Updating record…');
  // Subform updates REPLACE all rows — existing rows must be re-sent.
  var upd = { id: recordId };
  if (stdKey) upd[stdKey] = keepRows(rec[stdKey]).concat(stdRows);
  if (info.custom) upd[info.custom.key] = keepRows(rec[info.custom.key]).concat(custRows);
  var out = await ZOHO.CRM.API.updateRecord({ Entity: moduleName, APIData: upd, Trigger: CRM_TRIGGER });
  var row = out && out.data && out.data[0];
  if (!row || row.code !== 'SUCCESS') throw new Error('Update failed: ' + JSON.stringify(row && row.message));
  // Own the new rows + save the cart (CR-246); the record is already updated,
  // so a failure here is reported, not thrown.
  setStatus('Saving configuration…');
  try {
    ownedRowIds = await readOwnedRows(moduleName, recordId, [[stdKey, stdRows.length], [info.custom && info.custom.key, custRows.length]]);
    await saveConfig();
  } catch (e) { warnings.push('Configuration not saved — ' + errText(e)); }
}

$('add-btn').addEventListener('click', async function () {
  var btn = $('add-btn');
  btn.disabled = true;
  try {
    warnings = [];
    await pushLines();
    finish('Done.');
  } catch (err) {
    setStatus(errText(err) || 'Add to ' + moduleName.replace(/s$/, '').toLowerCase() + ' failed.', true);
    btn.disabled = false;
  }
});

/* ---------- Deal → Quote ---------- */
// Quotes line-item metadata: the standard subform key (v3 Quoted_Items vs
// classic Product_Details), its description column, and the Quotes custom
// subform ("Product Information" — where the Size/parameter columns live),
// mirroring discoverSubforms which is bound to the Deal here.
var quotesLineMeta = null;
function getQuotesLineMeta() {
  if (quotesLineMeta) return Promise.resolve(quotesLineMeta);
  var classic = { key: 'Product_Details', v3: false, descCol: 'product_description', columns: null, custom: null };
  return ZOHO.CRM.META.getFields({ Entity: 'Quotes' }).then(function (res) {
    var subs = ((res && res.fields) || []).filter(function (f) { return f.data_type === 'subform'; });
    var std = subs.find(function (f) { return f.api_name === 'Quoted_Items'; });
    var meta = std
      ? { key: 'Quoted_Items', v3: true, descCol: null, columns: null, custom: null }
      : classic;
    var cust = subs.find(function (f) { return normLabel(f.field_label) === 'productinformation'; })
      || subs.find(function (f) { return f.api_name !== 'Quoted_Items'; });

    var loadStd = !std ? Promise.resolve() :
      ZOHO.CRM.META.getFields({ Entity: (std.subform && std.subform.module) || 'Quoted_Items' })
        .then(function (r2) {
          meta.columns = (r2 && r2.fields) || [];
          var desc = meta.columns.find(function (f) {
            return normLabel(f.field_label) === 'description' && !f.read_only;
          });
          meta.descCol = desc ? desc.api_name : null;
        }, function () { /* std columns unreadable — description skipped */ });

    var loadCust = !cust ? Promise.resolve() :
      ZOHO.CRM.META.getFields({ Entity: (cust.subform && cust.subform.module) || cust.api_name })
        .then(function (r3) {
          var cols = (r3 && r3.fields) || [];
          var prodCol = cols.find(function (f) {
            var m = f.lookup && (f.lookup.module && f.lookup.module.api_name || f.lookup.module);
            return f.data_type === 'lookup' && m === 'Products';
          });
          meta.custom = { key: cust.api_name, columns: cols, productCol: prodCol ? prodCol.api_name : null };
        }, function () { /* custom columns unreadable — skipped */ });

    return Promise.all([loadStd, loadCust]).then(function () {
      quotesLineMeta = meta;
      return meta;
    });
  }, function () { quotesLineMeta = classic; return quotesLineMeta; });
}

// One "Caption: Value" line per stored parameter value — the same newline
// convention as the item description (SCHEMA.md) and what the estimate print
// parser splits on.
function lineDesc(l) {
  var vals = l.values || {};
  return Object.keys(vals).map(function (c) { return c + ': ' + vals[c]; }).join('\n');
}

// Map the item's parameter values onto matching subform columns by label
// (column "Size" ↔ property "Size") — same rule as the Deal's custom subform.
// Never overwrites a field the row already carries (qty, rate, description…).
// Column-matchable values of a line: property captions (normalized) plus the
// item type label under "Item Source"/"Item Type" so a plain subform column
// with that label is filled too.
function paramVals(line) {
  var vals = {};
  Object.keys(line.values || {}).forEach(function (cap) { vals[normLabel(cap)] = line.values[cap]; });
  if (line.type) vals.itemsource = vals.itemtype = typeLabel(line.type);
  // UOM (CR-206) → Products "Usage Unit" and any "UOM"/"Unit" line column.
  if (line.uom) vals.uom = vals.unit = vals.usageunit = line.uom;
  // Price ladder (CR-220): class + each step's value, for orgs that add
  // matching line columns ("Item Class", "Base Price", "OH", "Margin", "P & F",
  // "Other", "Disc"). Not in line.values, which would leak into the description.
  if (line.cls) {
    var lad = ladderOf(line);
    vals.itemclass = vals.class = line.cls === 'mfg' ? 'Mfg' : 'BO';
    vals.baseprice = vals.base = lad.base;
    vals.oh = vals.overhead = lad.oh;
    vals.margin = lad.margin;
    vals.pf = vals.pandf = vals.packingforwarding = lad.pf;
    vals.other = lad.other;
    vals.disc = lad.disc;
  }
  return vals;
}
// Picklist columns take the org's own casing: "kgs" → "Kgs" when the list has
// it; no match sends the raw value and CRM's rejection lands in `warnings`.
// ponytail: the Usage Unit picklist must carry the units (CRM admin, per org).
function pickValue(f, v) {
  var pv = (f.pick_list_values || []).filter(function (p) {
    return String(p.actual_value || p.display_value).toLowerCase() === String(v).toLowerCase();
  })[0];
  return pv ? (pv.actual_value || pv.display_value) : v;
}
function applyParamCols(columns, line, row) {
  if (!columns) return;
  var vals = paramVals(line);
  columns.forEach(function (f) {
    if (f.read_only || f.data_type === 'lookup' || f.data_type === 'subform' || f.api_name === 'id') return;
    if (row[f.api_name] !== undefined) return;
    // A column associated with a Product field (Quoted_Items.Size ↔ Products.Size)
    // is derived by CRM from the product — values sent for it are ignored, so it
    // is left out of the payload; the source value is written onto the Product
    // in findOrCreateProduct instead.
    if (f.association_details && f.association_details.related_field) return;
    var v = colVal(vals, f);
    if (v === undefined || v === null || v === '') return;
    var numeric = f.data_type === 'double' || f.data_type === 'integer' || f.data_type === 'currency';
    row[f.api_name] = numeric ? Number(v) || 0 : String(pickValue(f, v));
  });
}

// Creates a new Quote linked to this Deal straight from the cart lines — the
// Deal record itself is not touched (the Deal push button is hidden; its
// pushLines branch is kept but unreachable).
// ponytail: delete the Deals branch of pushLines/discoverSubforms if the Deal
// push never comes back.
$('quote-btn').addEventListener('click', async function () {
  var btn = $('quote-btn');
  btn.disabled = true;
  $('add-btn').disabled = true;
  try {
    warnings = [];
    setStatus('Reading deal…');
    var res = await ZOHO.CRM.API.getRecord({ Entity: 'Deals', RecordID: recordId });
    var deal = res && res.data && res.data[0];
    if (!deal) throw new Error('Could not read the deal.');

    var meta = await getQuotesLineMeta();
    var rows = [], custRows = [];
    for (var i = 0; i < lines.length; i++) {
      setStatus('Item ' + (i + 1) + ' of ' + lines.length + ': ' + lines[i].sku + '…');
      var pid = await findOrCreateProduct(lines[i]);
      // CRM's subform Discount is an amount, not a percent.
      var unit = unitPrice(lines[i]);
      var discAmt = lines[i].qty * unit * lines[i].disc / 100;
      var qrow = meta.v3
        ? { Product_Name: { id: pid }, Quantity: lines[i].qty, List_Price: unit, Discount: discAmt }
        : { product: { id: pid }, quantity: lines[i].qty, list_price: unit, Discount: discAmt };
      var d = lineDesc(lines[i]);
      if (d && meta.descCol) qrow[meta.descCol] = d;
      applyParamCols(meta.columns, lines[i], qrow);
      rows.push(qrow);
      // The Quote's custom subform (Product Information) carries the Size and
      // other parameter columns — same mapping as the Quotes-mode push.
      if (meta.custom) custRows.push(customRow(meta.custom, lines[i], pid));
    }

    setStatus('Creating quote…');
    // Quote_Stage is always Draft — CRM would otherwise apply the layout default.
    var data = { Subject: deal.Deal_Name || 'Quote', Deal_Name: { id: recordId }, Quote_Stage: 'Draft' };
    if (deal.Account_Name && deal.Account_Name.id) data.Account_Name = { id: deal.Account_Name.id };
    if (deal.Contact_Name && deal.Contact_Name.id) data.Contact_Name = { id: deal.Contact_Name.id };
    data[meta.key] = rows;
    if (meta.custom) data[meta.custom.key] = custRows;
    var out = await ZOHO.CRM.API.insertRecord({ Entity: 'Quotes', APIData: data, Trigger: CRM_TRIGGER });
    var row = out && out.data && out.data[0];
    if (!row || row.code !== 'SUCCESS') throw new Error('Quote create failed: ' + JSON.stringify(row && row.message));
    // Save the cart on the Deal and again under the new Quote (owning its
    // rows), so the Configurator opened from that Quote shows and replaces them.
    setStatus('Saving configuration…');
    try {
      var newId = String(row.details.id);
      var ids = await readOwnedRows('Quotes', newId, [[meta.key, rows.length], [meta.custom && meta.custom.key, custRows.length]]);
      await saveConfig();
      await saveConfig('quotes:' + newId, ids);
    } catch (e) { warnings.push('Configuration not saved — ' + errText(e)); }
    finish('Quote created.');
  } catch (err) {
    setStatus(errText(err), true);
    btn.disabled = !lines.length;
    $('add-btn').disabled = !lines.length;
  }
});
</script>
</body>
</html>
