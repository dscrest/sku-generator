<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Product Configurator</title>
  <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13.5px; color: #0f172a; background: #e9ecf1; -webkit-font-smoothing: antialiased; }
    .center { display: grid; place-items: center; min-height: 100vh; text-align: center; padding: 24px; }
    .center > div { background: #fff; border-radius: 14px; padding: 32px 40px; box-shadow: 0 1px 2px rgba(15,23,42,.06), 0 12px 40px rgba(15,23,42,.10); }
    .muted { color: #64748b; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
    button { font: inherit; cursor: pointer; border-radius: 7px; border: 1px solid #d9dfe8; background: #fff; padding: 6px 12px; color: #0f172a; }
    button.primary { background: #0f172a; border-color: #0f172a; color: #fff; }
    button.primary:hover:not(:disabled) { background: #1e293b; }
    button:disabled { opacity: .5; cursor: default; }
    input, select { font: inherit; padding: 6px 8px; border: 1px solid #d9dfe8; border-radius: 7px; color: #0f172a; background: #fff; }
    input:focus { outline: none; border-color: #0f766e; }
    .error { color: #c0392b; }
    .hidden { display: none !important; }

    #v-picker { min-height: 100vh; }
    #card { height: 100vh; background: #fff; overflow: hidden; display: flex; flex-direction: column; }

    #panes { display: flex; flex: 1; min-height: 0; }
    #left { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid #e5e7eb; }
    #right { flex: 0 1 320px; min-width: 260px; background: #f8fafc; display: flex; flex-direction: column; min-height: 0; }
    #head { flex: none; display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid #e5e7eb; }
    #head .ttl { font-size: 15px; font-weight: 600; letter-spacing: -.01em; flex: 1; }
    #form { flex: 1; overflow: auto; padding: 4px 20px 16px; }
    .sec { font: 600 11px 'IBM Plex Sans', sans-serif; letter-spacing: .06em; text-transform: uppercase; color: #64748b; margin: 16px 0 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px 12px; }
    .fld { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; color: #64748b; font-weight: 500; min-width: 0; }
    .fld .req { color: #dc2626; }
    .fld select, .fld input { width: 100%; font-size: 13px; }
    .fld.set select, .fld.set input { border-color: #99d5cf; background: #f0fdfa; }
    #find-row { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
    #find-msg { font-size: 12.5px; }
    #sizing { margin-top: 12px; border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; }
    #sizing .cap { display: flex; align-items: baseline; gap: 10px; padding: 10px 14px; background: #f8fafc; border-bottom: 1px solid #e5e7eb; font-size: 12.5px; color: #64748b; }
    #sizing .cap b { font-size: 16px; color: #0f172a; font-variant-numeric: tabular-nums; }
    .opt { display: grid; grid-template-columns: 18px 190px minmax(90px, 1fr) 100px 120px 96px; white-space: nowrap; gap: 10px; align-items: center; padding: 8px 14px; border-bottom: 1px solid #eef1f5; cursor: pointer; font-size: 13px; font-variant-numeric: tabular-nums; }
    .opt:last-child { border-bottom: 0; }
    .opt:hover { background: #f8fafc; }
    .opt.on { background: #f0fdfa; }
    .opt .dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid #94a3b8; }
    .opt.on .dot { border: 4.5px solid #0f766e; }
    .opt .m { font-weight: 600; }
    .opt .s, .opt .r { color: #64748b; font-size: 12.5px; }
    .opt .sp { color: #0f766e; font-size: 12px; text-align: right; }
    .opt.up { font-size: 12.5px; color: #64748b; }
    .opt.up .m { font-weight: 500; }
    .opt.up .dot { visibility: hidden; }
    .opt.up.on .dot { visibility: visible; }
    .big { padding: 8px 14px; font-size: 12.5px; color: #b45309; background: #fffbeb; border-bottom: 1px solid #eef1f5; }
    #result { flex: none; border-top: 1px solid #e5e7eb; background: #fff; padding: 12px 20px; display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
    #res-main { flex: 1; min-width: 220px; }
    #res-sku { font: 500 14px 'IBM Plex Mono', monospace; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    #res-name { font-size: 12.5px; color: #64748b; margin-top: 2px; }
    #res-msg { font-size: 12.5px; margin-top: 2px; }
    .badge.exists { color: #15803d; background: #dcfce7; }
    .badge.fresh { color: #b45309; background: #fef3c7; }
    #result label { display: flex; flex-direction: column; gap: 3px; font-size: 10.5px; color: #64748b; font-weight: 500; }
    #result label input { width: 84px; text-align: right; }
    #result label input[type=checkbox] { width: 18px; height: 18px; margin: 7px 0; }
    #res-add { padding: 8px 16px; font-weight: 600; }

    /* quote lines */
    #lines-head { padding: 14px 16px 8px; display: flex; align-items: baseline; justify-content: space-between; font-size: 14.5px; font-weight: 600; }
    #lines-clear { border: 0; background: none; color: #64748b; font-size: 12px; padding: 0; font-weight: 400; }
    #lines-clear:hover { color: #0f172a; }
    #lines { flex: 1; overflow: auto; padding: 0 12px; display: flex; flex-direction: column; gap: 8px; }
    .l-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px 10px 10px 4px; display: grid; grid-template-columns: 18px minmax(0,1fr); gap: 4px; }
    .l-move { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
    .l-move button { border: 0; background: none; color: #94a3b8; font-size: 9px; line-height: 1; padding: 2px; }
    .l-move button:hover:not(:disabled) { color: #0f172a; }
    .l-move button:disabled { opacity: .3; }
    .l-top { display: flex; align-items: flex-start; gap: 8px; }
    .l-name { flex: 1; min-width: 0; font-size: 13px; font-weight: 500; line-height: 1.3; }
    .l-sku { font: 12px 'IBM Plex Mono', monospace; color: #64748b; margin-top: 2px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .badge { font: 500 9.5px 'IBM Plex Sans', sans-serif; letter-spacing: .04em; border-radius: 4px; padding: 1px 5px; }
    .badge.books { color: #b45309; background: #fef3c7; }
    .badge.pending { color: #b91c1c; background: #fee2e2; }
    .badge.type { color: #475569; background: #e2e8f0; }
    .l-x { border: 0; background: none; color: #94a3b8; font-size: 15px; line-height: 1; padding: 0 2px; }
    .l-x:hover { color: #dc2626; }
    .l-grid { display: grid; grid-template-columns: 56px 1fr 56px minmax(0,1fr); gap: 6px; align-items: end; margin-top: 8px; }
    .l-grid label { display: flex; flex-direction: column; gap: 3px; font-size: 10.5px; color: #64748b; font-weight: 500; }
    .l-grid input { width: 100%; padding: 5px 7px; text-align: right; border-radius: 6px; font-size: 13px; }
    .l-total { text-align: right; font-size: 13.5px; font-weight: 600; padding-bottom: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .l-empty { margin: 8px 4px; padding: 26px 14px; border: 1.5px dashed #d9dfe8; border-radius: 10px; text-align: center; color: #64748b; line-height: 1.5; }
    #lines-foot { flex: none; padding: 12px 16px; border-bottom: 1px solid #e5e7eb; background: #fff; display: flex; flex-direction: column; gap: 10px; }
    #subtotal-row { display: flex; justify-content: space-between; font-size: 12.5px; color: #64748b; }
    #subtotal { color: #0f172a; font-weight: 600; font-size: 14.5px; font-variant-numeric: tabular-nums; }
    #add-btn { padding: 11px 14px; font-size: 13.5px; font-weight: 600; border-radius: 9px; }
    #quote-btn { padding: 10px 14px; font-size: 13px; font-weight: 600; border-radius: 9px; }
    #status { font-size: 12px; color: #0f766e; }
  </style>
</head>
<body>

  <div id="v-loading" class="center"><p class="muted">Loading…</p></div>

  <div id="v-message" class="center hidden"><div>
    <p id="message-text"></p>
    <button id="signin-btn" class="primary hidden">Sign in</button>
  </div></div>

  <div id="v-org" class="center hidden"><div>
    <p>Choose the organization to work in:</p>
    <select id="org-select"></select>
    <button id="org-btn" class="primary">Continue</button>
  </div></div>

  <div id="v-picker" class="hidden"><div id="card">
    <div id="panes">
      <div id="left">
        <div id="head">
          <span class="ttl">Product Configurator</span>
          <label class="muted" for="product">Product</label>
          <select id="product"></select>
        </div>
        <div id="form"><p class="muted">Loading questions…</p></div>
        <div id="result">
          <div id="res-main">
            <div id="res-sku"><span class="muted">Answer the questions to generate the SKU.</span></div>
            <div id="res-name"></div>
            <div id="res-msg"></div>
          </div>
          <label id="res-push-lab" class="hidden" title="Push the new item to Zoho Books now. Off = saved to the SKU master only; push it later from the SKU Items page.">Push to Books<input id="res-push" type="checkbox" checked /></label>
          <label>Qty<input id="res-qty" type="number" min="1" value="1" /></label>
          <label>Rate<input id="res-rate" type="number" min="0" /></label>
          <button id="res-add" class="primary" disabled>Add to lines</button>
        </div>
      </div>
      <div id="right">
        <div id="lines-head"><span>Quote lines <span id="line-count" class="muted">0</span></span><button id="lines-clear" class="hidden">Clear</button></div>
        <div id="lines-foot">
          <div id="subtotal-row"><span id="subtotal-units">Subtotal</span><span id="subtotal">0.00</span></div>
          <button id="add-btn" class="primary" disabled>Add item to Quote</button>
          <button id="quote-btn" class="primary hidden" disabled>Create Quote</button>
          <span id="status"></span>
        </div>
        <div id="lines"><div class="l-empty">No lines yet.<br>Configure a product and add it.</div></div>
      </div>
    </div>
  </div></div>

<script>
// Product Configurator CRM widget (CR-181) — guided questions → sizing → SKU →
// existing-or-new item → Quote lines.
// ponytail: boot/auth, cart and quote write-back are copied verbatim from
// widget.html so MSUN's live Quote Maker stays isolated from this page;
// extract a shared script when a third widget needs them.
'use strict';
// Served from the same Catalyst origin as the API — nothing env-specific here.
var API = '/server/skuapi';
var APP_ORIGIN = location.origin;
// Every CRM write must carry this — an empty Trigger list suppresses workflows/blueprint/approval.
var CRM_TRIGGER = ['workflow', 'blueprint', 'approval'];

var recordId = null;
var moduleName = 'Quotes';
var lines = []; // [{ id, sku, name, type, values, qty, rate, disc, rateTouched, badge }] — array so ▲▼ reorder works
// Org display labels for the stored item types (SKU Settings, CR-180); the
// label is also the CRM Products.Item_Source picklist value.
var typeLabels = {};
function typeLabel(t) { return typeLabels[t] || t; }
var authDone = false;

function findLine(id) { return lines.find(function (l) { return l.id === id; }); }

// Cookie-free auth: the sign-in popup hands over a session token via
// postMessage (third-party cookies never reach this iframe). Held in memory —
// localStorage is only best-effort persistence, since browsers partition or
// block storage inside third-party iframes.
var sessionToken = null;
try { sessionToken = localStorage.getItem('sku_token'); } catch (e) { /* storage blocked */ }

function api(path, opts) {
  opts = opts || {};
  opts.headers = {};
  if (opts.body) opts.headers['Content-Type'] = 'application/json';
  // Token rides the ?t= query param, NOT an Authorization header: Catalyst's
  // gateway hijacks Authorization and rejects anything that isn't a Zoho OAuth
  // token (INVALID_TOKEN 401) before the function ever sees the request.
  if (sessionToken) path += (path.indexOf('?') > -1 ? '&' : '?') + 't=' + encodeURIComponent(sessionToken);
  return fetch(API + path, opts);
}

function show(id) {
  ['v-loading', 'v-message', 'v-org', 'v-picker'].forEach(function (v) {
    document.getElementById(v).classList.toggle('hidden', v !== id);
  });
}
function message(text, withSignin) {
  document.getElementById('message-text').textContent = text;
  document.getElementById('signin-btn').classList.toggle('hidden', !withSignin);
  show('v-message');
}
var $ = function (id) { return document.getElementById(id); };

/* ---------- boot ---------- */
ZOHO.embeddedApp.on('PageLoad', function (data) {
  if (data.Entity !== 'Quotes' && data.Entity !== 'Deals') {
    return message('This widget works on Quotes and Deals only (got: ' + (data.Entity || 'unknown') + ').');
  }
  moduleName = data.Entity;
  // EntityId arrives as a string, an array, or a JSON-stringified array
  // depending on how the widget is launched — normalize all three.
  var eid = data.EntityId;
  if (typeof eid === 'string' && eid.charAt(0) === '[') {
    try { eid = JSON.parse(eid); } catch (e) { /* keep as-is */ }
  }
  recordId = Array.isArray(eid) ? eid[0] : eid;
  if (!recordId) {
    // CreateOrCloneView = unsaved record → no record id to write lines into.
    return message(data.ButtonPosition === 'CreateOrCloneView'
      ? 'This record is not saved yet. Save it first, then open it and use the Configurator button from its detail page.'
      : 'Could not read the record id from CRM. PageLoad data: ' + JSON.stringify(data));
  }
  probe();
});
ZOHO.embeddedApp.init();

/* ---------- auth ---------- */
function probe() {
  api('/auth/me').then(function (r) {
    if (r.status === 401) {
      var hadToken = Boolean(sessionToken);
      sessionToken = null;
      try { localStorage.removeItem('sku_token'); } catch (e) { /* storage blocked */ }
      // Distinct messages per failure leg so a report pinpoints where it broke.
      if (authDone) {
        return message(hadToken
          ? 'Sign-in worked but the server rejected the session token. Please try again.'
          : 'Sign-in finished without a session token. Please try again.', true);
      }
      return silentAuth();
    }
    if (!r.ok) return r.json().then(function (d) { message(d.error || ('Error ' + r.status)); });
    return r.json().then(function (me) {
      if (!me.orgId) return orgStep();
      var missing = ['sku-generator', 'recipe-engine'].filter(function (a) { return !(me.addons || []).includes(a); });
      if (missing.length) {
        return message('The Product Configurator needs the ' + missing.join(' + ') + ' add-on enabled for ' + (me.orgName || 'this organization') + '.');
      }
      startConfigurator();
    });
  }).catch(function () { message('Cannot reach the Product Configurator API.'); });
}

// Token handoff handshake with the OAuth popup/iframe (an /app/ page on our
// origin): it announces 'sku-auth-ready', we reply hello, it sends the token.
window.addEventListener('message', function (e) {
  if (e.origin !== APP_ORIGIN || !e.data) return;
  if (e.data.type === 'sku-auth-ready') {
    e.source.postMessage({ type: 'sku-auth-hello' }, APP_ORIGIN);
  } else if (e.data.type === 'sku-auth-token') {
    var f = $('silent-frame');
    if (f) f.remove();
    if (!e.data.token) {
      // The popup finished but could not mint a session — show its reason.
      return message('Sign-in failed: ' + (e.data.error || 'no session token issued') + '.', true);
    }
    sessionToken = e.data.token;
    try { localStorage.setItem('sku_token', e.data.token); } catch (err) { /* storage blocked */ }
    authDone = true;
    show('v-loading');
    probe();
  }
});

function silentAuth() {
  // Warm Zoho session + prior consent → the OAuth chain completes invisibly in
  // the iframe and posts 'sku-auth-done'. Any rendered Zoho page (login,
  // consent) is frame-blocked, so the timeout falls back to the popup button.
  var f = document.createElement('iframe');
  f.id = 'silent-frame';
  f.name = 'sku-auth';
  f.src = API + '/auth/zoho';
  f.style.display = 'none';
  document.body.appendChild(f);
  setTimeout(function () {
    if (authDone) return;
    f.remove();
    message('Sign in to the Product Configurator to continue.', true);
  }, 6000);
}

$('signin-btn').addEventListener('click', function () {
  var w = window.open(API + '/auth/zoho', 'sku-auth', 'width=620,height=720');
  if (!w) return message('Popup blocked — allow popups for this page, then try again.', true);
  message('Waiting for sign-in to finish…');
});

/* ---------- org selection ---------- */
function orgStep() {
  api('/auth/zoho/orgs').then(function (r) { return r.json(); }).then(function (orgs) {
    if (!Array.isArray(orgs) || !orgs.length) return message('No Zoho Books organization found for this account.');
    if (orgs.length === 1) return selectOrg(orgs[0]);
    var sel = $('org-select');
    sel.innerHTML = '';
    orgs.forEach(function (o, i) {
      var opt = document.createElement('option');
      opt.value = i;
      opt.textContent = o.name;
      sel.appendChild(opt);
    });
    $('org-btn').onclick = function () { selectOrg(orgs[Number(sel.value)]); };
    show('v-org');
  }).catch(function () { message('Failed to load organizations.'); });
}
function selectOrg(o) {
  show('v-loading');
  api('/auth/zoho/select-org', {
    method: 'POST',
    body: JSON.stringify({ orgId: o.organization_id, orgName: o.name }),
  }).then(function () { probe(); });
}

/* ---------- configurator (CR-181) ---------- */
// Everything here is org data: the Product is an Industry, the questions are
// its Properties, and the sizing block appears only when the industry has
// properties carrying a sizingRole (capacity / density / speed / group feed
// the calculation; series / model receive the picked answer).
var DUTY_ROLES = ['capacity', 'density', 'speed', 'group'];
var industryId = '';
var props = [];          // questions of the chosen product, in skuPosition order
var valuesByProp = {};   // propertyId -> [{ id, displayValue, isDefault }]
var sel = {};            // propertyId -> valueId (List) | number text (Range)
var sizing = null;       // last /sizing/select response
var picked = null;       // chosen option: { modelCode, series, capacity, requiredRpm, valueId }
var gen = null;          // last /api/sku/generate response
var existing = null;     // catalog item already carrying gen.sku
var genKey = null;       // guards against stale generate responses
var lineSeq = 0;

function roleProp(role) { return props.find(function (p) { return p.sizingRole === role; }); }
function displayOf(p) {
  var v = sel[p.id];
  if (v === undefined || v === null || v === '') return '';
  if (p.valueType === 'Range') return String(v) + (p.unit ? ' ' + p.unit : '');
  var hit = (valuesByProp[p.id] || []).find(function (x) { return String(x.id) === String(v); });
  return hit ? hit.displayValue : '';
}

function startConfigurator() {
  show('v-picker');
  // On Deals the only action is a new Quote linked to the Deal.
  if (moduleName === 'Deals') {
    $('quote-btn').classList.remove('hidden');
    $('add-btn').classList.add('hidden');
  }
  try {
    if (window.ZOHO && ZOHO.CRM.UI && typeof ZOHO.CRM.UI.Resize === 'function') {
      ZOHO.CRM.UI.Resize({ height: '780', width: '1320' }).catch(function () { /* CRM caps it */ });
    }
  } catch (e) { /* older SDK */ }
  discoverSubforms(); // warm the metadata cache; failures surface at add time
  api('/api/sku-items/settings').then(function (r) { return r.ok ? r.json() : {}; })
    .then(function (s) {
      typeLabels = s.typeLabels || {};
      // Org default for the per-line "Push to Books" switch (SKU Settings, CR-184).
      $('res-push').checked = s.widgetAutoPush !== false;
      renderCart();
    })
    .catch(function () { /* raw type names */ });
  api('/api/industries').then(function (r) { return r.json(); }).then(function (inds) {
    inds = Array.isArray(inds) ? inds : [];
    if (!inds.length) { $('form').innerHTML = '<p class="muted">No product is set up yet — add one under Product Configurator in the app.</p>'; return; }
    inds.forEach(function (ind) {
      var opt = document.createElement('option');
      opt.value = ind.id;
      opt.textContent = ind.name;
      $('product').appendChild(opt);
    });
    loadProduct();
  }).catch(function () { $('form').innerHTML = '<p class="error">Failed to load products.</p>'; });
}
$('product').addEventListener('change', loadProduct);

function loadProduct() {
  industryId = String($('product').value);
  props = []; sel = {}; sizing = null; picked = null; gen = null; existing = null; genKey = null;
  $('form').innerHTML = '<p class="muted">Loading questions…</p>';
  renderResult();
  // Two calls total (properties + batched values) — never one per property,
  // the Dev concurrency cap can't take it.
  Promise.all([
    api('/api/industries/' + industryId + '/properties').then(function (r) { return r.ok ? r.json() : []; }),
    api('/api/industries/' + industryId + '/property-values').then(function (r) { return r.ok ? r.json() : {}; }),
  ]).then(function (res) {
    props = (Array.isArray(res[0]) ? res[0] : []).filter(function (p) { return p.showInWidget || p.sizingRole; });
    valuesByProp = res[1] || {};
    props.forEach(function (p) {
      var dflt = (valuesByProp[p.id] || []).find(function (v) { return v.isDefault; });
      if (dflt) sel[p.id] = String(dflt.id);
      if (p.sizingRole === 'speed') sel[p.id] = '20'; // sheet default, editable
    });
    renderForm();
    refreshResult();
  }).catch(function () { $('form').innerHTML = '<p class="error">Failed to load questions.</p>'; });
}

function field(p) {
  var wrap = document.createElement('label');
  wrap.className = 'fld' + (sel[p.id] ? ' set' : '');
  var cap = document.createElement('span');
  cap.textContent = p.caption + (p.unit ? ' (' + p.unit + ')' : '');
  if (p.required) { var rq = document.createElement('span'); rq.className = 'req'; rq.textContent = ' *'; cap.appendChild(rq); }
  wrap.appendChild(cap);
  var inp;
  if (p.valueType === 'Range') {
    inp = document.createElement('input');
    inp.type = 'number';
    inp.min = 0;
    inp.step = 'any';
  } else {
    inp = document.createElement('select');
    var none = document.createElement('option');
    none.value = '';
    none.textContent = '—';
    inp.appendChild(none);
    (valuesByProp[p.id] || []).forEach(function (v) {
      var o = document.createElement('option');
      o.value = v.id;
      o.textContent = v.displayValue;
      inp.appendChild(o);
    });
  }
  inp.value = sel[p.id] || '';
  // 'change' (commit), not 'input' — one SKU preview per answer, no timers.
  inp.addEventListener('change', function () {
    sel[p.id] = inp.value;
    wrap.classList.toggle('set', Boolean(inp.value));
    if (DUTY_ROLES.indexOf(p.sizingRole) > -1) { sizing = null; picked = null; renderSizing(); }
    // A hand-changed model no longer matches the picked option's speed figures.
    if ((p.sizingRole === 'model' || p.sizingRole === 'series') && picked) { picked = null; renderSizing(); }
    refreshResult();
  });
  wrap.appendChild(inp);
  return wrap;
}

function section(title, list) {
  if (!list.length) return null;
  var box = document.createElement('div');
  var h = document.createElement('div');
  h.className = 'sec';
  h.textContent = title;
  var g = document.createElement('div');
  g.className = 'grid';
  list.forEach(function (p) { g.appendChild(field(p)); });
  box.appendChild(h);
  box.appendChild(g);
  return box;
}

function renderForm() {
  var form = $('form');
  form.innerHTML = '';
  var model = roleProp('model');
  var sized = Boolean(model && roleProp('capacity') && roleProp('density'));
  if (!sized) {
    // Generic path: a product without sizing roles is a plain question list.
    var all = section('Configuration', props);
    if (all) form.appendChild(all); else form.innerHTML = '<p class="muted">This product has no questions yet.</p>';
    return;
  }
  var isPick = function (p) { return p.sizingRole === 'model' || p.sizingRole === 'series'; };
  var feed = props.filter(function (p) { return !isPick(p) && (DUTY_ROLES.indexOf(p.sizingRole) > -1 || p.skuPosition < model.skuPosition); });
  var rest = props.filter(function (p) { return !isPick(p) && feed.indexOf(p) === -1; });
  var feedBox = section('Feed data', feed);
  var findRow = document.createElement('div');
  findRow.id = 'find-row';
  findRow.innerHTML = '<button id="find-btn" class="primary" type="button">Find suitable models</button><span id="find-msg" class="error"></span>';
  feedBox.appendChild(findRow);
  var sz = document.createElement('div');
  sz.id = 'sizing';
  sz.className = 'hidden';
  feedBox.appendChild(sz);
  form.appendChild(feedBox);
  form.appendChild(section('Selected model', props.filter(isPick)));
  var restBox = section('Configuration', rest);
  if (restBox) form.appendChild(restBox);
  $('find-btn').addEventListener('click', findModels);
  renderSizing();
}

function findModels() {
  var num = function (role) { var p = roleProp(role); return p ? Number(sel[p.id]) : 0; };
  var group = roleProp('group');
  var body = {
    industryId: industryId, tph: num('capacity'), bd: num('density'), rpm: num('speed') || 20,
    group: group ? displayOf(group) : '',
  };
  $('find-msg').textContent = '';
  if (!(body.tph > 0) || !(body.bd > 0)) { $('find-msg').textContent = 'Enter ' + roleProp('capacity').caption + ' and ' + roleProp('density').caption + ' first.'; return; }
  if (group && !body.group) { $('find-msg').textContent = 'Choose ' + group.caption + ' first.'; return; }
  var btn = $('find-btn');
  btn.disabled = true;
  api('/api/recipe/sizing/select', { method: 'POST', body: JSON.stringify(body) })
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (res) {
      btn.disabled = false;
      if (!res.ok) { $('find-msg').textContent = res.d.error || res.d.message || 'Sizing failed.'; return; }
      sizing = res.d;
      sizing.input = body;
      picked = null;
      renderSizing();
    })
    .catch(function () { btn.disabled = false; $('find-msg').textContent = 'Sizing failed — network error.'; });
}

function optRow(o, series, isUp) {
  var row = document.createElement('div');
  var on = picked && picked.modelCode === o.modelCode && picked.series === series;
  row.className = 'opt' + (isUp ? ' up' : '') + (on ? ' on' : '');
  var cells = [
    ['dot', ''], ['m', (isUp ? 'one size up: ' : '') + o.modelCode], ['s', series],
    ['c', o.capacity.toFixed(2) + ' ltr/rev'], ['r', 'runs at ' + o.requiredRpm + ' RPM'], ['sp', '+' + o.sparePct + '% spare'],
  ];
  cells.forEach(function (c) {
    var s = document.createElement('span');
    s.className = c[0];
    s.textContent = c[1];
    row.appendChild(s);
  });
  row.addEventListener('click', function () { pick(o, series); });
  return row;
}

function renderSizing() {
  var box = $('sizing');
  if (!box) return;
  box.innerHTML = '';
  box.classList.toggle('hidden', !sizing);
  if (!sizing) return;
  var cap = document.createElement('div');
  cap.className = 'cap';
  var i = sizing.input;
  cap.innerHTML = 'Req. Cap <b></b><span></span>';
  cap.querySelector('b').textContent = sizing.reqCap.toFixed(2) + ' ltr/rev';
  cap.querySelector('span').textContent = i.tph + ' TPH · ' + i.bd + ' kg/ltr · ' + i.rpm + ' RPM' + (i.group ? ' · ' + i.group : '');
  box.appendChild(cap);
  // Options arrive capacity-sorted; show them grouped by series, with the
  // series' single "one size up" row after its last fitting model.
  var seriesSeen = [];
  sizing.options.forEach(function (o) { if (seriesSeen.indexOf(o.series) === -1) seriesSeen.push(o.series); });
  seriesSeen.forEach(function (series) {
    var mine = sizing.options.filter(function (o) { return o.series === series; });
    mine.forEach(function (o) { box.appendChild(optRow(o, series, false)); });
    if (mine[0].next) box.appendChild(optRow(mine[0].next, series, true));
  });
  sizing.tooBig.forEach(function (t) {
    var d = document.createElement('div');
    d.className = 'big';
    d.textContent = 'Above the largest ' + t.series + ' model (' + t.largest.modelCode + ' · ' + t.largest.capacity.toFixed(2) + ' ltr/rev).';
    box.appendChild(d);
  });
  if (!sizing.options.length && !sizing.tooBig.length) {
    var e = document.createElement('div');
    e.className = 'big';
    e.textContent = 'No sizing models are set up for ' + (i.group || 'this product') + '.';
    box.appendChild(e);
  }
}

function pick(o, series) {
  var model = roleProp('model'), ser = roleProp('series');
  var seriesValueId = (sizing.options.find(function (x) { return x.series === series; }) || {}).seriesValueId;
  if (!o.valueId) { $('find-msg').textContent = o.modelCode + ' is missing from the "' + model.caption + '" question values — add it in the app.'; return; }
  $('find-msg').textContent = '';
  picked = { modelCode: o.modelCode, series: series, capacity: o.capacity, requiredRpm: o.requiredRpm };
  sel[model.id] = String(o.valueId);
  if (ser && seriesValueId) sel[ser.id] = String(seriesValueId);
  var top = $('form').scrollTop;
  renderForm(); // re-render so the Selected model dropdowns show the pick
  $('form').scrollTop = top;
  refreshResult();
}

/* ---------- SKU + existing-or-new ---------- */
// Only SKU-active answers go to the generator; duty data rides the quote line.
function skuValues() {
  var sv = {};
  props.forEach(function (p) {
    if (p.activeInSku === false) return;
    if (sel[p.id] !== undefined && sel[p.id] !== '') sv[p.id] = sel[p.id];
  });
  return sv;
}
// "Caption: Value" for every answer, plus the sizing figures of the picked model.
function lineValues() {
  var v = {};
  props.forEach(function (p) { var d = displayOf(p); if (d) v[p.caption] = d; });
  if (picked && sizing) {
    v['Req. Cap'] = sizing.reqCap.toFixed(2) + ' ltr/rev';
    v['Required Speed'] = picked.requiredRpm + ' RPM';
  }
  return v;
}

function renderResult(msg, isError) {
  var sku = $('res-sku');
  sku.innerHTML = '';
  $('res-name').textContent = '';
  $('res-msg').textContent = msg || '';
  $('res-msg').className = isError ? 'error' : 'muted';
  var ready = Boolean(gen && gen.sku && !(gen.missingRequired || []).length);
  $('res-add').disabled = !ready;
  if (!gen || !gen.sku) {
    var hint = document.createElement('span');
    hint.className = 'muted';
    hint.textContent = 'Answer the questions to generate the SKU.';
    sku.appendChild(hint);
    return;
  }
  sku.appendChild(document.createTextNode(gen.sku));
  if (ready) {
    var b = document.createElement('span');
    b.className = 'badge ' + (existing ? 'exists' : 'fresh');
    b.id = 'res-badge';
    sku.appendChild(b);
  }
  $('res-push-lab').classList.toggle('hidden', !ready || Boolean(existing && existing.zohoItemId));
  syncBadge();
  $('res-name').textContent = (existing && existing.name) || gen.name || '';
}

function syncBadge() {
  var b = $('res-badge');
  if (!b) return;
  var push = $('res-push').checked;
  b.textContent = existing ? (existing.zohoItemId ? 'EXISTING ITEM · IN BOOKS' : (push ? 'EXISTING ITEM — WILL BE PUSHED' : 'EXISTING ITEM · NOT IN BOOKS'))
    : (push ? 'NEW ITEM — WILL BE CREATED & PUSHED' : 'NEW ITEM — WILL BE CREATED, NOT PUSHED');
}
$('res-push').addEventListener('change', syncBadge);

function refreshResult() {
  var sv = skuValues();
  var key = industryId + '|' + JSON.stringify(sv);
  if (key === genKey) return;
  genKey = key;
  gen = null; existing = null;
  if (!Object.keys(sv).length) return renderResult();
  renderResult('Generating SKU…');
  api('/api/sku/generate', { method: 'POST', body: JSON.stringify({ industryId: industryId, selectedValues: sv }) })
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (res) {
      if (key !== genKey) return; // stale response
      if (!res.ok) return renderResult(res.d.error || 'SKU preview failed.', true);
      gen = res.d;
      if ((gen.missingRequired || []).length) return renderResult('Still needed: ' + gen.missingRequired.join(', ') + '.');
      if (!gen.duplicate) return renderResult();
      // SKU already in the catalog → show that item instead of creating a twin.
      return api('/api/sku-items/search', { method: 'POST', body: JSON.stringify({ sku: gen.sku }) })
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (items) {
          if (key !== genKey) return;
          existing = (Array.isArray(items) ? items : []).find(function (it) { return it.sku === gen.sku; }) || null;
          renderResult(existing ? '' : 'SKU exists but the item could not be loaded.', !existing);
          if (!existing) $('res-add').disabled = true;
        });
    })
    .catch(function () { if (key === genKey) renderResult('SKU preview failed — network error.', true); });
}

async function pushToBooks(id) {
  var pr = await api('/api/sku-items/' + id + '/push-zoho', { method: 'POST', body: '{}' });
  if (pr.ok) return;
  var pd = await pr.json().catch(function () { return {}; });
  throw new Error(pd.error || ('HTTP ' + pr.status));
}

$('res-add').addEventListener('click', async function () {
  var btn = $('res-add');
  btn.disabled = true;
  try {
    var item = existing, badge = null, note = '';
    if (!item) {
      var r = await api('/api/sku/create-item', { method: 'POST', body: JSON.stringify({
        name: gen.name || gen.sku, sku: gen.sku, description: gen.description || '', type: 'Manufacturing',
        industryId: industryId, selectedValues: skuValues(),
      }) });
      item = await r.json();
      if (!r.ok) throw new Error(item.error || 'Create failed.');
      badge = 'books';
    }
    // New items, and existing ones never pushed, go to Books now when the Push
    // box is on. A failure never blocks the quote — the item is in the SKU
    // master and can be pushed later from the SKU Items page.
    if (!item.zohoItemId && !$('res-push').checked) {
      badge = 'pending';
      note = 'Saved to the SKU master, not pushed — push it later from the SKU Items page.';
    } else if (!item.zohoItemId) {
      try { await pushToBooks(item.id); if (!badge) badge = 'books'; } catch (pe) {
        badge = 'pending';
        note = 'Books push failed: ' + (pe.message || pe) + '. Push it later from the SKU Items page.';
      }
    }
    addToCart({ id: 'c' + (++lineSeq), sku: item.sku, name: item.name, type: item.type || 'Manufacturing', values: lineValues() },
      { badge: badge, rate: Number($('res-rate').value) || 0, qty: Math.max(1, Number($('res-qty').value) || 1) });
    setStatus(note, Boolean(note));
    $('res-qty').value = 1;
    genKey = null; // same answers now resolve to the existing item
    refreshResult();
  } catch (err) {
    renderResult(err.message || String(err), true);
    btn.disabled = false;
  }
});

/* ---------- cart (quote lines) ---------- */
function addToCart(it, opts) {
  opts = opts || {};
  var line = {
    id: it.id, sku: it.sku, name: it.name, type: it.type || '', values: it.values || {},
    qty: opts.qty || 1, rate: opts.rate || 0, disc: 0,
    rateTouched: Boolean(opts.rate), badge: opts.badge || null,
  };
  lines.push(line);
  renderCart();
  if (line.rateTouched) return;
  // Prefill the rate from the CRM Product's Unit_Price (async, keeps manual edits).
  ZOHO.CRM.API.searchRecord({
    Entity: 'Products', Type: 'criteria',
    Query: '(Product_Code:equals:' + it.sku + ')',
  }).then(function (res) {
    var hit = res && res.data && res.data[0];
    if (hit && findLine(it.id) && !line.rateTouched) {
      line.rate = Number(hit.Unit_Price) || 0;
      renderCart();
    }
  }).catch(function () { /* no prefill */ });
}
function removeFromCart(id) {
  lines = lines.filter(function (l) { return l.id !== id; });
  renderCart();
}
function lineTotal(l) { return l.qty * l.rate * (1 - l.disc / 100); }
function updateTotals() {
  var units = 0, subtotal = 0;
  lines.forEach(function (l) { units += l.qty; subtotal += lineTotal(l); });
  $('line-count').textContent = lines.length;
  $('subtotal-units').textContent = 'Subtotal · ' + units + (units === 1 ? ' unit' : ' units');
  $('subtotal').textContent = subtotal.toFixed(2);
  $('add-btn').disabled = !lines.length;
  $('quote-btn').disabled = !lines.length;
  $('lines-clear').classList.toggle('hidden', !lines.length);
}
$('lines-clear').addEventListener('click', function () {
  lines = [];
  renderCart();
});
function moveLine(i, d) {
  var j = i + d;
  if (j < 0 || j >= lines.length) return;
  var t = lines[i]; lines[i] = lines[j]; lines[j] = t;
  renderCart();
}
function renderCart() {
  var box = $('lines');
  box.innerHTML = '';
  if (!lines.length) box.innerHTML = '<div class="l-empty">No lines yet.<br>Configure a product and add it.</div>';
  lines.forEach(function (it, idx) {
    var card = document.createElement('div');
    card.className = 'l-card';
    var mv = document.createElement('div');
    mv.className = 'l-move';
    [['▲', -1, idx === 0], ['▼', 1, idx === lines.length - 1]].forEach(function (m) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = m[0];
      b.disabled = m[2];
      b.addEventListener('click', function () { moveLine(idx, m[1]); });
      mv.appendChild(b);
    });
    card.appendChild(mv);
    var main = document.createElement('div');
    var top = document.createElement('div');
    top.className = 'l-top';
    var nm = document.createElement('div');
    nm.className = 'l-name';
    nm.textContent = it.name;
    var sk = document.createElement('div');
    sk.className = 'l-sku';
    sk.textContent = it.sku;
    if (it.type) {
      var tb = document.createElement('span');
      tb.className = 'badge type';
      tb.textContent = typeLabel(it.type);
      sk.appendChild(tb);
    }
    if (it.badge) {
      var bd = document.createElement('span');
      bd.className = 'badge ' + (it.badge === 'pending' ? 'pending' : 'books');
      bd.textContent = it.badge === 'pending' ? 'NEW — NOT PUSHED' : 'NEW IN BOOKS';
      sk.appendChild(bd);
    }
    nm.appendChild(sk);
    var x = document.createElement('button');
    x.type = 'button';
    x.className = 'l-x';
    x.textContent = '×';
    x.addEventListener('click', function () { removeFromCart(it.id); });
    top.appendChild(nm); top.appendChild(x);
    main.appendChild(top);
    var grid = document.createElement('div');
    grid.className = 'l-grid';
    var tot = document.createElement('div');
    [['Qty', 'qty', 1], ['Rate', 'rate', 0], ['Disc %', 'disc', 0]].forEach(function (f) {
      var lab = document.createElement('label');
      lab.textContent = f[0];
      var inp = document.createElement('input');
      inp.type = 'number';
      inp.min = f[2];
      if (f[1] === 'disc') inp.max = 100;
      inp.value = it[f[1]];
      inp.addEventListener('input', function () {
        var v = Number(inp.value) || f[2];
        it[f[1]] = f[1] === 'disc' ? Math.min(100, Math.max(0, v)) : v;
        if (f[1] === 'rate') it.rateTouched = true;
        tot.textContent = lineTotal(it).toFixed(2);
        updateTotals(); // in place — a full re-render would drop the input focus
      });
      lab.appendChild(inp);
      grid.appendChild(lab);
    });
    tot.className = 'l-total';
    tot.textContent = lineTotal(it).toFixed(2);
    grid.appendChild(tot);
    main.appendChild(grid);
    card.appendChild(main);
    box.appendChild(card);
  });
  updateTotals();
}

/* ---------- write-back to the Quote ---------- */
function setStatus(text, isError) {
  var s = $('status');
  s.textContent = text;
  s.className = isError ? 'error' : '';
}

// CRM derives the quote line's Size (and the other parameter columns) from the
// Product record — a Size sent on the line itself is ignored. So the Product
// carries the item's parameter values (Size, Design Type, …) and its newline
// description, and an existing product gets them refreshed (catalog wins).
var productCols = null;
function getProductCols() {
  if (productCols) return Promise.resolve(productCols);
  return ZOHO.CRM.META.getFields({ Entity: 'Products' }).then(function (r) {
    productCols = (r && r.fields) || [];
    return productCols;
  }, function () { productCols = []; return productCols; });
}
// Non-fatal problems from a push (a Product whose parameter fields CRM
// rejected, e.g. a value missing from a picklist) — shown after the push
// instead of auto-closing, so the CRM field can be fixed.
var warnings = [];
// CRM's SDK resolves with a per-row code on failure (not a rejection).
function rowError(out) {
  var row = out && out.data && out.data[0];
  if (row && row.code === 'SUCCESS') return null;
  return row ? row.code + ' ' + JSON.stringify(row.details || row.message) : 'no response';
}
function insertProduct(data) {
  return ZOHO.CRM.API.insertRecord({ Entity: 'Products', APIData: data, Trigger: CRM_TRIGGER }).then(function (ins) {
    var e = rowError(ins);
    if (e) throw new Error(e);
    return ins.data[0].details.id;
  });
}
function findOrCreateProduct(it) {
  return getProductCols().then(function () {
    return ZOHO.CRM.API.searchRecord({
      Entity: 'Products', Type: 'criteria',
      Query: '(Product_Code:equals:' + it.sku + ')',
    });
  }).then(function (res) {
    var hit = res && res.data && res.data[0];
    var params = { Description: lineDesc(it) };
    applyParamCols(productCols, it, params);
    // Item Source picklist (Direct Purchase / In-House Manufacturing) from the
    // item's type — only when the org's Products module has the field.
    if (it.type && productCols.some(function (f) { return f.api_name === 'Item_Source'; })) {
      params.Item_Source = typeLabel(it.type);
    }
    if (hit) {
      params.id = hit.id;
      // A failed refresh never blocks the quote line — it is reported instead.
      return ZOHO.CRM.API.updateRecord({ Entity: 'Products', APIData: params, Trigger: CRM_TRIGGER })
        .then(function (out) { var e = rowError(out); if (e) warnings.push(it.sku + ': product fields not updated — ' + e); return hit.id; },
              function (err) { warnings.push(it.sku + ': product fields not updated — ' + errText(err)); return hit.id; });
    }
    var base = { Product_Name: it.name, Product_Code: it.sku, Unit_Price: it.rate || 0 };
    // Parameter fields rejected → still create the bare product so the line lands.
    return insertProduct(Object.assign({}, base, params)).catch(function (err) {
      warnings.push(it.sku + ': product created without parameter fields — ' + errText(err));
      return insertProduct(base);
    }).catch(function (err) { throw new Error('Product create failed for ' + it.sku + ': ' + errText(err)); });
  });
}
// After a successful push: close-and-reload when clean, otherwise stay open
// with the warnings so they can be read.
function finish(msg) {
  if (!warnings.length) { setStatus(msg); ZOHO.CRM.UI.Popup.closeReload(); return; }
  setStatus(msg + ' Close this window to refresh. ' + warnings.join(' | '), true);
}

// Metadata-driven subform discovery: which key holds the standard line items
// (Quotes only — Deals has none), and is there a custom subform to mirror
// item details into (Deals: "Product Information")?
// Cached; a META failure degrades to { stdKey: null, custom: null } and the
// add flow falls back to record-read detection (standard subform only).
var subformInfo = null;
function discoverSubforms() {
  if (subformInfo) return Promise.resolve(subformInfo);
  if (!window.ZOHO || !ZOHO.CRM.META || typeof ZOHO.CRM.META.getFields !== 'function') {
    return Promise.resolve({ stdKey: null, custom: null });
  }
  return ZOHO.CRM.META.getFields({ Entity: moduleName }).then(function (res) {
    var fields = (res && res.fields) || [];
    var subs = fields.filter(function (f) { return f.data_type === 'subform'; });
    var std = null, custom = null, info;
    if (moduleName === 'Quotes') {
      std = subs.find(function (f) { return f.api_name === 'Quoted_Items'; });
      custom = subs.find(function (f) { return f.api_name !== 'Quoted_Items'; });
      // Old-style orgs list no subform field for line items → classic Product_Details.
      info = { stdKey: std ? 'Quoted_Items' : 'Product_Details', custom: null };
    } else {
      // Deals: no standard line-items subform — write only the custom one
      // ("Product Information"; fall back to whatever subform exists).
      custom = subs.find(function (f) {
        return normLabel(f.field_label) === 'productinformation';
      }) || subs[0];
      info = { stdKey: null, custom: null };
    }
    if (!custom) { subformInfo = info; return info; }
    var mod = (custom.subform && custom.subform.module) || custom.api_name;
    return ZOHO.CRM.META.getFields({ Entity: mod }).then(function (r2) {
      var cols = (r2 && r2.fields) || [];
      // A lookup-to-Products column (if any) gets the found/created product id.
      var prodCol = cols.find(function (f) {
        var m = f.lookup && (f.lookup.module && f.lookup.module.api_name || f.lookup.module);
        return f.data_type === 'lookup' && m === 'Products';
      });
      info.custom = { key: custom.api_name, columns: cols, productCol: prodCol ? prodCol.api_name : null };
      subformInfo = info;
      return info;
    }, function () { subformInfo = info; return info; }); // columns unreadable → std only
  }, function () { return { stdKey: null, custom: null }; });
}

// Map a cart line onto the custom subform's columns by display label:
// fixed aliases for sku/name/qty/rate/disc, everything else matched against
// the item's property captions (column "Size" ↔ property "Size", etc.).
function normLabel(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
// Property value for a column: by display label, else by API name
// (Products "Surface_Treatment_G" ↔ property "Surface Treatment (G)").
function colVal(vals, f) {
  var v = vals[normLabel(f.field_label)];
  return v === undefined ? vals[normLabel(f.api_name)] : v;
}
var FIXED_COLS = {
  sku: 'sku', skucode: 'sku', productcode: 'sku', itemcode: 'sku',
  item: 'name', itemname: 'name', name: 'name', productname: 'name', product: 'name',
  qty: 'qty', quantity: 'qty',
  rate: 'rate', price: 'rate', listprice: 'rate', unitprice: 'rate',
  disc: 'disc', discount: 'disc', discountpercent: 'disc',
};
function customRow(custom, line, pid) {
  var columns = custom.columns;
  var vals = paramVals(line);
  var row = {};
  if (custom.productCol && pid) row[custom.productCol] = { id: pid };
  columns.forEach(function (f) {
    if (f.read_only || f.data_type === 'lookup' || f.data_type === 'subform' || f.api_name === 'id') return;
    var l = normLabel(f.field_label);
    var fixed = FIXED_COLS[l];
    var v = fixed ? line[fixed] : colVal(vals, f);
    if (v === undefined || v === null || v === '') return;
    var numeric = f.data_type === 'double' || f.data_type === 'integer' || f.data_type === 'currency';
    row[f.api_name] = numeric ? Number(v) || 0 : String(v);
  });
  return row;
}

// Re-send an existing subform row as { id } only — the row is retained
// unchanged, without echoing back read-only fields (subform update replaces
// all rows; omitted rows are deleted).
function keepRows(rows) {
  return (rows || []).map(function (r) { return r.id ? { id: r.id } : r; });
}

// Zoho SDK rejects with plain objects, not Errors — stringify those.
function errText(err) {
  return err && err.message ? err.message
    : (typeof err === 'object' ? JSON.stringify(err) : String(err));
}

// Writes the cart lines into the current record's subforms.
async function pushLines() {
  setStatus('Reading record…');
  var info = await discoverSubforms();
  var res = await ZOHO.CRM.API.getRecord({ Entity: moduleName, RecordID: recordId });
  var rec = res && res.data && res.data[0];
  if (!rec) throw new Error('Could not read the record.');
  // Metadata names the standard subform; the record-read guess (which fails
  // on empty quotes) is only the META-less fallback, defaulting to v2.
  // Deals has no standard line-items subform — custom rows only.
  var stdKey = moduleName === 'Quotes'
    ? (info.stdKey || (rec.Quoted_Items ? 'Quoted_Items' : 'Product_Details'))
    : null;
  var v3 = stdKey === 'Quoted_Items';
  // A Products record is only needed for the std subform / a Products lookup column.
  var needsProduct = Boolean(stdKey || (info.custom && info.custom.productCol));
  if (!stdKey && !info.custom) throw new Error('No line-item subform found on this ' + moduleName.replace(/s$/, '') + '.');
  // Parameter values (Size etc.) go into the line description column and any
  // matching custom subform columns.
  var stdDescCol = null, stdCols = null;
  if (stdKey) {
    var qMeta = await getQuotesLineMeta();
    if (qMeta.key === stdKey) { stdDescCol = qMeta.descCol; stdCols = qMeta.columns; }
    else if (stdKey === 'Product_Details') stdDescCol = 'product_description';
  }

  var stdRows = [], custRows = [];
  for (var i = 0; i < lines.length; i++) {
    setStatus('Item ' + (i + 1) + ' of ' + lines.length + ': ' + lines[i].sku + '…');
    var pid = needsProduct ? await findOrCreateProduct(lines[i]) : null;
    // CRM's subform Discount is an amount, not a percent.
    var discAmt = lines[i].qty * lines[i].rate * lines[i].disc / 100;
    if (stdKey) {
      var srow = v3
        ? { Product_Name: { id: pid }, Quantity: lines[i].qty, List_Price: lines[i].rate, Discount: discAmt }
        : { product: { id: pid }, quantity: lines[i].qty, list_price: lines[i].rate, Discount: discAmt };
      var d = lineDesc(lines[i]);
      if (d && stdDescCol) srow[stdDescCol] = d;
      applyParamCols(stdCols, lines[i], srow);
      stdRows.push(srow);
    }
    if (info.custom) custRows.push(customRow(info.custom, lines[i], pid));
  }

  setStatus('Updating record…');
  // Subform updates REPLACE all rows — existing rows must be re-sent.
  var upd = { id: recordId };
  if (stdKey) upd[stdKey] = keepRows(rec[stdKey]).concat(stdRows);
  if (info.custom) upd[info.custom.key] = keepRows(rec[info.custom.key]).concat(custRows);
  var out = await ZOHO.CRM.API.updateRecord({ Entity: moduleName, APIData: upd, Trigger: CRM_TRIGGER });
  var row = out && out.data && out.data[0];
  if (!row || row.code !== 'SUCCESS') throw new Error('Update failed: ' + JSON.stringify(row && row.message));
}

$('add-btn').addEventListener('click', async function () {
  var btn = $('add-btn');
  btn.disabled = true;
  try {
    warnings = [];
    await pushLines();
    finish('Done.');
  } catch (err) {
    setStatus(errText(err) || 'Add to ' + moduleName.replace(/s$/, '').toLowerCase() + ' failed.', true);
    btn.disabled = false;
  }
});

/* ---------- Deal → Quote ---------- */
// Quotes line-item metadata: the standard subform key (v3 Quoted_Items vs
// classic Product_Details), its description column, and the Quotes custom
// subform ("Product Information" — where the Size/parameter columns live),
// mirroring discoverSubforms which is bound to the Deal here.
var quotesLineMeta = null;
function getQuotesLineMeta() {
  if (quotesLineMeta) return Promise.resolve(quotesLineMeta);
  var classic = { key: 'Product_Details', v3: false, descCol: 'product_description', columns: null, custom: null };
  return ZOHO.CRM.META.getFields({ Entity: 'Quotes' }).then(function (res) {
    var subs = ((res && res.fields) || []).filter(function (f) { return f.data_type === 'subform'; });
    var std = subs.find(function (f) { return f.api_name === 'Quoted_Items'; });
    var meta = std
      ? { key: 'Quoted_Items', v3: true, descCol: null, columns: null, custom: null }
      : classic;
    var cust = subs.find(function (f) { return normLabel(f.field_label) === 'productinformation'; })
      || subs.find(function (f) { return f.api_name !== 'Quoted_Items'; });

    var loadStd = !std ? Promise.resolve() :
      ZOHO.CRM.META.getFields({ Entity: (std.subform && std.subform.module) || 'Quoted_Items' })
        .then(function (r2) {
          meta.columns = (r2 && r2.fields) || [];
          var desc = meta.columns.find(function (f) {
            return normLabel(f.field_label) === 'description' && !f.read_only;
          });
          meta.descCol = desc ? desc.api_name : null;
        }, function () { /* std columns unreadable — description skipped */ });

    var loadCust = !cust ? Promise.resolve() :
      ZOHO.CRM.META.getFields({ Entity: (cust.subform && cust.subform.module) || cust.api_name })
        .then(function (r3) {
          var cols = (r3 && r3.fields) || [];
          var prodCol = cols.find(function (f) {
            var m = f.lookup && (f.lookup.module && f.lookup.module.api_name || f.lookup.module);
            return f.data_type === 'lookup' && m === 'Products';
          });
          meta.custom = { key: cust.api_name, columns: cols, productCol: prodCol ? prodCol.api_name : null };
        }, function () { /* custom columns unreadable — skipped */ });

    return Promise.all([loadStd, loadCust]).then(function () {
      quotesLineMeta = meta;
      return meta;
    });
  }, function () { quotesLineMeta = classic; return quotesLineMeta; });
}

// One "Caption: Value" line per stored parameter value — the same newline
// convention as the item description (SCHEMA.md) and what the estimate print
// parser splits on.
function lineDesc(l) {
  var vals = l.values || {};
  return Object.keys(vals).map(function (c) { return c + ': ' + vals[c]; }).join('\n');
}

// Map the item's parameter values onto matching subform columns by label
// (column "Size" ↔ property "Size") — same rule as the Deal's custom subform.
// Never overwrites a field the row already carries (qty, rate, description…).
// Column-matchable values of a line: property captions (normalized) plus the
// item type label under "Item Source"/"Item Type" so a plain subform column
// with that label is filled too.
function paramVals(line) {
  var vals = {};
  Object.keys(line.values || {}).forEach(function (cap) { vals[normLabel(cap)] = line.values[cap]; });
  if (line.type) vals.itemsource = vals.itemtype = typeLabel(line.type);
  return vals;
}
function applyParamCols(columns, line, row) {
  if (!columns) return;
  var vals = paramVals(line);
  columns.forEach(function (f) {
    if (f.read_only || f.data_type === 'lookup' || f.data_type === 'subform' || f.api_name === 'id') return;
    if (row[f.api_name] !== undefined) return;
    // A column associated with a Product field (Quoted_Items.Size ↔ Products.Size)
    // is derived by CRM from the product — values sent for it are ignored, so it
    // is left out of the payload; the source value is written onto the Product
    // in findOrCreateProduct instead.
    if (f.association_details && f.association_details.related_field) return;
    var v = colVal(vals, f);
    if (v === undefined || v === null || v === '') return;
    var numeric = f.data_type === 'double' || f.data_type === 'integer' || f.data_type === 'currency';
    row[f.api_name] = numeric ? Number(v) || 0 : String(v);
  });
}

// Creates a new Quote linked to this Deal straight from the cart lines — the
// Deal record itself is not touched (the Deal push button is hidden; its
// pushLines branch is kept but unreachable).
// ponytail: delete the Deals branch of pushLines/discoverSubforms if the Deal
// push never comes back.
$('quote-btn').addEventListener('click', async function () {
  var btn = $('quote-btn');
  btn.disabled = true;
  $('add-btn').disabled = true;
  try {
    warnings = [];
    setStatus('Reading deal…');
    var res = await ZOHO.CRM.API.getRecord({ Entity: 'Deals', RecordID: recordId });
    var deal = res && res.data && res.data[0];
    if (!deal) throw new Error('Could not read the deal.');

    var meta = await getQuotesLineMeta();
    var rows = [], custRows = [];
    for (var i = 0; i < lines.length; i++) {
      setStatus('Item ' + (i + 1) + ' of ' + lines.length + ': ' + lines[i].sku + '…');
      var pid = await findOrCreateProduct(lines[i]);
      // CRM's subform Discount is an amount, not a percent.
      var discAmt = lines[i].qty * lines[i].rate * lines[i].disc / 100;
      var qrow = meta.v3
        ? { Product_Name: { id: pid }, Quantity: lines[i].qty, List_Price: lines[i].rate, Discount: discAmt }
        : { product: { id: pid }, quantity: lines[i].qty, list_price: lines[i].rate, Discount: discAmt };
      var d = lineDesc(lines[i]);
      if (d && meta.descCol) qrow[meta.descCol] = d;
      applyParamCols(meta.columns, lines[i], qrow);
      rows.push(qrow);
      // The Quote's custom subform (Product Information) carries the Size and
      // other parameter columns — same mapping as the Quotes-mode push.
      if (meta.custom) custRows.push(customRow(meta.custom, lines[i], pid));
    }

    setStatus('Creating quote…');
    var data = { Subject: deal.Deal_Name || 'Quote', Deal_Name: { id: recordId } };
    if (deal.Account_Name && deal.Account_Name.id) data.Account_Name = { id: deal.Account_Name.id };
    if (deal.Contact_Name && deal.Contact_Name.id) data.Contact_Name = { id: deal.Contact_Name.id };
    data[meta.key] = rows;
    if (meta.custom) data[meta.custom.key] = custRows;
    var out = await ZOHO.CRM.API.insertRecord({ Entity: 'Quotes', APIData: data, Trigger: CRM_TRIGGER });
    var row = out && out.data && out.data[0];
    if (!row || row.code !== 'SUCCESS') throw new Error('Quote create failed: ' + JSON.stringify(row && row.message));
    finish('Quote created.');
  } catch (err) {
    setStatus(errText(err), true);
    btn.disabled = !lines.length;
    $('add-btn').disabled = !lines.length;
  }
});
</script>
</body>
</html>
