<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>OCTFIS Quote Maker</title>
  <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13.5px; color: #0f172a; background: #e9ecf1; -webkit-font-smoothing: antialiased; }
    .center { display: grid; place-items: center; min-height: 100vh; text-align: center; padding: 24px; }
    .center > div { background: #fff; border-radius: 14px; padding: 32px 40px; box-shadow: 0 1px 2px rgba(15,23,42,.06), 0 12px 40px rgba(15,23,42,.10); }
    .muted { color: #64748b; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
    button { font: inherit; cursor: pointer; border-radius: 7px; border: 1px solid #d9dfe8; background: #fff; padding: 6px 12px; color: #0f172a; }
    button.primary { background: #0f172a; border-color: #0f172a; color: #fff; }
    button.primary:hover:not(:disabled) { background: #1e293b; }
    button:disabled { opacity: .5; cursor: default; }
    input, select { font: inherit; padding: 6px 8px; border: 1px solid #d9dfe8; border-radius: 7px; color: #0f172a; background: #fff; }
    input:focus { outline: none; border-color: #0f766e; }
    .error { color: #c0392b; }
    .hidden { display: none !important; }

    #v-picker { min-height: 100vh; }
    #card { height: 100vh; background: #fff; overflow: hidden; display: flex; flex-direction: column; }

    /* panes: filters | results | quote lines — never wrap, so the right pane's
       footer (Push button) stays on-screen no matter how many lines are added */
    #panes { display: flex; flex: 1; min-height: 0; }
    #left { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 12px; padding: 16px 20px; border-right: 1px solid #e5e7eb; }
    #right { flex: 0 1 320px; min-width: 260px; background: #f8fafc; display: flex; flex-direction: column; min-height: 0; }

    #searchbar { position: relative; flex: none; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 4px 8px 4px 12px; border: 1.5px solid #d9dfe8; border-radius: 10px; min-height: 36px; background: #fff; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
    #searchbar:focus-within { border-color: #0f172a; }
    #search { flex: 1; min-width: 120px; border: 0; padding: 4px 2px; font-size: 14px; }
    /* filter column — every parameter visible at once, own scrollbar (CR-110) */
    #filter-panel { flex: 0 0 250px; min-width: 200px; border-right: 1px solid #e5e7eb; background: #fbfcfe; display: flex; flex-direction: column; min-height: 0; position: relative; }
    #fp-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 0; flex-wrap: wrap; }
    #fp-title { font-size: 15px; font-weight: 600; letter-spacing: -.01em; flex: 1 1 100%; }
    #fp-search { flex: 1; min-width: 0; padding: 5px 9px; font-size: 12.5px; }
    #fp-clear { border: 0; background: none; color: #0f766e; font-size: 12.5px; font-weight: 500; padding: 0; }
    #fp-clear:hover { text-decoration: underline; }
    /* compact rows: click a parameter name → value popover (no inline selects) */
    #fp-grid { display: flex; flex-direction: column; padding: 6px 6px 12px; flex: 1; overflow: auto; }
    .fp-row { display: flex; align-items: center; gap: 7px; width: 100%; border: 0; background: none; text-align: left; padding: 6px 7px; border-radius: 7px; cursor: pointer; font-size: 12.5px; color: #334155; min-width: 0; }
    .fp-row:hover { background: #eef2f7; }
    .fp-row .cap { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
    .fp-row .num { width: 16px; height: 16px; border-radius: 50%; background: #eef2f7; color: #64748b; display: grid; place-items: center; font-size: 9.5px; flex: none; }
    .fp-row .val { flex: none; max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11.5px; color: #94a3b8; }
    .fp-row.set { background: #f0fdfa; }
    .fp-row.set .val { color: #0f766e; font-weight: 600; }
    .fp-row .x { display: none; flex: none; border: 0; background: none; color: #94a3b8; font-size: 13px; line-height: 1; padding: 0 1px; cursor: pointer; }
    .fp-row.set .x { display: block; }
    .fp-row .x:hover { color: #dc2626; }
    .fp-hint { color: #64748b; font-size: 12.5px; padding: 6px 6px 2px; }
    #fp-pop { position: absolute; left: 10px; right: 10px; z-index: 30; background: #fff; border: 1px solid #d9dfe8; border-radius: 10px; box-shadow: 0 8px 24px rgba(15,23,42,.16); display: flex; flex-direction: column; overflow: hidden; }
    #fp-pop .pop-head { font-size: 11.5px; font-weight: 600; color: #64748b; padding: 9px 11px 3px; }
    #fp-pop input { margin: 5px 8px; font-size: 12.5px; padding: 5px 8px; border-radius: 6px; }
    #fp-pop .pop-list { max-height: 250px; overflow: auto; padding: 4px 5px 6px; }
    .fp-opt { padding: 6px 8px; border-radius: 6px; font-size: 12.5px; color: #0f172a; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fp-opt:hover { background: #eef2f7; }
    .fp-opt.on { background: #f0fdfa; color: #0f766e; font-weight: 600; }
    .fp-opt.none { color: #64748b; }

    #result-meta { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font-size: 12.5px; color: #64748b; }
    #clear-btn { border: 0; background: none; color: #0f766e; font-weight: 500; padding: 0; }
    #clear-btn:hover { text-decoration: underline; }
    #results { flex: 1; overflow: auto; border: 1px solid #e5e7eb; border-radius: 10px; min-height: 120px; }
    .r-row { display: flex; align-items: center; gap: 12px; padding: 9px 14px; border-bottom: 1px solid #eef1f5; }
    .r-row:hover { background: #f8fafc; }
    .r-main { flex: 1; min-width: 0; }
    .r-name { font-size: 14px; font-weight: 500; }
    .r-sku { font: 500 12px 'IBM Plex Mono', monospace; color: #64748b; margin-left: 8px; }
    .r-specs { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
    .r-specs span { font-size: 11.5px; color: #334155; background: #f1f5f9; border-radius: 4px; padding: 1px 6px; }
    .r-row > button { width: 92px; flex: none; font-size: 12.5px; font-weight: 500; padding: 6px 0; }
    .r-row > button:hover { background: #0f172a; color: #fff; border-color: #0f172a; }
    .r-row > button.added { border-color: #bbf7d0; background: #f0fdf4; color: #15803d; }
    .r-row > button.added:hover { background: #dcfce7; color: #15803d; border-color: #bbf7d0; }
    .r-empty { padding: 24px; color: #64748b; text-align: center; line-height: 1.5; }

    /* create card */
    #create-box { border: 1.5px dashed #b7c3d3; border-radius: 10px; padding: 14px 16px; background: #f8fafc; display: none; }
    #create-box .title { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; margin-bottom: 10px; }
    #create-box .title .plus { width: 22px; height: 22px; border-radius: 50%; background: #0f172a; color: #fff; display: grid; place-items: center; font-size: 14px; flex: none; }
    #c-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    #c-chips span { font-size: 12px; color: #334155; background: #fff; border: 1px solid #d9dfe8; border-radius: 5px; padding: 3px 8px; }
    #c-chips span .cap { font: 500 10px 'IBM Plex Mono', monospace; color: #64748b; margin-right: 4px; }
    #create-box .row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; align-items: flex-end; }
    #create-box label { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; color: #64748b; font-weight: 500; }
    #c-name-lab { flex: 1; min-width: 180px; }
    #c-rate { width: 100px; text-align: right; }
    #c-info { font-size: 12.5px; color: #64748b; margin-top: 2px; }
    #c-error { margin-top: 2px; font-size: 12.5px; }

    /* quote lines */
    #lines-head { padding: 14px 16px 8px; display: flex; align-items: baseline; justify-content: space-between; font-size: 14.5px; font-weight: 600; }
    #lines-clear { border: 0; background: none; color: #64748b; font-size: 12px; padding: 0; font-weight: 400; }
    #lines-clear:hover { color: #0f172a; }
    #lines { flex: 1; overflow: auto; padding: 0 12px; display: flex; flex-direction: column; gap: 8px; }
    .l-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px 10px 10px 4px; display: grid; grid-template-columns: 18px minmax(0,1fr); gap: 4px; }
    .l-move { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
    .l-move button { border: 0; background: none; color: #94a3b8; font-size: 9px; line-height: 1; padding: 2px; }
    .l-move button:hover:not(:disabled) { color: #0f172a; }
    .l-move button:disabled { opacity: .3; }
    .l-top { display: flex; align-items: flex-start; gap: 8px; }
    .l-name { flex: 1; min-width: 0; font-size: 13px; font-weight: 500; line-height: 1.3; }
    .l-sku { font: 12px 'IBM Plex Mono', monospace; color: #64748b; margin-top: 2px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .badge { font: 500 9.5px 'IBM Plex Sans', sans-serif; letter-spacing: .04em; border-radius: 4px; padding: 1px 5px; }
    .badge.books { color: #b45309; background: #fef3c7; }
    .badge.pending { color: #b91c1c; background: #fee2e2; }
    .l-x { border: 0; background: none; color: #94a3b8; font-size: 15px; line-height: 1; padding: 0 2px; }
    .l-x:hover { color: #dc2626; }
    .l-grid { display: grid; grid-template-columns: 56px 1fr 56px minmax(0,1fr); gap: 6px; align-items: end; margin-top: 8px; }
    .l-grid label { display: flex; flex-direction: column; gap: 3px; font-size: 10.5px; color: #64748b; font-weight: 500; }
    .l-grid input { width: 100%; padding: 5px 7px; text-align: right; border-radius: 6px; font-size: 13px; }
    .l-total { text-align: right; font-size: 13.5px; font-weight: 600; padding-bottom: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .l-empty { margin: 8px 4px; padding: 26px 14px; border: 1.5px dashed #d9dfe8; border-radius: 10px; text-align: center; color: #64748b; line-height: 1.5; }
    #lines-foot { padding: 12px 16px 16px; border-top: 1px solid #e5e7eb; background: #fff; display: flex; flex-direction: column; gap: 10px; }
    #subtotal-row { display: flex; justify-content: space-between; font-size: 12.5px; color: #64748b; }
    #subtotal { color: #0f172a; font-weight: 600; font-size: 14.5px; font-variant-numeric: tabular-nums; }
    #add-btn { padding: 11px 14px; font-size: 13.5px; font-weight: 600; border-radius: 9px; }
    #quote-btn { padding: 10px 14px; font-size: 13px; font-weight: 600; border-radius: 9px; }
    #status { font-size: 12px; color: #0f766e; }
  </style>
</head>
<body>

  <div id="v-loading" class="center"><p class="muted">Loading…</p></div>

  <div id="v-message" class="center hidden"><div>
    <p id="message-text"></p>
    <button id="signin-btn" class="primary hidden">Sign in</button>
  </div></div>

  <div id="v-org" class="center hidden"><div>
    <p>Choose the organization to work in:</p>
    <select id="org-select"></select>
    <button id="org-btn" class="primary">Continue</button>
  </div></div>

  <div id="v-picker" class="hidden"><div id="card">
    <div id="panes">
      <div id="filter-panel">
        <div id="fp-head">
          <span id="fp-title">OCTFIS Quote Maker</span>
          <input id="fp-search" type="search" placeholder="Search parameter…" autocomplete="off" />
          <button id="fp-clear" class="hidden" type="button">Clear all</button>
        </div>
        <div id="fp-grid"><div class="fp-hint">Loading parameters…</div></div>
        <div id="fp-pop" class="hidden"></div>
      </div>
      <div id="left">
        <div id="searchbar">
          <input id="search" type="search" placeholder="Search by SKU or name…" autocomplete="off" />
        </div>
        <div id="result-meta">
          <span id="result-summary">Type to search, or add a filter.</span>
          <button id="clear-btn" class="hidden">Clear search</button>
        </div>
        <div id="results"><div class="r-empty">Type to search, or add a filter.</div></div>
        <div id="create-box">
          <div class="title"><span class="plus">+</span><span id="c-title">No catalog item matches. Create it in Zoho Books</span></div>
          <div id="c-chips"></div>
          <div class="row">
            <label id="c-name-lab">Item name<input id="c-name" /></label>
            <label>SKU<input id="c-sku" class="mono" style="width:170px" /></label>
            <label>Rate<input id="c-rate" type="number" min="0" /></label>
            <label>Type<select id="c-type"><option value="Trading">Trading</option><option value="Manufacturing">Manufacturing (Finished Goods)</option></select></label>
            <label>Industry<select id="c-industry"></select></label>
            <button id="c-save" class="primary">Create &amp; add to lines</button>
          </div>
          <div id="c-info"></div>
          <div id="c-error" class="error"></div>
        </div>
      </div>
      <div id="right">
        <div id="lines-head"><span>Quote lines <span id="line-count" class="muted">0</span></span><button id="lines-clear" class="hidden">Clear</button></div>
        <div id="lines"><div class="l-empty">No lines yet.<br>Add items from the results.</div></div>
        <div id="lines-foot">
          <div id="subtotal-row"><span id="subtotal-units">Subtotal</span><span id="subtotal">0.00</span></div>
          <button id="add-btn" class="primary" disabled>Push to Zoho Quote</button>
          <button id="quote-btn" class="hidden" disabled>Create Quote</button>
          <span id="status"></span>
        </div>
      </div>
    </div>
  </div></div>

<script>
'use strict';
// Served from the same Catalyst origin as the API — nothing env-specific here.
var API = '/server/skuapi';
var APP_ORIGIN = location.origin;

var recordId = null;
var moduleName = 'Quotes';
var lines = []; // [{ id, sku, name, values, qty, rate, disc, rateTouched, badge }] — array so ▲▼ reorder works
var authDone = false;

function findLine(id) { return lines.find(function (l) { return l.id === id; }); }

// Cookie-free auth: the sign-in popup hands over a session token via
// postMessage (third-party cookies never reach this iframe). Held in memory —
// localStorage is only best-effort persistence, since browsers partition or
// block storage inside third-party iframes.
var sessionToken = null;
try { sessionToken = localStorage.getItem('sku_token'); } catch (e) { /* storage blocked */ }

function api(path, opts) {
  opts = opts || {};
  opts.headers = {};
  if (opts.body) opts.headers['Content-Type'] = 'application/json';
  // Token rides the ?t= query param, NOT an Authorization header: Catalyst's
  // gateway hijacks Authorization and rejects anything that isn't a Zoho OAuth
  // token (INVALID_TOKEN 401) before the function ever sees the request.
  if (sessionToken) path += (path.indexOf('?') > -1 ? '&' : '?') + 't=' + encodeURIComponent(sessionToken);
  return fetch(API + path, opts);
}

function show(id) {
  ['v-loading', 'v-message', 'v-org', 'v-picker'].forEach(function (v) {
    document.getElementById(v).classList.toggle('hidden', v !== id);
  });
}
function message(text, withSignin) {
  document.getElementById('message-text').textContent = text;
  document.getElementById('signin-btn').classList.toggle('hidden', !withSignin);
  show('v-message');
}
var $ = function (id) { return document.getElementById(id); };

/* ---------- boot ---------- */
ZOHO.embeddedApp.on('PageLoad', function (data) {
  if (data.Entity !== 'Quotes' && data.Entity !== 'Deals') {
    return message('This widget works on Quotes and Deals only (got: ' + (data.Entity || 'unknown') + ').');
  }
  moduleName = data.Entity;
  // EntityId arrives as a string, an array, or a JSON-stringified array
  // depending on how the widget is launched — normalize all three.
  var eid = data.EntityId;
  if (typeof eid === 'string' && eid.charAt(0) === '[') {
    try { eid = JSON.parse(eid); } catch (e) { /* keep as-is */ }
  }
  recordId = Array.isArray(eid) ? eid[0] : eid;
  if (!recordId) {
    // CreateOrCloneView = unsaved record → no record id to write lines into.
    return message(data.ButtonPosition === 'CreateOrCloneView'
      ? 'This record is not saved yet. Save it first, then open it and use the SKU button from its detail page.'
      : 'Could not read the record id from CRM. PageLoad data: ' + JSON.stringify(data));
  }
  probe();
});
ZOHO.embeddedApp.init();

/* ---------- auth ---------- */
function probe() {
  api('/auth/me').then(function (r) {
    if (r.status === 401) {
      var hadToken = Boolean(sessionToken);
      sessionToken = null;
      try { localStorage.removeItem('sku_token'); } catch (e) { /* storage blocked */ }
      // Distinct messages per failure leg so a report pinpoints where it broke.
      if (authDone) {
        return message(hadToken
          ? 'Sign-in worked but the server rejected the session token. Please try again.'
          : 'Sign-in finished without a session token. Please try again.', true);
      }
      return silentAuth();
    }
    if (!r.ok) return r.json().then(function (d) { message(d.error || ('Error ' + r.status)); });
    return r.json().then(function (me) {
      if (!me.orgId) return orgStep();
      if (!(me.addons || []).includes('sku-generator')) {
        return message('The SKU Generator add-on is not enabled for ' + (me.orgName || 'this organization') + '.');
      }
      startPicker(me);
    });
  }).catch(function () { message('Cannot reach the SKU Generator API.'); });
}

// Token handoff handshake with the OAuth popup/iframe (an /app/ page on our
// origin): it announces 'sku-auth-ready', we reply hello, it sends the token.
window.addEventListener('message', function (e) {
  if (e.origin !== APP_ORIGIN || !e.data) return;
  if (e.data.type === 'sku-auth-ready') {
    e.source.postMessage({ type: 'sku-auth-hello' }, APP_ORIGIN);
  } else if (e.data.type === 'sku-auth-token') {
    var f = $('silent-frame');
    if (f) f.remove();
    if (!e.data.token) {
      // The popup finished but could not mint a session — show its reason.
      return message('Sign-in failed: ' + (e.data.error || 'no session token issued') + '.', true);
    }
    sessionToken = e.data.token;
    try { localStorage.setItem('sku_token', e.data.token); } catch (err) { /* storage blocked */ }
    authDone = true;
    show('v-loading');
    probe();
  }
});

function silentAuth() {
  // Warm Zoho session + prior consent → the OAuth chain completes invisibly in
  // the iframe and posts 'sku-auth-done'. Any rendered Zoho page (login,
  // consent) is frame-blocked, so the timeout falls back to the popup button.
  var f = document.createElement('iframe');
  f.id = 'silent-frame';
  f.name = 'sku-auth';
  f.src = API + '/auth/zoho';
  f.style.display = 'none';
  document.body.appendChild(f);
  setTimeout(function () {
    if (authDone) return;
    f.remove();
    message('Sign in to the SKU Generator to continue.', true);
  }, 6000);
}

$('signin-btn').addEventListener('click', function () {
  var w = window.open(API + '/auth/zoho', 'sku-auth', 'width=620,height=720');
  if (!w) return message('Popup blocked — allow popups for this page, then try again.', true);
  message('Waiting for sign-in to finish…');
});

/* ---------- org selection ---------- */
function orgStep() {
  api('/auth/zoho/orgs').then(function (r) { return r.json(); }).then(function (orgs) {
    if (!Array.isArray(orgs) || !orgs.length) return message('No Zoho Books organization found for this account.');
    if (orgs.length === 1) return selectOrg(orgs[0]);
    var sel = $('org-select');
    sel.innerHTML = '';
    orgs.forEach(function (o, i) {
      var opt = document.createElement('option');
      opt.value = i;
      opt.textContent = o.name;
      sel.appendChild(opt);
    });
    $('org-btn').onclick = function () { selectOrg(orgs[Number(sel.value)]); };
    show('v-org');
  }).catch(function () { message('Failed to load organizations.'); });
}
function selectOrg(o) {
  show('v-loading');
  api('/auth/zoho/select-org', {
    method: 'POST',
    body: JSON.stringify({ orgId: o.organization_id, orgName: o.name }),
  }).then(function () { probe(); });
}

/* ---------- picker ---------- */
var industryId = '';
var params = [];        // showInWidget properties of the chosen industry
var valuesByProp = {};  // propertyId -> [{id, displayValue}] (lazy cache)
var chips = [];         // { propertyId, caption, valueType, valueId?, text?, display }
function startPicker(me) {
  show('v-picker');
  $('search').focus();
  // On Deals, lines can also become a new Quote linked to the Deal.
  if (moduleName === 'Deals') $('quote-btn').classList.remove('hidden');
  // Widget opens as a small CRM popup by default — ask for room to breathe.
  try {
    if (window.ZOHO && ZOHO.CRM.UI && typeof ZOHO.CRM.UI.Resize === 'function') {
      ZOHO.CRM.UI.Resize({ height: '780', width: '1320' }).catch(function () { /* CRM caps it */ });
    }
  } catch (e) { /* older SDK */ }
  discoverSubforms(); // warm the metadata cache; failures surface at add time
  // Org default for the create card's Type select (SKU Settings).
  api('/api/sku-items/settings').then(function (r) { return r.ok ? r.json() : {}; })
    .then(function (s) { if (s.defaultItemType) $('c-type').value = s.defaultItemType; })
    .catch(function () { /* keep Trading */ });
  api('/api/industries').then(function (r) { return r.json(); }).then(function (inds) {
    inds = Array.isArray(inds) ? inds : [];
    inds.forEach(function (ind) {
      var opt = document.createElement('option');
      opt.value = ind.id;
      opt.textContent = ind.name;
      $('c-industry').appendChild(opt);
    });
    // No industry picker in the widget — the first industry is the working one.
    if (inds.length) {
      industryId = String(inds[0].id);
      loadParams();
    } else {
      renderFilterPanel();
    }
  });
}

function loadParams() {
  params = [];
  renderFilterPanel();
  if (!industryId) return;
  api('/api/industries/' + industryId + '/properties')
    .then(function (r) { return r.ok ? r.json() : []; })
    .then(function (list) {
      params = (Array.isArray(list) ? list : []).filter(function (p) { return p.showInWidget; });
      // One batched call fills every property's values (CR-088 endpoint) —
      // never one request per property, the Dev concurrency cap can't take it.
      return api('/api/industries/' + industryId + '/property-values')
        .then(function (r) { return r.ok ? r.json() : {}; })
        .then(function (byProp) { valuesByProp = byProp || {}; renderFilterPanel(); });
    });
}

/* ---------- filter panel (CR-110, compact rows CR) ---------- */
// Every showInWidget parameter is one slim clickable row; clicking opens a
// shared popover with the value list (List) or a free-text input (Range/other).
// State still lives in a detached <select>/<input> per parameter, so
// syncChipsFromPanel + search + create-card code is untouched.
var panelCtrls = {}; // propertyId -> { prop, el, card, val }

function renderFilterPanel() {
  closePop();
  var grid = $('fp-grid');
  grid.innerHTML = '';
  panelCtrls = {};
  if (!industryId) {
    grid.innerHTML = '<div class="fp-hint">No industry is configured for this organization.</div>';
    return syncChipsFromPanel();
  }
  if (!params.length) {
    grid.innerHTML = '<div class="fp-hint">No properties are flagged "Show as CRM widget search filter" for this industry.</div>';
    return syncChipsFromPanel();
  }
  params.forEach(function (p, i) {
    var row = document.createElement('button');
    row.type = 'button';
    row.className = 'fp-row';
    row.dataset.caption = String(p.caption || '').toLowerCase();
    var num = document.createElement('span');
    num.className = 'num';
    num.textContent = i + 1;
    var cap = document.createElement('span');
    cap.className = 'cap';
    cap.textContent = p.caption;
    cap.title = p.caption;
    var val = document.createElement('span');
    val.className = 'val';
    val.textContent = 'Any';
    var x = document.createElement('span');
    x.className = 'x';
    x.textContent = '✕';
    x.title = 'Clear';
    row.appendChild(num);
    row.appendChild(cap);
    row.appendChild(val);
    row.appendChild(x);
    var vals = valuesByProp[p.id] || [];
    var ctrl; // detached state holder — never rendered
    if (vals.length) {
      ctrl = document.createElement('select');
      var any = document.createElement('option');
      any.value = '';
      any.textContent = '— Any —';
      ctrl.appendChild(any);
      vals.forEach(function (v) {
        var o = document.createElement('option');
        o.value = v.id;
        o.textContent = v.displayValue;
        ctrl.appendChild(o);
      });
    } else {
      // No stored values (Range/Manual property) → free text.
      ctrl = document.createElement('input');
    }
    x.addEventListener('click', function (e) {
      e.stopPropagation();
      closePop();
      ctrl.value = '';
      syncChipsFromPanel();
    });
    row.addEventListener('click', function () { openPop(p, row); });
    grid.appendChild(row);
    panelCtrls[p.id] = { prop: p, el: ctrl, card: row, val: val };
  });
  applyParamSearch();
  syncChipsFromPanel();
}

/* value popover — one shared element, anchored to the clicked row */
var popFor = null;      // propertyId the popover is open for
var popCommit = null;   // pending free-text commit, applied on close

function closePop() {
  if (popCommit) { var fn = popCommit; popCommit = null; fn(); }
  $('fp-pop').classList.add('hidden');
  popFor = null;
}

function openPop(p, row) {
  if (popFor === p.id) return closePop(); // second click toggles
  closePop();
  popFor = p.id;
  var c = panelCtrls[p.id];
  var pop = $('fp-pop');
  pop.innerHTML = '';
  var head = document.createElement('div');
  head.className = 'pop-head';
  head.textContent = p.caption;
  pop.appendChild(head);
  var focusEl = null;
  if (c.el.tagName === 'SELECT') {
    var opts = Array.prototype.slice.call(c.el.options);
    var list = document.createElement('div');
    list.className = 'pop-list';
    function renderOpts(q) {
      list.innerHTML = '';
      opts.forEach(function (o) {
        var label = o.textContent;
        if (q && o.value && label.toLowerCase().indexOf(q) === -1) return;
        var d = document.createElement('div');
        d.className = 'fp-opt' + (c.el.value === o.value ? ' on' : '') + (o.value ? '' : ' none');
        d.textContent = label;
        d.addEventListener('click', function () {
          c.el.value = o.value;
          closePop();
          syncChipsFromPanel();
        });
        list.appendChild(d);
      });
    }
    if (opts.length > 9) {
      var filter = document.createElement('input');
      filter.type = 'search';
      filter.placeholder = 'Filter…';
      filter.addEventListener('input', function () { renderOpts(filter.value.trim().toLowerCase()); });
      pop.appendChild(filter);
      focusEl = filter;
    }
    renderOpts('');
    pop.appendChild(list);
  } else {
    // Free text: applied on Enter or when the popover closes.
    var inp = document.createElement('input');
    inp.placeholder = 'Any';
    inp.value = c.el.value;
    popCommit = function () {
      var v = inp.value.trim();
      if (c.el.value !== v) { c.el.value = v; syncChipsFromPanel(); }
    };
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') closePop(); });
    pop.appendChild(inp);
    focusEl = inp;
  }
  pop.classList.remove('hidden');
  // Anchor beside the row, clamped inside the panel.
  var panel = $('filter-panel');
  var top = row.getBoundingClientRect().top - panel.getBoundingClientRect().top;
  pop.style.top = Math.max(8, Math.min(top, panel.clientHeight - pop.offsetHeight - 8)) + 'px';
  if (focusEl) focusEl.focus();
}

document.addEventListener('click', function (e) {
  if (popFor === null) return;
  if ($('fp-pop').contains(e.target)) return;
  var t = e.target;
  while (t && t !== document) { if (t.classList && t.classList.contains('fp-row')) return; t = t.parentNode; }
  closePop();
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePop(); });

function syncChipsFromPanel() {
  chips = [];
  params.forEach(function (p) {
    var c = panelCtrls[p.id];
    if (!c) return;
    var isSel = c.el.tagName === 'SELECT';
    var raw = isSel ? c.el.value : c.el.value.trim();
    c.card.classList.toggle('set', Boolean(raw));
    if (!raw) { c.val.textContent = 'Any'; c.val.title = ''; return; }
    var display = isSel ? c.el.options[c.el.selectedIndex].textContent : raw;
    c.val.textContent = display;
    c.val.title = display;
    if (isSel) {
      chips.push({ propertyId: p.id, caption: p.caption, valueType: p.valueType, valueId: raw, display: display });
    } else {
      chips.push({ propertyId: p.id, caption: p.caption, valueType: p.valueType, text: raw, display: display });
    }
  });
  $('fp-clear').classList.toggle('hidden', !chips.length);
  renderChips();
  triggerSearch(0);
}

function resetPanelControl(propertyId) {
  var c = panelCtrls[propertyId];
  if (c) { c.el.value = ''; c.card.classList.remove('set'); }
}

function applyParamSearch() {
  var q = $('fp-search').value.trim().toLowerCase();
  params.forEach(function (p) {
    var c = panelCtrls[p.id];
    if (c) c.card.classList.toggle('hidden', Boolean(q) && c.card.dataset.caption.indexOf(q) === -1);
  });
}
$('fp-search').addEventListener('input', applyParamSearch);
$('fp-clear').addEventListener('click', function () {
  params.forEach(function (p) { resetPanelControl(p.id); });
  syncChipsFromPanel();
});
// Selections live in the filter panel only (CR: no chips in the search bar) —
// this just keeps the Clear button in sync.
function renderChips() {
  $('clear-btn').classList.toggle('hidden', !chips.length && !$('search').value.trim());
}
$('clear-btn').addEventListener('click', function () {
  params.forEach(function (p) { resetPanelControl(p.id); });
  $('search').value = '';
  syncChipsFromPanel();
});

/* ---------- search ---------- */
var searchTimer = null;
var lastResults = [];
$('search').addEventListener('input', function () { renderChips(); triggerSearch(300); });

function triggerSearch(delay) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runSearch, delay);
}

function runSearch() {
  var q = $('search').value.trim();
  if (!q && !chips.length) {
    lastResults = [];
    $('results').innerHTML = '<div class="r-empty">Type to search, or add a filter.</div>';
    $('result-summary').textContent = 'Type to search, or add a filter.';
    $('create-box').style.display = 'none';
    return;
  }
  var body = { q: q, withValues: true };
  if (industryId) body.industryId = industryId;
  if (chips.length) body.filters = chips.map(function (c) {
    return c.valueId ? { propertyId: c.propertyId, valueId: c.valueId } : { propertyId: c.propertyId, text: c.text };
  });
  api('/api/sku-items/search', { method: 'POST', body: JSON.stringify(body) })
    .then(function (r) { return r.ok ? r.json() : []; })
    .then(function (items) { renderResults(items); });
}

function renderResults(items) {
  lastResults = items;
  var box = $('results');
  box.innerHTML = '';
  $('result-summary').textContent = items.length + (items.length === 1 ? ' item' : ' items');
  items.forEach(function (it) {
    var row = document.createElement('div');
    row.className = 'r-row';
    var main = document.createElement('div');
    main.className = 'r-main';
    var name = document.createElement('div');
    name.className = 'r-name';
    name.textContent = it.name || '';
    var sku = document.createElement('span');
    sku.className = 'r-sku mono';
    sku.textContent = it.sku || '';
    name.appendChild(sku);
    main.appendChild(name);
    var vals = it.values || {};
    var caps = Object.keys(vals);
    if (caps.length) {
      var specs = document.createElement('div');
      specs.className = 'r-specs';
      caps.forEach(function (cap) {
        var s = document.createElement('span');
        s.textContent = cap + ': ' + vals[cap];
        specs.appendChild(s);
      });
      main.appendChild(specs);
    }
    row.appendChild(main);
    var btn = document.createElement('button');
    btn.type = 'button';
    var sync = function () {
      btn.textContent = findLine(it.id) ? '✓ Added' : 'Add';
      btn.className = findLine(it.id) ? 'added' : '';
    };
    sync();
    btn.addEventListener('click', function () {
      if (findLine(it.id)) removeFromCart(it.id); else addToCart(it);
      sync();
    });
    row.appendChild(btn);
    box.appendChild(row);
  });
  var noHit = !items.length;
  if (noHit) box.innerHTML = '<div class="r-empty">No catalog item matches — create it below.</div>';
  $('create-box').style.display = noHit ? 'block' : 'none';
  if (noHit) refreshCreateCard();
}

/* ---------- cart (quote lines) ---------- */
function addToCart(it, opts) {
  opts = opts || {};
  var line = {
    id: it.id, sku: it.sku, name: it.name, values: it.values || {},
    qty: 1, rate: opts.rate || 0, disc: 0,
    rateTouched: Boolean(opts.rate), badge: opts.badge || null,
  };
  lines.push(line);
  renderCart();
  if (line.rateTouched) return;
  // Prefill the rate from the CRM Product's Unit_Price (async, keeps manual edits).
  ZOHO.CRM.API.searchRecord({
    Entity: 'Products', Type: 'criteria',
    Query: '(Product_Code:equals:' + it.sku + ')',
  }).then(function (res) {
    var hit = res && res.data && res.data[0];
    if (hit && findLine(it.id) && !line.rateTouched) {
      line.rate = Number(hit.Unit_Price) || 0;
      renderCart();
    }
  }).catch(function () { /* no prefill */ });
}
function removeFromCart(id) {
  lines = lines.filter(function (l) { return l.id !== id; });
  renderCart();
  renderResults(lastResults); // sync Add/Added buttons
}
function lineTotal(l) { return l.qty * l.rate * (1 - l.disc / 100); }
function updateTotals() {
  var units = 0, subtotal = 0;
  lines.forEach(function (l) { units += l.qty; subtotal += lineTotal(l); });
  $('line-count').textContent = lines.length;
  $('subtotal-units').textContent = 'Subtotal · ' + units + (units === 1 ? ' unit' : ' units');
  $('subtotal').textContent = subtotal.toFixed(2);
  $('add-btn').disabled = !lines.length;
  $('quote-btn').disabled = !lines.length;
  var target = 'Zoho ' + moduleName.replace(/s$/, '');
  $('add-btn').textContent = lines.length
    ? 'Push ' + lines.length + (lines.length === 1 ? ' line' : ' lines') + ' to ' + target
    : 'Push to ' + target;
  $('lines-clear').classList.toggle('hidden', !lines.length);
}
$('lines-clear').addEventListener('click', function () {
  lines = [];
  renderCart();
  renderResults(lastResults);
});
function moveLine(i, d) {
  var j = i + d;
  if (j < 0 || j >= lines.length) return;
  var t = lines[i]; lines[i] = lines[j]; lines[j] = t;
  renderCart();
}
function renderCart() {
  var box = $('lines');
  box.innerHTML = '';
  if (!lines.length) box.innerHTML = '<div class="l-empty">No lines yet.<br>Add items from the results.</div>';
  lines.forEach(function (it, idx) {
    var card = document.createElement('div');
    card.className = 'l-card';
    var mv = document.createElement('div');
    mv.className = 'l-move';
    [['▲', -1, idx === 0], ['▼', 1, idx === lines.length - 1]].forEach(function (m) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = m[0];
      b.disabled = m[2];
      b.addEventListener('click', function () { moveLine(idx, m[1]); });
      mv.appendChild(b);
    });
    card.appendChild(mv);
    var main = document.createElement('div');
    var top = document.createElement('div');
    top.className = 'l-top';
    var nm = document.createElement('div');
    nm.className = 'l-name';
    nm.textContent = it.name;
    var sk = document.createElement('div');
    sk.className = 'l-sku';
    sk.textContent = it.sku;
    if (it.badge) {
      var bd = document.createElement('span');
      bd.className = 'badge ' + (it.badge === 'pending' ? 'pending' : 'books');
      bd.textContent = it.badge === 'pending' ? 'NEW — PUSH PENDING' : 'NEW IN BOOKS';
      sk.appendChild(bd);
    }
    nm.appendChild(sk);
    var x = document.createElement('button');
    x.type = 'button';
    x.className = 'l-x';
    x.textContent = '×';
    x.addEventListener('click', function () { removeFromCart(it.id); });
    top.appendChild(nm); top.appendChild(x);
    main.appendChild(top);
    var grid = document.createElement('div');
    grid.className = 'l-grid';
    var tot = document.createElement('div');
    [['Qty', 'qty', 1], ['Rate', 'rate', 0], ['Disc %', 'disc', 0]].forEach(function (f) {
      var lab = document.createElement('label');
      lab.textContent = f[0];
      var inp = document.createElement('input');
      inp.type = 'number';
      inp.min = f[2];
      if (f[1] === 'disc') inp.max = 100;
      inp.value = it[f[1]];
      inp.addEventListener('input', function () {
        var v = Number(inp.value) || f[2];
        it[f[1]] = f[1] === 'disc' ? Math.min(100, Math.max(0, v)) : v;
        if (f[1] === 'rate') it.rateTouched = true;
        tot.textContent = lineTotal(it).toFixed(2);
        updateTotals(); // in place — a full re-render would drop the input focus
      });
      lab.appendChild(inp);
      grid.appendChild(lab);
    });
    tot.className = 'l-total';
    tot.textContent = lineTotal(it).toFixed(2);
    grid.appendChild(tot);
    main.appendChild(grid);
    card.appendChild(main);
    box.appendChild(card);
  });
  updateTotals();
}

/* ---------- create in Books (generator-backed) ---------- */
// Map chips → the generator's selectedValues: { propertyId: valueROWID | text }.
// Free text on a List property is promoted to its valueId on an exact match
// (saveItemValues silently drops non-ROWID values on List props), else warned.
function buildSelectedValues() {
  var sv = {}, unstored = [];
  chips.forEach(function (c) {
    if (c.valueId) { sv[c.propertyId] = c.valueId; return; }
    var vals = valuesByProp[c.propertyId] || [];
    var hit = vals.find(function (v) {
      return String(v.displayValue).trim().toLowerCase() === String(c.text).trim().toLowerCase();
    });
    if (hit) { sv[c.propertyId] = hit.id; return; }
    sv[c.propertyId] = c.text;
    if (c.valueType === 'List') unstored.push(c.caption);
  });
  return { sv: sv, unstored: unstored };
}
function chipValues() {
  var v = {};
  chips.forEach(function (c) { v[c.caption] = c.display; });
  return v;
}

var gen = null;         // last /api/sku/generate response (null = manual mode)
var lastGenKey = null;  // industry+values key so previews don't re-fire per keystroke
var nameTouched = false, skuTouched = false;
$('c-name').addEventListener('input', function () { nameTouched = true; });
$('c-sku').addEventListener('input', function () { skuTouched = true; });

function setCreateInfo(text, isError) {
  $('c-info').textContent = isError ? '' : (text || '');
  $('c-error').textContent = isError ? text : '';
}

function refreshCreateCard() {
  // chip badges mirror the active filters
  var cb = $('c-chips');
  cb.innerHTML = '';
  chips.forEach(function (c) {
    var s = document.createElement('span');
    var cap = document.createElement('span');
    cap.className = 'cap';
    cap.textContent = c.caption;
    s.appendChild(cap);
    s.appendChild(document.createTextNode(c.display));
    cb.appendChild(s);
  });
  if ($('c-industry').value === '' && industryId) $('c-industry').value = industryId;

  if (!industryId || !chips.length) {
    // Manual mode: plain create, SKU typed by hand.
    gen = null;
    lastGenKey = null;
    $('c-save').disabled = false;
    if (!nameTouched && !$('c-name').value) $('c-name').value = $('search').value.trim();
    setCreateInfo(industryId ? 'Add filters above to auto-generate the SKU from parameters.'
      : 'No industry configured — SKU is typed by hand.');
    return;
  }
  var b = buildSelectedValues();
  var key = industryId + '|' + JSON.stringify(b.sv);
  if (key === lastGenKey) return; // same combination — keep preview AND its disabled verdict
  lastGenKey = key;
  $('c-save').disabled = false;
  gen = null;
  setCreateInfo('Generating SKU preview…');
  api('/api/sku/generate', { method: 'POST', body: JSON.stringify({ industryId: industryId, selectedValues: b.sv }) })
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (res) {
      if (key !== lastGenKey) return; // stale response
      if (!res.ok) return setCreateInfo(res.d.error || 'SKU preview failed.', true);
      gen = res.d;
      if (gen.missingRequired && gen.missingRequired.length) {
        $('c-save').disabled = true;
        return setCreateInfo('Add filters for required parameters: ' + gen.missingRequired.join(', ') + '.', true);
      }
      if (gen.duplicate) {
        $('c-save').disabled = true;
        return setCreateInfo('An item with SKU ' + gen.sku + ' already exists — search for it by SKU.', true);
      }
      if (!nameTouched) $('c-name').value = gen.name || $('search').value.trim();
      if (!skuTouched) $('c-sku').value = gen.sku || '';
      setCreateInfo(b.unstored.length
        ? 'Note: free-text value for ' + b.unstored.join(', ') + ' has no matching list value and won’t be stored.'
        : 'SKU and name generated from the selected parameters — edit if needed.');
    })
    .catch(function () { setCreateInfo('SKU preview failed — network error.', true); });
}

$('c-save').addEventListener('click', async function () {
  var btn = $('c-save');
  btn.disabled = true;
  $('c-error').textContent = '';
  try {
    var name = $('c-name').value.trim();
    var sku = $('c-sku').value.trim();
    var type = $('c-type').value;
    var ind = $('c-industry').value;
    if (!name || !ind) throw new Error('Name and industry are required.');

    // 1. Create the SKU item — generator path stores property values so the
    //    item stays searchable by parameter; manual path is name+SKU only.
    var r, useGen = Boolean(gen && chips.length && industryId);
    if (useGen) {
      if (!sku) sku = gen.sku;
      var b = buildSelectedValues();
      r = await api('/api/sku/create-item', { method: 'POST', body: JSON.stringify({
        name: name, sku: sku, description: gen.description || '', type: type,
        industryId: ind, selectedValues: b.sv,
      }) });
    } else {
      if (!sku) throw new Error('SKU is required.');
      r = await api('/api/sku-items', { method: 'POST', body: JSON.stringify({
        name: name, sku: sku, type: type, industryId: ind,
      }) });
    }
    var d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Create failed.');

    // 2. Push to Zoho Books right away. A failure never blocks the quote —
    //    the item exists locally and can be pushed later from SKU Items.
    var badge = 'books', pushNote = '';
    try {
      var pr = await api('/api/sku-items/' + d.id + '/push-zoho', { method: 'POST', body: '{}' });
      if (!pr.ok) {
        var pd = await pr.json().catch(function () { return {}; });
        throw new Error(pd.error || ('HTTP ' + pr.status));
      }
    } catch (pe) {
      badge = 'pending';
      pushNote = 'Created locally; Books push failed: ' + (pe.message || pe) + '. Push it later from the SKU Items page.';
    }

    // 3. Into the quote lines (CRM Product is created at push-to-quote time).
    addToCart({ id: d.id, sku: d.sku, name: d.name, values: useGen ? chipValues() : {} },
      { badge: badge, rate: Number($('c-rate').value) || 0 });
    setStatus(pushNote, Boolean(pushNote));

    $('create-box').style.display = 'none';
    $('c-rate').value = '';
    nameTouched = skuTouched = false;
    lastGenKey = null;
    triggerSearch(0); // the new item should now show up in results
  } catch (err) {
    $('c-error').textContent = err.message || String(err);
  }
  btn.disabled = false;
});

/* ---------- write-back to the Quote ---------- */
function setStatus(text, isError) {
  var s = $('status');
  s.textContent = text;
  s.className = isError ? 'error' : '';
}

function findOrCreateProduct(it) {
  return ZOHO.CRM.API.searchRecord({
    Entity: 'Products', Type: 'criteria',
    Query: '(Product_Code:equals:' + it.sku + ')',
  }).then(function (res) {
    var hit = res && res.data && res.data[0];
    if (hit) return hit.id;
    return ZOHO.CRM.API.insertRecord({
      Entity: 'Products',
      APIData: { Product_Name: it.name, Product_Code: it.sku, Unit_Price: it.rate || 0 },
      Trigger: [],
    }).then(function (ins) {
      var row = ins && ins.data && ins.data[0];
      if (!row || row.code !== 'SUCCESS') throw new Error('Product create failed for ' + it.sku + ': ' + JSON.stringify(row && row.message));
      return row.details.id;
    });
  });
}

// Metadata-driven subform discovery: which key holds the standard line items
// (Quotes only — Deals has none), and is there a custom subform to mirror
// item details into (Deals: "Product Information")?
// Cached; a META failure degrades to { stdKey: null, custom: null } and the
// add flow falls back to record-read detection (standard subform only).
var subformInfo = null;
function discoverSubforms() {
  if (subformInfo) return Promise.resolve(subformInfo);
  if (!window.ZOHO || !ZOHO.CRM.META || typeof ZOHO.CRM.META.getFields !== 'function') {
    return Promise.resolve({ stdKey: null, custom: null });
  }
  return ZOHO.CRM.META.getFields({ Entity: moduleName }).then(function (res) {
    var fields = (res && res.fields) || [];
    var subs = fields.filter(function (f) { return f.data_type === 'subform'; });
    var std = null, custom = null, info;
    if (moduleName === 'Quotes') {
      std = subs.find(function (f) { return f.api_name === 'Quoted_Items'; });
      custom = subs.find(function (f) { return f.api_name !== 'Quoted_Items'; });
      // Old-style orgs list no subform field for line items → classic Product_Details.
      info = { stdKey: std ? 'Quoted_Items' : 'Product_Details', custom: null };
    } else {
      // Deals: no standard line-items subform — write only the custom one
      // ("Product Information"; fall back to whatever subform exists).
      custom = subs.find(function (f) {
        return normLabel(f.field_label) === 'productinformation';
      }) || subs[0];
      info = { stdKey: null, custom: null };
    }
    if (!custom) { subformInfo = info; return info; }
    var mod = (custom.subform && custom.subform.module) || custom.api_name;
    return ZOHO.CRM.META.getFields({ Entity: mod }).then(function (r2) {
      var cols = (r2 && r2.fields) || [];
      // A lookup-to-Products column (if any) gets the found/created product id.
      var prodCol = cols.find(function (f) {
        var m = f.lookup && (f.lookup.module && f.lookup.module.api_name || f.lookup.module);
        return f.data_type === 'lookup' && m === 'Products';
      });
      info.custom = { key: custom.api_name, columns: cols, productCol: prodCol ? prodCol.api_name : null };
      subformInfo = info;
      return info;
    }, function () { subformInfo = info; return info; }); // columns unreadable → std only
  }, function () { return { stdKey: null, custom: null }; });
}

// Map a cart line onto the custom subform's columns by display label:
// fixed aliases for sku/name/qty/rate/disc, everything else matched against
// the item's property captions (column "Size" ↔ property "Size", etc.).
function normLabel(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
var FIXED_COLS = {
  sku: 'sku', skucode: 'sku', productcode: 'sku', itemcode: 'sku',
  item: 'name', itemname: 'name', name: 'name', productname: 'name', product: 'name',
  qty: 'qty', quantity: 'qty',
  rate: 'rate', price: 'rate', listprice: 'rate', unitprice: 'rate',
  disc: 'disc', discount: 'disc', discountpercent: 'disc',
};
function customRow(custom, line, pid) {
  var columns = custom.columns;
  var vals = {};
  Object.keys(line.values).forEach(function (cap) { vals[normLabel(cap)] = line.values[cap]; });
  var row = {};
  if (custom.productCol && pid) row[custom.productCol] = { id: pid };
  columns.forEach(function (f) {
    if (f.read_only || f.data_type === 'lookup' || f.data_type === 'subform' || f.api_name === 'id') return;
    var l = normLabel(f.field_label);
    var fixed = FIXED_COLS[l];
    var v = fixed ? line[fixed] : vals[l];
    if (v === undefined || v === null || v === '') return;
    var numeric = f.data_type === 'double' || f.data_type === 'integer' || f.data_type === 'currency';
    row[f.api_name] = numeric ? Number(v) || 0 : String(v);
  });
  return row;
}

// Re-send an existing subform row as { id } only — the row is retained
// unchanged, without echoing back read-only fields (subform update replaces
// all rows; omitted rows are deleted).
function keepRows(rows) {
  return (rows || []).map(function (r) { return r.id ? { id: r.id } : r; });
}

// Zoho SDK rejects with plain objects, not Errors — stringify those.
function errText(err) {
  return err && err.message ? err.message
    : (typeof err === 'object' ? JSON.stringify(err) : String(err));
}

// Writes the cart lines into the current record's subforms.
async function pushLines() {
  setStatus('Reading record…');
  var info = await discoverSubforms();
  var res = await ZOHO.CRM.API.getRecord({ Entity: moduleName, RecordID: recordId });
  var rec = res && res.data && res.data[0];
  if (!rec) throw new Error('Could not read the record.');
  // Metadata names the standard subform; the record-read guess (which fails
  // on empty quotes) is only the META-less fallback, defaulting to v2.
  // Deals has no standard line-items subform — custom rows only.
  var stdKey = moduleName === 'Quotes'
    ? (info.stdKey || (rec.Quoted_Items ? 'Quoted_Items' : 'Product_Details'))
    : null;
  var v3 = stdKey === 'Quoted_Items';
  // A Products record is only needed for the std subform / a Products lookup column.
  var needsProduct = Boolean(stdKey || (info.custom && info.custom.productCol));
  if (!stdKey && !info.custom) throw new Error('No line-item subform found on this ' + moduleName.replace(/s$/, '') + '.');
  // Parameter values (Size etc.) go into the line description column and any
  // matching custom subform columns.
  var stdDescCol = null, stdCols = null;
  if (stdKey) {
    var qMeta = await getQuotesLineMeta();
    if (qMeta.key === stdKey) { stdDescCol = qMeta.descCol; stdCols = qMeta.columns; }
    else if (stdKey === 'Product_Details') stdDescCol = 'product_description';
  }

  var stdRows = [], custRows = [];
  for (var i = 0; i < lines.length; i++) {
    setStatus('Item ' + (i + 1) + ' of ' + lines.length + ': ' + lines[i].sku + '…');
    var pid = needsProduct ? await findOrCreateProduct(lines[i]) : null;
    // CRM's subform Discount is an amount, not a percent.
    var discAmt = lines[i].qty * lines[i].rate * lines[i].disc / 100;
    if (stdKey) {
      var srow = v3
        ? { Product_Name: { id: pid }, Quantity: lines[i].qty, List_Price: lines[i].rate, Discount: discAmt }
        : { product: { id: pid }, quantity: lines[i].qty, list_price: lines[i].rate, Discount: discAmt };
      var d = lineDesc(lines[i]);
      if (d && stdDescCol) srow[stdDescCol] = d;
      applyParamCols(stdCols, lines[i], srow);
      stdRows.push(srow);
    }
    if (info.custom) custRows.push(customRow(info.custom, lines[i], pid));
  }

  setStatus('Updating record…');
  // Subform updates REPLACE all rows — existing rows must be re-sent.
  var upd = { id: recordId };
  if (stdKey) upd[stdKey] = keepRows(rec[stdKey]).concat(stdRows);
  if (info.custom) upd[info.custom.key] = keepRows(rec[info.custom.key]).concat(custRows);
  var out = await ZOHO.CRM.API.updateRecord({ Entity: moduleName, APIData: upd, Trigger: [] });
  var row = out && out.data && out.data[0];
  if (!row || row.code !== 'SUCCESS') throw new Error('Update failed: ' + JSON.stringify(row && row.message));
}

$('add-btn').addEventListener('click', async function () {
  var btn = $('add-btn');
  btn.disabled = true;
  try {
    await pushLines();
    setStatus('Done.');
    ZOHO.CRM.UI.Popup.closeReload();
  } catch (err) {
    setStatus(errText(err) || 'Add to ' + moduleName.replace(/s$/, '').toLowerCase() + ' failed.', true);
    btn.disabled = false;
  }
});

/* ---------- Deal → Quote ---------- */
// Quotes line-item metadata: the standard subform key (v3 Quoted_Items vs
// classic Product_Details), its description column, and the Quotes custom
// subform ("Product Information" — where the Size/parameter columns live),
// mirroring discoverSubforms which is bound to the Deal here.
var quotesLineMeta = null;
function getQuotesLineMeta() {
  if (quotesLineMeta) return Promise.resolve(quotesLineMeta);
  var classic = { key: 'Product_Details', v3: false, descCol: 'product_description', columns: null, custom: null };
  return ZOHO.CRM.META.getFields({ Entity: 'Quotes' }).then(function (res) {
    var subs = ((res && res.fields) || []).filter(function (f) { return f.data_type === 'subform'; });
    var std = subs.find(function (f) { return f.api_name === 'Quoted_Items'; });
    var meta = std
      ? { key: 'Quoted_Items', v3: true, descCol: null, columns: null, custom: null }
      : classic;
    var cust = subs.find(function (f) { return normLabel(f.field_label) === 'productinformation'; })
      || subs.find(function (f) { return f.api_name !== 'Quoted_Items'; });

    var loadStd = !std ? Promise.resolve() :
      ZOHO.CRM.META.getFields({ Entity: (std.subform && std.subform.module) || 'Quoted_Items' })
        .then(function (r2) {
          meta.columns = (r2 && r2.fields) || [];
          var desc = meta.columns.find(function (f) {
            return normLabel(f.field_label) === 'description' && !f.read_only;
          });
          meta.descCol = desc ? desc.api_name : null;
        }, function () { /* std columns unreadable — description skipped */ });

    var loadCust = !cust ? Promise.resolve() :
      ZOHO.CRM.META.getFields({ Entity: (cust.subform && cust.subform.module) || cust.api_name })
        .then(function (r3) {
          var cols = (r3 && r3.fields) || [];
          var prodCol = cols.find(function (f) {
            var m = f.lookup && (f.lookup.module && f.lookup.module.api_name || f.lookup.module);
            return f.data_type === 'lookup' && m === 'Products';
          });
          meta.custom = { key: cust.api_name, columns: cols, productCol: prodCol ? prodCol.api_name : null };
        }, function () { /* custom columns unreadable — skipped */ });

    return Promise.all([loadStd, loadCust]).then(function () {
      quotesLineMeta = meta;
      return meta;
    });
  }, function () { quotesLineMeta = classic; return quotesLineMeta; });
}

// "Size: 42 · Colour: Red" from the item's stored parameter values.
function lineDesc(l) {
  var vals = l.values || {};
  return Object.keys(vals).map(function (c) { return c + ': ' + vals[c]; }).join(' · ');
}

// Map the item's parameter values onto matching subform columns by label
// (column "Size" ↔ property "Size") — same rule as the Deal's custom subform.
// Never overwrites a field the row already carries (qty, rate, description…).
function applyParamCols(columns, line, row) {
  if (!columns) return;
  var vals = {};
  Object.keys(line.values || {}).forEach(function (cap) { vals[normLabel(cap)] = line.values[cap]; });
  columns.forEach(function (f) {
    if (f.read_only || f.data_type === 'lookup' || f.data_type === 'subform' || f.api_name === 'id') return;
    if (row[f.api_name] !== undefined) return;
    var v = vals[normLabel(f.field_label)];
    if (v === undefined || v === null || v === '') return;
    var numeric = f.data_type === 'double' || f.data_type === 'integer' || f.data_type === 'currency';
    row[f.api_name] = numeric ? Number(v) || 0 : String(v);
  });
}

// Creates a new Quote linked to this Deal straight from the cart lines — the
// Deal record itself is not touched (use "Push to Zoho Deal" for that).
$('quote-btn').addEventListener('click', async function () {
  var btn = $('quote-btn');
  btn.disabled = true;
  $('add-btn').disabled = true;
  try {
    setStatus('Reading deal…');
    var res = await ZOHO.CRM.API.getRecord({ Entity: 'Deals', RecordID: recordId });
    var deal = res && res.data && res.data[0];
    if (!deal) throw new Error('Could not read the deal.');

    var meta = await getQuotesLineMeta();
    var rows = [], custRows = [];
    for (var i = 0; i < lines.length; i++) {
      setStatus('Item ' + (i + 1) + ' of ' + lines.length + ': ' + lines[i].sku + '…');
      var pid = await findOrCreateProduct(lines[i]);
      // CRM's subform Discount is an amount, not a percent.
      var discAmt = lines[i].qty * lines[i].rate * lines[i].disc / 100;
      var qrow = meta.v3
        ? { Product_Name: { id: pid }, Quantity: lines[i].qty, List_Price: lines[i].rate, Discount: discAmt }
        : { product: { id: pid }, quantity: lines[i].qty, list_price: lines[i].rate, Discount: discAmt };
      var d = lineDesc(lines[i]);
      if (d && meta.descCol) qrow[meta.descCol] = d;
      applyParamCols(meta.columns, lines[i], qrow);
      rows.push(qrow);
      // The Quote's custom subform (Product Information) carries the Size and
      // other parameter columns — same mapping as the Quotes-mode push.
      if (meta.custom) custRows.push(customRow(meta.custom, lines[i], pid));
    }

    setStatus('Creating quote…');
    var data = { Subject: deal.Deal_Name || 'Quote', Deal_Name: { id: recordId } };
    if (deal.Account_Name && deal.Account_Name.id) data.Account_Name = { id: deal.Account_Name.id };
    if (deal.Contact_Name && deal.Contact_Name.id) data.Contact_Name = { id: deal.Contact_Name.id };
    data[meta.key] = rows;
    if (meta.custom) data[meta.custom.key] = custRows;
    var out = await ZOHO.CRM.API.insertRecord({ Entity: 'Quotes', APIData: data, Trigger: [] });
    var row = out && out.data && out.data[0];
    if (!row || row.code !== 'SUCCESS') throw new Error('Quote create failed: ' + JSON.stringify(row && row.message));
    setStatus('Quote created.');
    ZOHO.CRM.UI.Popup.closeReload();
  } catch (err) {
    setStatus(errText(err), true);
    btn.disabled = !lines.length;
    $('add-btn').disabled = !lines.length;
  }
});
</script>
</body>
